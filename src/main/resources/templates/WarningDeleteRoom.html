<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="../css/warning.css">
</head>
<body>
<div class="container">
    <div class="icon">
        <i class="fas fa-exclamation-circle"></i>
    </div>
    <h2>Warning</h2>
    <p>This action cannot be undone. Do you really want to proceed?</p>
    <div class="btn-container">
        <a th:href="@{/admin-dashboard}" class="btn btn-cancel">Cancel</a>
        <a th:href="@{/delete-success}" class="btn btn-proceed">Proceed</a>
    </div>
</div>
</body>
</html>
