<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Management</title>
  <link rel="stylesheet" th:href="@{/css/manage-orders.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body>
<header class="header">
  <div class="header-logo">
    <img src="https://storage.googleapis.com/a1aa/image/D7mJqMZzGflsKTTLJE8INfgTOpkDHXcc_aeuHX02wtU.jpg"
         alt="Cinema logo">
    <span class="header-logo-text">Cinemas</span>
  </div>
  <div class="header-user">
    <img th:src="${userAvatar}" alt="User avatar">
    <span th:text="${userName}">Phan Thuy Ngan</span>
    <button class="logout-btn">Log out</button>
  </div>
</header>

<div class="container">
  <aside class="sidebar">
    <ul class="sidebar-menu">
      <li class="sidebar-item">
        <i class="fas fa-th-large"></i>
        <span>Dashboard</span>
      </li>
      <li class="sidebar-item">
        <i class="fas fa-film"></i>
        <span>Movies</span>
      </li>
      <li class="sidebar-item">
        <i class="fas fa-video"></i>
        <span>Cinemas</span>
      </li>
      <li class="sidebar-item">
        <i class="fas fa-calendar-alt"></i>
        <span>Showtimes</span>
      </li>
      <li class="sidebar-item">
        <i class="fas fa-door-open"></i>
        <span>Rooms</span>
      </li>
      <li class="sidebar-item active">
        <i class="fas fa-receipt"></i>
        <span>Orders</span>
      </li>
      <li class="sidebar-item">
        <i class="fas fa-users"></i>
        <span>Users</span>
      </li>
      <li class="sidebar-item">
        <i class="fas fa-home"></i>
        <span>Homepage</span>
      </li>
    </ul>
  </aside>

  <main class="main-content">
    <div class="content-header">
      <h1 class="text-2xl font-bold">Orders Management</h1>
    </div>

    <div class="filter-section">
      <select th:field="${filterType}">
        <option value="userName">User Name</option>
        <option value="movieTitle">Movie Title</option>
        <option value="theater">Theater</option>
      </select>
      <div class="relative">
        <input type="text" placeholder="Search..." th:field="${searchTerm}">
      </div>
    </div>

    <table class="table">
      <thead>
      <tr>
        <th><input type="checkbox"></th>
        <th>Order Code</th>
        <th>User</th>
        <th>Movie</th>
        <th>Theater</th>
        <th>Room</th>
        <th>Show Date</th>
        <th>Order Value</th>
        <th>Order Date</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="order : ${orders}">
        <td><input type="checkbox"></td>
        <td th:text="${order.orderId}">191108889</td>
        <td th:text="${order.user.fullName}">Christine Brooks</td>
        <td th:text="${order.showtime.movie.title}">Snow White</td>
        <td th:text="${order.showtime.room.cinema.name}">Beta Thanh Xuan</td>
        <td th:text="${order.showtime.room.roomName}">Room 1</td>
        <td th:text="${#dates.format(order.showtime.startTime, 'dd/MM/yyyy')}">15/3/2025</td>
        <td th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT') + ' VND'}">
          360.000 VND</td>
        <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy')}">15/3/2025</td>
      </tr>
      </tbody>
    </table>
  </main>
</div>

</body>
</html>
