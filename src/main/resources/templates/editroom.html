<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Room</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/header_sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/editroom.css}">
</head>

<body>
<!-- Header -->
<div th:replace="~{fragments/header_admin_sidebar :: header_sidebar}"></div>

<div class="container-edit-room">


    <div class="debug-info" th:if="${param.debug}">
        <p>showSuccessOverlay: <span th:text="${showSuccessOverlay}">false</span></p>
        <p>successMessage: <span th:text="${successMessage}">none</span></p>
        <p>Has errors: <span th:text="${#fields.hasErrors('room.*')}">false</span></p>
    </div>

    <div class="card">
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form id="editRoomForm" th:action="@{/edit-room}" th:object="${room}" method="post">
            <h2>Edit Room</h2>
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
            <input type="hidden" th:field="*{roomId}" />

            <div class="form-group">
                <label for="name">Room Name</label>
                <input type="text" class="form-control" id="name" th:field="*{roomName}" required>
                <div class="error-feedback" id="nameError">Please enter a valid room name</div>
                <span class="text-danger" th:if="${#fields.hasErrors('roomName')}" th:errors="*{roomName}"></span>
            </div>

            <div class="form-group">
                <label for="cinema">Cinema</label>
                <select class="form-control" id="cinema" th:field="*{cinema.cinemaId}" required>
                    <option value="">Select Cinema</option>
                    <option th:each="cinema : ${cinemas}" th:value="${cinema.cinemaId}"
                            th:text="${cinema.cinemaName}"
                            th:selected="${room.cinema != null && room.cinema.cinemaId == cinema.cinemaId}">
                    </option>
                </select>
                <div class="error-feedback" id="cinemaError">Please select a cinema</div>
                <span class="text-danger" th:if="${#fields.hasErrors('cinema')}" th:errors="*{cinema}"></span>
            </div>

            <!-- Add other room properties as needed -->

            <div class="button-group">
                <a th:href="@{/manage-rooms}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Room</button>
            </div>
        </form>
    </div>
</div>

<!-- Success Overlay -->
<div id="successOverlay" class="success-overlay" th:classappend="${showSuccessOverlay} ? 'show' : ''">
    <div class="success-container">
        <div class="success-message-box">
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none"
                     stroke="#28a745" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h2 class="success-heading">Update Success!</h2>
            <p class="success-text" th:text="${successMessage ?: 'Success! Room has been updated successfully.'}">
            </p>
            <a th:href="@{/manage-rooms}" class="success-btn primary">Go to Room List</a>
            <a th:href="@{/admin-dashboard}" class="success-btn secondary">Back to Dashboard</a>
        </div>
    </div>
</div>

<script>
    function validateForm() {
        let isValid = true;
        const nameInput = document.getElementById('name');
        const cinemaInput = document.getElementById('cinema');

        if (!nameInput.value.trim()) isValid = false;
        if (!cinemaInput.value) isValid = false;

        return isValid;
    }

    document.addEventListener('DOMContentLoaded', function () {
        // Handle success overlay
        const successOverlay = document.getElementById('successOverlay');
        const showSuccessFlag = document.getElementById('successOverlay').classList.contains('show');

        console.log("Success overlay state:", showSuccessFlag);

        if (showSuccessFlag) {
            document.body.style.overflow = 'hidden';
            successOverlay.style.display = 'flex';
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success') === 'true') {
            successOverlay.classList.add('show');
            document.body.style.overflow = 'hidden';
            successOverlay.style.display = 'flex';
        }

        // Get the form
        const form = document.getElementById('editRoomForm');
        if (form) {
            // Add a submit event listener
            form.addEventListener('submit', function (e) {
                if (!validateForm()) {
                    e.preventDefault();
                    alert('Please fill out all required fields correctly.');
                } else {
                    console.log('Form submitted');
                }
            });
        }
    });
</script>

</body>
</html>
