<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Room</title>
    <link rel="stylesheet" th:href="@{/css/header_sidebar.css}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        body {
            background-color: #1E5631;
            min-height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .container-edit-room {
            margin-left: 270px; /* Adjust based on your sidebar width */
            padding: 20px;
            padding-top: 95px; /* Adjust based on your header height */
        }

        .main-content {
            flex: 1;
            padding: 0 20px;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
            margin-right: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: white;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: none;
            background-color: #e8f5e9;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        select.form-control {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #ccc;
    background-color: #e8f5e9;
    border-radius: 5px;
    font-size: 1rem;
    font-family: 'Poppins', sans-serif;
    box-sizing: border-box;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg fill="black" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 20px;
    cursor: pointer;
    max-width: 100%;
}

/* Style the dropdown options */
select.form-control option {
    padding: 10px;
    font-size: 1rem;
    font-family: 'Poppins', sans-serif;
    background-color: white;
    color: #333;
}

/* Add a hover effect for options */
select.form-control option:hover {
    background-color: #e8f5e9;
}

/* Ensure the select stays within its container */
.form-group {
    position: relative;
    overflow: hidden;
}

        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.3s;
            text-decoration: none;
            display: inline-block;
            margin-right: 10px;
        }

        .btn-secondary {
            background-color: #b26836;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #a05a2c;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background-color: #3d8b40;
        }

        .alert {
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 1rem;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Success Overlay Styles */
        .success-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .success-overlay.show {
            display: flex;
        }

        .success-container {
            width: 90%;
            max-width: 500px;
        }

        .success-message-box {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
        }

        .success-icon img {
            border-radius: 30px;
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }

        .success-heading {
            color: #16a34a;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .success-text {
            color: #4b5563;
            margin-bottom: 20px;
        }

        .success-btn {
            display: block;
            width: 95%;
            text-align: center;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s ease-in-out;
            text-decoration: none;
        }

        .success-btn.primary {
            background-color: #22c55e;
            color: white;
        }

        .success-btn.primary:hover {
            background-color: #16a34a;
        }

        .success-btn.secondary {
            background-color: #e5e7eb;
            color: #374151;
        }

        .success-btn.secondary:hover {
            background-color: #d1d5db;
        }

        /* Form validation styles */
        .error-feedback {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }

        .is-invalid {
            border-color: #dc3545 !important;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container-edit-room {
                margin-left: 0;
                padding-top: 60px;
            }

            .main-content {
                padding: 10px;
            }

            .card {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .success-message-box {
                padding: 15px;
            }

            .success-heading {
                font-size: 1.3rem;
            }

            .success-btn {
                font-size: 0.9rem;
                padding: 8px;
            }

            .button-group {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                width: 100%;
                margin-right: 0;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
<!-- Include your header/navigation here -->
<div th:replace="~{fragments/header_admin_sidebar :: header_sidebar}"></div>

<div class="container-edit-room">
    <h2>Edit Room</h2>

    <!-- Debug information - remove in production -->
    <div class="debug-info" th:if="${param.debug}">
        <p>showSuccessOverlay: <span th:text="${showSuccessOverlay}">false</span></p>
        <p>successMessage: <span th:text="${successMessage}">none</span></p>
        <p>Has errors: <span th:text="${#fields.hasErrors('room.*')}">false</span></p>
    </div>

    <div class="card">
        <!-- Display error message if available -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Display success message even if overlay doesn't work -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form id="editRoomForm" th:action="@{/edit-room}" th:object="${room}" method="post">
            <!-- Add CSRF token if using Spring Security -->
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

            <!-- Hidden ID field to identify which room to update -->
            <input type="hidden" th:field="*{roomId}" />

            <div class="form-group">
                <label for="name">Room Name</label>
                <input type="text" class="form-control" id="name" th:field="*{roomName}" required>
                <div class="error-feedback" id="nameError">Please enter a valid room name</div>
                <span class="text-danger" th:if="${#fields.hasErrors('roomName')}" th:errors="*{roomName}"></span>
            </div>

            <div class="form-group">
                <label for="cinema">Cinema</label>
                <select class="form-control" id="cinema" th:field="*{cinema.cinemaId}" required>
                    <option value="">Select Cinema</option>
                    <option th:each="cinema : ${cinemas}"
                            th:value="${cinema.cinemaId}"
                            th:text="${cinema.cinemaName}"
                            th:selected="${room.cinema != null && room.cinema.cinemaId == cinema.cinemaId}">
                    </option>
                </select>
                <div class="error-feedback" id="cinemaError">Please select a cinema</div>
                <span class="text-danger" th:if="${#fields.hasErrors('cinema')}" th:errors="*{cinema}"></span>
            </div>

            <!-- Add other room properties as needed -->

            <div class="button-group">
                <a th:href="@{/manage-rooms}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Room</button>
            </div>
        </form>
    </div>
</div>

<!-- Success Overlay -->
<div id="successOverlay" class="success-overlay" th:classappend="${showSuccessOverlay} ? 'show' : ''">
    <div class="success-container">
        <div class="success-message-box">
            <div class="success-icon">
                <!-- Use a local image or an inline SVG for reliability -->
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#28a745" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h2 class="success-heading">Update Success!</h2>
            <p class="success-text" th:text="${successMessage ?: 'Success! Room has been updated successfully.'}"></p>
            <a th:href="@{/manage-rooms}" class="success-btn primary">Go to Room List</a>
            <a th:href="@{/admin-dashboard}" class="success-btn secondary">Back to Dashboard</a>
        </div>
    </div>
</div>

<!-- JavaScript for validation and overlay handling -->
<script>
    // Form validation function - simplified to ensure it's not blocking submission
    function validateForm() {
        let isValid = true;
        const nameInput = document.getElementById('name');
        const cinemaInput = document.getElementById('cinema');

        // Basic validation
        if (!nameInput.value.trim()) isValid = false;
        if (!cinemaInput.value) isValid = false;

        return isValid;
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Handle success overlay
        const successOverlay = document.getElementById('successOverlay');
        const showSuccessFlag = document.getElementById('successOverlay').classList.contains('show');

        console.log("Success overlay state:", showSuccessFlag);

        if (showSuccessFlag) {
            // Prevent scrolling when overlay is shown
            document.body.style.overflow = 'hidden';

            // Make sure it's visible
            successOverlay.style.display = 'flex';
        }

        // If there's a URL parameter for success, show the overlay
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success') === 'true') {
            successOverlay.classList.add('show');
            document.body.style.overflow = 'hidden';
            successOverlay.style.display = 'flex';
        }

        // Get the form
        const form = document.getElementById('editRoomForm');
        if (form) {
            // Add a submit event listener
            form.addEventListener('submit', function(e) {
                // Basic validation
                if (!validateForm()) {
                    e.preventDefault();
                    alert('Please fill out all required fields correctly.');
                } else {
                    console.log('Form submitted');
                    // Let the form submit normally
                    // You can add a loading indicator here if needed
                }
            });
        }
    });
</script>
</body>
</html>
