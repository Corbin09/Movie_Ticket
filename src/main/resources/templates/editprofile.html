<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile</title>
  <link rel="stylesheet" th:href="@{/css/editprofile.css}">
</head>

<body>
<div class="profile-container" th:if="${user != null}">
  <div class="profile-header">
    <div class="profile-avatar">
      <!-- Custom avatar with smile -->
      <div class="smile"></div>
    </div>
  </div>

  <div class="profile-content">
    <div class="profile-field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" th:value="${user.username}" readonly>
    </div>

    <div class="profile-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" th:value="${user.email}" readonly>
    </div>

    <div class="profile-field">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" th:value="${user.phoneNumber}" readonly>
    </div>

    <div class="profile-actions">
      <a th:href="@{/user/edit-profile}">
        <button class="edit-btn">Edit Profile</button>
      </a>
      <a th:href="@{/user/detail-profile}">
        <button class="view-btn">View Profile</button>
      </a>
    </div>
  </div>
</div>

</body>
</html>
