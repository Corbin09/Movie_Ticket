<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <style>
        /* Global Styles */
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: Arial, sans-serif;
        }

        body {
          background-color: #f5f5f5;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
        }

        /* Profile Container */
        .profile-container {
          width: 100%;
          max-width: 400px;
          border-radius: 8px;
          overflow: hidden;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
          background-color: white;
          border: 1px solid #e0e0e0;
          border-bottom: 4px solid #45c486;
        }

        /* Profile Header */
        .profile-header {
          background-color: #0f4d2e; /* Dark green color from the image */
          height: 100px;
          position: relative;
        }

        .profile-avatar {
          width: 80px;
          height: 80px;
          background-color: #e9f3d9; /* Light green for the avatar background */
          border-radius: 50%;
          position: absolute;
          top: 60px;
          left: 50%;
          transform: translateX(-50%);
          border: 3px solid white;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
          position: relative;
        }

        /* Profile Content */
        .profile-content {
          padding: 50px 20px 20px;
        }

        .profile-field {
          margin-bottom: 15px;
        }

        .profile-field label {
          display: block;
          font-size: 14px;
          font-weight: bold;
          margin-bottom: 5px;
          color: #333;
        }

        .profile-field input {
          width: 100%;
          padding: 10px 15px;
          border: 1px solid #ddd;
          border-radius: 4px;
          font-size: 16px;
          color: #333;
          outline: none;
        }

        /* Avatar design - custom smiley face to match the image */
        .profile-avatar::before {
          content: "";
          position: absolute;
          width: 10px;
          height: 10px;
          background-color: #c95b5b;
          border-radius: 50%;
          top: 28px;
          left: 25px;
        }

        .profile-avatar::after {
          content: "";
          position: absolute;
          width: 10px;
          height: 10px;
          background-color: #c95b5b;
          border-radius: 50%;
          top: 28px;
          left: 45px;
        }

        /* Adding the smile */
        .profile-avatar .smile {
          position: absolute;
          width: 25px;
          height: 12px;
          border-bottom: 2px solid #c95b5b;
          border-radius: 50%;
          top: 45px;
          left: 27px;
        }

        /* Profile Actions */
        .profile-actions {
          display: flex;
          gap: 10px;
          margin-top: 25px;
          justify-content: center;
        }

        .profile-actions button {
          padding: 12px 15px;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          font-weight: bold;
          transition: background-color 0.3s;
          font-size: 14px;
        }

        .edit-btn {
          background-color: #0f4d2e; /* Dark green color from the image */
          color: white;
          flex: 1;
          max-width: 135px;
        }

        .edit-btn:hover {
          background-color: #0a3b23;
        }

        .view-btn {
          background-color: #0f4d2e; /* Dark green color from the image */
          color: white;
          flex: 1;
          max-width: 135px;
        }

        .view-btn:hover {
          background-color: #0a3b23;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
          .profile-container {
            max-width: 90%;
          }

          .profile-avatar {
            width: 70px;
            height: 70px;
          }

          .profile-avatar::before {
            width: 8px;
            height: 8px;
            top: 25px;
            left: 22px;
          }

          .profile-avatar::after {
            width: 8px;
            height: 8px;
            top: 25px;
            left: 40px;
          }

          .profile-avatar .smile {
            width: 22px;
            height: 10px;
            top: 40px;
            left: 24px;
          }

          .profile-content {
            padding: 45px 15px 15px;
          }

          .profile-actions {
            flex-direction: row;
            align-items: center;
          }

          .profile-actions button {
            width: 100%;
            max-width: 45%;
          }
        }
    </style>
</head>

<body>
<div class="profile-container" th:if="${user != null}">
    <div class="profile-header">
        <div class="profile-avatar">
            <!-- Custom avatar with smile -->
            <div class="smile"></div>
        </div>
    </div>

    <div class="profile-content">
        <div class="profile-field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" th:value="${user.username}" readonly>
        </div>

        <div class="profile-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" th:value="${user.email}" readonly>
        </div>

        <div class="profile-field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" th:value="${user.phoneNumber}" readonly>
        </div>

        <div class="profile-actions">
            <a th:href="@{/user/edit-profile}">
                <button class="edit-btn">Edit Profile</button>
            </a>
            <a th:href="@{/user/view-profile}">
                <button class="view-btn">View Profile</button>
            </a>
        </div>
    </div>
</div>
</body>
</html>
