<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Register</title>
  <link rel="stylesheet" th:href="@{/css/register.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<div class="welcome-text">
  Welcome.<br>
  Begin your cinematic adventure now with our ticketing platform!
</div>

<!-- Registration Success Message -->
<div class="register-container" th:if="${param.registered}" style="display: none;">
  <div class="registration-success">
    <h3>Registration Successful!</h3>
    <p>Your account has been created successfully.</p>
    <a th:href="@{/login}" class="back-to-login-btn">Back to Login</a>
  </div>
</div>

<!-- Register Form -->
<div class="register-container" th:unless="${param.registered}">
  <h2 class="form-title">Register</h2>
  <form id="registerForm" th:action="@{/register}" method="post" onsubmit="return validateForm()">

    <div class="form-group">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required>
      <div class="field-error" id="username-error"></div>
      <div class="field-error" th:if="${usernameError}" th:text="${usernameError}"></div>
    </div>

    <div class="form-group">
      <label for="password">Password:</label>
      <div class="password-field">
        <input type="password" id="password" name="password" required>
        <i id="togglePassword" class="fas fa-eye-slash toggle-password"></i>
      </div>
      <div class="field-error" id="password-error"></div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password:</label>
      <div class="password-field">
        <input type="password" id="confirmPassword" name="confirmPassword" required>
        <i id="toggleConfirmPassword" class="fas fa-eye-slash toggle-password"></i>
      </div>
      <div class="field-error" id="confirmPassword-error"></div>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email">
      <div class="field-error" id="email-error"></div>
      <div class="field-error" th:if="${emailError}" th:text="${emailError}"></div>
    </div>

    <div class="form-group">
      <label for="phoneNumber">Phone Number:</label>
      <input type="text" id="phoneNumber" name="phoneNumber">
      <div class="field-error" id="phoneNumber-error"></div>
    </div>

    <div class="form-group">
      <label for="userImg">Profile Image URL:</label>
      <input type="text" id="userImg" name="userImg" placeholder="Enter image URL">
      <div class="field-error" id="userImg-error"></div>
    </div>

    <div class="form-group">
      <label for="sex">Gender:</label>
      <select id="sex" name="sex">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="dateOfBirth">Date of Birth:</label>
      <input type="date" id="dateOfBirth" name="dateOfBirth">
      <div class="field-error" id="dateOfBirth-error"></div>
    </div>

    <input type="hidden" name="role" value="USER">

    <input type="hidden" name="status" value="ACTIVE">

    <button type="submit" class="submit-btn">Register</button>

    <div class="login-link">
      Already Have An Account? <a th:href="@{/login}">Log In</a>
    </div>
  </form>

  <!-- General Error Message -->
  <div th:if="${error}" class="success-message" style="color: #f44336;" th:text="${error}"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
      // Password toggle visibility function for password field
      const passwordInput = document.getElementById('password');
      const togglePassword = document.getElementById('togglePassword');

      togglePassword.addEventListener('click', function () {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);

          // Toggle icon classes
          if (type === 'password') {
              togglePassword.classList.remove('fa-eye');
              togglePassword.classList.add('fa-eye-slash');
          } else {
              togglePassword.classList.remove('fa-eye-slash');
              togglePassword.classList.add('fa-eye');
          }
      });

      // Password toggle visibility function for confirm password field
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');

      toggleConfirmPassword.addEventListener('click', function () {
          const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          confirmPasswordInput.setAttribute('type', type);

          // Toggle icon classes
          if (type === 'password') {
              toggleConfirmPassword.classList.remove('fa-eye');
              toggleConfirmPassword.classList.add('fa-eye-slash');
          } else {
              toggleConfirmPassword.classList.remove('fa-eye-slash');
              toggleConfirmPassword.classList.add('fa-eye');
          }
      });

      // Clear error messages when input changes
      const inputs = document.querySelectorAll('input');
      inputs.forEach(input => {
          input.addEventListener('input', function () {
              const errorElement = document.getElementById(input.id + '-error');
              if (errorElement) {
                  errorElement.textContent = '';
              }
              input.style.borderColor = '#ccc';
          });
      });
  });

  function validateForm() {
      let isValid = true;

      // Clear all previous error messages
      const errorElements = document.querySelectorAll('.field-error');
      errorElements.forEach(el => el.textContent = '');

      const inputs = document.querySelectorAll('input');
      inputs.forEach(input => input.style.borderColor = '#ccc');

      // Username validation
      const username = document.getElementById('username');
      if (!username.value.trim()) {
          showError(username, 'Username is required');
          isValid = false;
      }

      // Password validation
      const password = document.getElementById('password');
      if (!password.value) {
          showError(password, 'Password is required');
          isValid = false;
      } else if (password.value.length < 6) {
          showError(password, 'Password must be at least 6 characters');
          isValid = false;
      }

      // Confirm password validation
      const confirmPassword = document.getElementById('confirmPassword');
      if (password.value !== confirmPassword.value) {
          showError(confirmPassword, 'Passwords do not match');
          isValid = false;
      }

      const email = document.getElementById('email');
      if (email.value && !isValidEmail(email.value)) {
          showError(email, 'Please enter a valid email address');
          isValid = false;
      }

      const phoneNumber = document.getElementById('phoneNumber');
      if (phoneNumber.value && !isValidPhoneNumber(phoneNumber.value)) {
          showError(phoneNumber, 'Please enter a valid phone number');
          isValid = false;
      }

      const userImg = document.getElementById('userImg');
      if (userImg.value && !isValidURL(userImg.value)) {
          showError(userImg, 'Please enter a valid URL');
          isValid = false;
      }

      return isValid;
  }

  function showError(input, message) {
      input.style.borderColor = '#f44336';
      const errorElement = document.getElementById(input.id + '-error');
      if (errorElement) {
          errorElement.textContent = message;
      }
  }

  function isValidEmail(email) {
      const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
      return re.test(email);
  }

  function isValidPhoneNumber(phone) {
      const re = /^[\+]?[(]?[0-9]{3}[)]?[-\s\.]?[0-9]{3}[-\s\.]?[0-9]{4,6}$/;
      return re.test(phone);
  }

  function isValidURL(url) {
      try {
          new URL(url);
          return true;
      } catch (e) {
          return false;
      }
  }

  if (window.location.href.includes('?registered')) {
      document.querySelector('.register-container').style.display = 'none';
      document.querySelector('.register-container[style]').style.display = 'block';
  }
</script>

</body>
</html>
