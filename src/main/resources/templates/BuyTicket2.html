<body>
<div class="buy-ticket">
    <div class="frame">
        <div class="overlap">
            <div class="overlap-group">
                <div class="div">
                    <div class="ellipse"></div>
                    <img class="image" th:src="@{/api/placeholder/1280/258}" alt="Movie background" />
                    <div class="rectangle"></div>
                    <img class="img" th:src="@{/api/placeholder/354/487}" alt="Movie poster" />
                    <div class="text-wrapper" th:text="${movie != null ? film.filmName : 'INUYASHA'}">INUYASHA</div>
                </div>
                <div class="line-wrapper"><div class="line"></div></div>
                <div class="frame-2">
                    <div class="group">
                        <div class="div-wrapper">
                            <div class="text-wrapper-2">01</div>
                        </div>
                        <div class="text-wrapper-3">PICK SEAT</div>
                    </div>
                    <div class="group-2">
                        <div class="overlap-2">
                            <div class="text-wrapper-2">02</div>
                        </div>
                        <div class="text-wrapper-3">POPCORNS</div>
                    </div>
                    <div class="group-3">
                        <div class="div-wrapper">
                            <div class="text-wrapper-2">03</div>
                        </div>
                        <div class="text-wrapper-3">PAY</div>
                    </div>
                    <div class="group-4">
                        <div class="div-wrapper">
                            <div class="text-wrapper-2">04</div>
                        </div>
                        <div class="text-wrapper-3">TICKET</div>
                    </div>
                </div>
            </div>

            <!-- Combo Container -->
            <div class="combo-container" id="comboContainer">
                <!-- Combos will be dynamically added here by Thymeleaf -->
                <div th:each="page, pageStat : ${#numbers.sequence(1, (combos.size() + 5) / 6)}"
                     th:id="'page-' + ${pageStat.count}"
                     th:class="${pageStat.count == 1 ? '' : 'hidden'}">

                    <div class="combo-row">
                        <div th:each="combo, comboStat : ${combos}"
                             th:if="${comboStat.index >= (pageStat.count-1)*6 && comboStat.index < (pageStat.count-1)*6 + 3 && comboStat.index < combos.size()}"
                             class="combo-box"
                             th:data-name="${combo.comboName}"
                             th:data-price="${combo.comboPrice}"
                             th:data-id="${combo.comboId}">
                            <div class="combo-content">
                                <img class="combo-image" th:src="@{/api/placeholder/160/110}" th:alt="${combo.comboName}" />
                                <div class="combo-name" th:text="${combo.comboName}">COMBO NAME</div>
                                <div class="combo-price" th:text="'$' + ${combo.comboPrice}">$15</div>
                            </div>
                        </div>
                    </div>

                    <div class="combo-row">
                        <div th:each="combo, comboStat : ${combos}"
                             th:if="${comboStat.index >= (pageStat.count-1)*6 + 3 && comboStat.index < (pageStat.count-1)*6 + 6 && comboStat.index < combos.size()}"
                             class="combo-box"
                             th:data-name="${combo.comboName}"
                             th:data-price="${combo.comboPrice}"
                             th:data-id="${combo.comboId}">
                            <div class="combo-content">
                                <img class="combo-image" th:src="@{/api/placeholder/160/110}" th:alt="${combo.comboName}" />
                                <div class="combo-name" th:text="${combo.comboName}">COMBO NAME</div>
                                <div class="combo-price" th:text="'$' + ${combo.comboPrice}">$15</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="combo">
                <div class="overlap-5">
                    <div class="text-wrapper-8" id="chosenComboText">None</div>
                    <div class="text-wrapper-9">Chosen Combos:</div>
                </div>
            </div>
        </div>
        <div class="overlap-6">
            <div class="ellipse-2"></div>
            <div class="price">
                <div class="overlap-7">
                    <div class="text-wrapper-10" id="totalPrice">$0</div>
                    <div class="text-wrapper-11">Total:</div>
                </div>
            </div>
            <div class="group-5">
                <div class="overlap-8">
                    <div class="rectangle-2"></div>
                    <a th:href="@{/cancel}" class="CANCEL">
                        <span class="span">CANCEL</span>
                    </a>
                </div>
                <div class="group-wrapper">
                    <div class="group-6">
                        <a th:href="@{/payment}" id="nextButton" class="overlap-group-2">
                            <div class="text-wrapper-13">NEXT</div>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="paginationContainer">
            <div class="div-2" id="prevButton"><div class="img-2">←</div></div>

            <!-- Page numbers will be dynamically generated -->
            <th:block th:each="page, pageStat : ${#numbers.sequence(1, (combos.size() + 5) / 6)}">
                <div th:class="${pageStat.count == 1 ? 'page' : 'div-2'}"
                     th:data-page="${pageStat.count}">
                    <div th:class="${pageStat.count == 1 ? 'date' : 'date-2'}"
                         th:text="${pageStat.count}">1</div>
                </div>
            </th:block>

            <div class="div-2" id="next"><div class="img-2">→</div></div>
        </div>
    </div>
</div>

<!-- Form to submit selected combo data -->
<form id="comboForm" th:action="@{/savePopcornOrder}" method="post">
    <input type="hidden" id="selectedCombosInput" name="selectedCombos" />
    <!-- Hidden input for order ID if needed -->
    <input type="hidden" name="orderId" th:value="${orderId}" />
</form>

<script th:inline="javascript">
    // Get elements
    const comboContainer = document.getElementById('comboContainer');
    const chosenComboText = document.getElementById('chosenComboText');
    const totalPriceElement = document.getElementById('totalPrice');
    const nextButton = document.getElementById('nextButton');
    const comboForm = document.getElementById('comboForm');
    const selectedCombosInput = document.getElementById('selectedCombosInput');
    const prevButton = document.getElementById('prevButton');
    const nextPageButton = document.getElementById('nextButton');

    // Get combos from Thymeleaf model
    const combos = /*[[${combos}]]*/ [];

    // Current page
    let currentPage = 1;
    const totalPages = Math.ceil(combos.length / 6);

    // Selected combos
    const selectedCombos = [];

    // Initialize combo boxes click events
    document.querySelectorAll('.combo-box').forEach(comboBox => {
      comboBox.addEventListener('click', () => {
        const isSelected = comboBox.classList.toggle('selected');
        const comboId = comboBox.dataset.id;
        const comboName = comboBox.dataset.name;
        const comboPrice = parseFloat(comboBox.dataset.price);

        if (isSelected) {
          selectedCombos.push({
            id: comboId,
            name: comboName,
            price: comboPrice,
            quantity: 1
          });
        } else {
          const index = selectedCombos.findIndex(item => item.id === comboId);
          if (index !== -1) {
            selectedCombos.splice(index, 1);
          }
        }

        updateChosenCombos();
      });
    });

    // Update chosen combos display
    function updateChosenCombos() {
      if (selectedCombos.length === 0) {
        chosenComboText.textContent = 'None';
        totalPriceElement.textContent = '$0';
      } else {
        // Update chosen combo text
        const comboNames = selectedCombos.map(combo => combo.name);
        chosenComboText.textContent = comboNames.join(', ');

        // Update total price
        const totalPrice = selectedCombos.reduce((sum, combo) => sum + (combo.price * combo.quantity), 0);
        totalPriceElement.textContent = '$' + totalPrice.toFixed(2);
      }

      // Update hidden input with JSON data
      selectedCombosInput.value = JSON.stringify(selectedCombos);
    }

    // Handle pagination
    document.querySelectorAll('.pagination [data-page]').forEach(pageButton => {
      pageButton.addEventListener('click', () => {
        const pageNum = parseInt(pageButton.dataset.page);
        changePage(pageNum);
      });
    });

    // Previous page button
    prevButton.addEventListener('click', () => {
      if (currentPage > 1) {
        changePage(currentPage - 1);
      }
    });

    // Next page button
    nextPageButton.addEventListener('click', () => {
      if (currentPage < totalPages) {
        changePage(currentPage + 1);
      }
    });

    // Change page function
    function changePage(pageNum) {
      // Hide current page
      document.getElementById(`page-${currentPage}`).classList.add('hidden');

      // Show selected page
      document.getElementById(`page-${pageNum}`).classList.remove('hidden');

      // Update pagination UI
      document.querySelector(`.pagination [data-page="${currentPage}"]`).classList.remove('page');
      document.querySelector(`.pagination [data-page="${currentPage}"]`).classList.add('div-2');
      document.querySelector(`.pagination [data-page="${currentPage}"] div`).classList.remove('date');
      document.querySelector(`.pagination [data-page="${currentPage}"] div`).classList.add('date-2');

      document.querySelector(`.pagination [data-page="${pageNum}"]`).classList.remove('div-2');
      document.querySelector(`.pagination [data-page="${pageNum}"]`).classList.add('page');
      document.querySelector(`.pagination [data-page="${pageNum}"] div`).classList.remove('date-2');
      document.querySelector(`.pagination [data-page="${pageNum}"] div`).classList.add('date');

      // Update current page
      currentPage = pageNum;
    }

    // Submit form when next button is clicked
    nextButton.addEventListener('click', function(e) {
      e.preventDefault();
      if (selectedCombos.length > 0) {
        comboForm.submit();
      } else {
        alert('Please select at least one combo before proceeding.');
      }
    });
</script>
</body>
