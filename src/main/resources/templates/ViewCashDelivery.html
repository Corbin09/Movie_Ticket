<body>
<div class="view-ticket-cash">
    <div class="frame">
        <div class="overlap">
            <div class="overlap-group">
                <div class="div">
                    <div class="ellipse"></div>
                    <img class="image" th:src="@{/img/image-2.png}" alt="Background image" />
                    <div class="rectangle"></div>
                    <img class="img" th:src="${film != null ? film.filmImg : '/img/image.png'}" alt="Film poster" />
                    <div class="text-wrapper" th:text="${film != null ? film.filmName : 'INUYASHA'}">INUYASHA</div>
                </div>
                <div class="line-wrapper"><img class="line" th:src="@{/img/line-23.svg}" alt="Line" /></div>
                <div class="frame-2">
                    <div class="group">
                        <div class="div-wrapper"><div class="text-wrapper-2">01</div></div>
                        <div class="text-wrapper-3">PICK SEAT</div>
                    </div>
                    <div class="group-2">
                        <div class="div-wrapper"><div class="text-wrapper-2">02</div></div>
                        <div class="text-wrapper-3">POPCORNS</div>
                    </div>
                    <div class="group-3">
                        <div class="div-wrapper"><div class="text-wrapper-2">03</div></div>
                        <div class="text-wrapper-3">PAY</div>
                    </div>
                    <div class="group-4">
                        <div class="overlap-2"><div class="text-wrapper-2">04</div></div>
                        <div class="text-wrapper-3">TICKET</div>
                    </div>
                </div>
                <div class="frame-3">
                    <!-- Date -->
                    <div class="frame-4">
                        <div class="text-wrapper-4">Date</div>
                        <div class="text-wrapper-5" th:text="${#dates.format(showtime != null ? showtime.showDate : new java.util.Date(), 'EEE, dd MMM yyyy')}">Mon, 23 Oct 2023</div>
                    </div>
                    <!-- Movie Title -->
                    <div class="frame-5">
                        <div class="text-wrapper-4">Movie Title</div>
                        <div class="text-wrapper-5" th:text="${film != null ? film.filmName : 'INUYASHA'}">INUYASHA</div>
                    </div>
                    <!-- Cinema -->
                    <div class="frame-6">
                        <div class="text-wrapper-4">Cinema</div>
                        <div class="text-wrapper-5" th:text="${showtime != null && showtime.cinema != null ? showtime.cinema.cinemaName : 'Vincom Ba Trieu'}">Vincom Ba Trieu</div>
                    </div>
                    <!-- Room -->
                    <div class="text-wrapper-6">Room</div>
                    <div class="text-wrapper-7" th:text="${showtime != null && showtime.room != null ? showtime.room.roomName : 'A1'}">A1</div>
                    <!-- ID -->
                    <div class="text-wrapper-8">ID</div>
                    <div class="text-wrapper-9" th:text="${order != null ? order.orderId : '2101040075'}">2101040075</div>
                    <!-- Seats -->
                    <div class="frame-7">
                        <div class="text-wrapper-4">Seats (<span th:text="${seats != null ? seats.size() : '3'}">3</span>)</div>
                        <div class="text-wrapper-5" th:text="${seatsString != null ? seatsString : 'I7, I8, I9'}">I7, I8, I9</div>
                    </div>
                    <!-- Status -->
                    <div class="frame-8">
                        <div class="text-wrapper-4">Status</div>
                        <div class="text-wrapper-5" th:text="${order != null && order.paymentStatus ? 'Paid' : 'Not paid'}">Not paid</div>
                    </div>
                    <!-- Time -->
                    <div class="text-wrapper-10">Time</div>
                    <div class="text-wrapper-11" th:text="${showtime != null ? showtime.showTime : '14:40'}">14:40</div>
                    <!-- Download Button -->
                    <div class="frame-9">
                        <div class="text-wrapper-12">
                            <a href="#" th:href="@{/ticket/download/{id}(id=${order != null ? order.orderId : '0'})}" style="color: white; text-decoration: none;">Download Ticket</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="ellipse-2"></div>
        </div>
        <!-- Back to Homepage Button -->
        <div class="frame-10">
            <div class="text-wrapper-13">
                <a href="#" th:href="@{/}" style="color: white; text-decoration: none;">Back to Homepage</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
