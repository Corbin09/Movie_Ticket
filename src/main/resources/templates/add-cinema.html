<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Cinema Management - Add Cinema</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/header_sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/add-cinema.css}">
</head>

<body>
<div th:replace="~{fragments/header_admin_sidebar :: header_sidebar}"></div>
<!-- Add Cinema View -->
<div class="content-view" th:fragment="content" id="contentView">
    <h2 class="section-title">Cinema Management / Add Cinema</h2>

    <!-- Success Overlay -->
    <div th:if="${successMessage}" class="overlay-container show" id="successOverlay">
        <div class="overlay-box">
            <div class="overlay-icon">
                <img src="https://storage.googleapis.com/a1aa/image/c8vfCnEspzOX5ov3dX65vYIGGEdnELte-7GoPt4L-YI.jpg"
                     alt="Success">
            </div>
            <h2 class="overlay-title">Add Success!</h2>
            <p class="overlay-text" th:text="${successMessage}">Cinema has been added successfully.</p>
            <div class="overlay-actions">
                <a th:href="@{/manage-cinemas}" class="overlay-btn overlay-btn-success">Go to Cinema List</a>
                <a th:href="@{/admin-dashboard}" class="overlay-btn overlay-btn-back">Back to Dashboard</a>
            </div>
        </div>
    </div>

    <div class="form-container">
        <form th:action="@{/cinemas/save}" th:object="${cinema}" method="post">
            <div class="form-group">
                <label for="cinemaName">Cinema name</label>
                <input type="text" id="cinemaName" th:field="*{cinemaName}" class="form-control">
                <span class="error-message" th:if="${#fields.hasErrors('cinemaName')}"
                      th:errors="*{cinemaName}">This field cannot be empty.</span>
            </div>

            <div class="form-group">
                <label for="selectedRegion">Region</label>
                <div class="custom-select">
                    <div class="select-control">
                            <span class="selected-option"
                                  th:text="${cinema.region != null ? cinema.region.regionName : 'Select Region'}">Select
                                Region</span>
                        <i class="fas fa-chevron-down">▼</i>
                    </div>
                    <div class="select-dropdown">
                        <div class="select-option" th:each="region : ${regions}" th:text="${region.regionName}"
                             th:data-value="${region.regionId}">North Region</div>
                    </div>
                    <input type="hidden" name="region.regionId" id="selectedRegion" />
                </div>
                <span class="error-message" th:if="${#fields.hasErrors('region')}" th:errors="*{region}">Please
                        select a region</span>
            </div>

            <div class="form-group">
                <label for="selectedComplex">Cinema complex</label>
                <div class="custom-select">
                    <div class="select-control">
                            <span class="selected-option"
                                  th:text="${cinema.cinemaCluster != null ? cinema.cinemaCluster.clusterName : 'Select Complex'}">Select
                                Complex</span>
                        <i class="fas fa-chevron-down">▼</i>
                    </div>
                    <div class="select-dropdown">
                        <div class="select-option" th:each="cluster : ${clusters}" th:text="${cluster.clusterName}"
                             th:data-value="${cluster.clusterId}">Beta Complex</div>
                    </div>
                    <input type="hidden" name="cinemaCluster.clusterId" id="selectedComplex" />
                </div>
                <span class="error-message" th:if="${#fields.hasErrors('cinemaCluster')}"
                      th:errors="*{cinemaCluster}">Please select a complex</span>
            </div>

            <div class="form-group">
                <label for="cinemaAddress">Cinema address</label>
                <input type="text" id="cinemaAddress" th:field="*{address}" class="form-control">
                <span class="error-message" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">This
                        field cannot be empty.</span>
            </div>

            <div class="form-actions">
                <a th:href="@{/manage-cinemas}" class="cancel-btn">Cancel</a>
                <button type="submit" class="add-action-btn">Add</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const customSelects = document.querySelectorAll('.custom-select');
        const contentView = document.getElementById('contentView');

        const sidebarToggle = document.querySelector('.sidebar-toggle');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', function () {
                contentView.classList.toggle('sidebar-open');
            });
        }

        customSelects.forEach(select => {
            const control = select.querySelector('.select-control');
            const options = select.querySelectorAll('.select-option');
            const selectedOption = select.querySelector('.selected-option');
            const hiddenInput = select.closest('.form-group').querySelector('input[type="hidden"]');

            control.addEventListener('click', function (e) {
                customSelects.forEach(otherSelect => {
                    if (otherSelect !== select) {
                        otherSelect.classList.remove('active');
                    }
                });

                select.classList.toggle('active');
                e.stopPropagation();
            });

            options.forEach(option => {
                option.addEventListener('click', function (e) {
                    selectedOption.textContent = option.textContent;
                    hiddenInput.value = option.getAttribute('data-value');
                    select.classList.remove('active');
                    e.stopPropagation();
                });
            });
        });

        const dropdowns = document.querySelectorAll('.select-dropdown');
        dropdowns.forEach(dropdown => {
            dropdown.addEventListener('touchstart', function (e) {
                e.stopPropagation();
            });
        });

        document.addEventListener('click', function () {
            customSelects.forEach(select => {
                select.classList.remove('active');
            });
        });

        document.addEventListener('scroll', function () {
            customSelects.forEach(select => {
                select.classList.remove('active');
            });
        });

        const successOverlay = document.getElementById('successOverlay');

        if (successOverlay) {
            successOverlay.addEventListener('click', function (e) {
                if (e.target === successOverlay) {
                    closeOverlay();
                }
            });

            setTimeout(closeOverlay, 5000);

            function closeOverlay() {
                successOverlay.classList.remove('show');
                setTimeout(function () {
                    successOverlay.style.display = 'none';
                }, 300);
            }
        }
    });
</script>

</body>
</html>
