<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/footer.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/header_user.css}">
    <style>
        /* Base styling and resets */
        @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");

        :root {
          --background-color: rgba(2, 7, 0, 1);
          --primary-color: #1de782;
          --accent-color: #f12222;
          --text-light: #ffffff;
          --text-muted: #a49d9d;
          --seat-normal: #ffffff;
          --seat-vip: #e9a533;
          --seat-couple: #dc2929;
          --seat-reserved: #857f7f;
          --seat-booked: #000000;
          --step-active: #ee1616;
          --step-inactive: #7a7474;
        }

        * {
          -webkit-font-smoothing: antialiased;
          box-sizing: border-box;
        }

        html, body {
        background: linear-gradient(180deg,
                    rgb(1.47, 14.86, 4.89) 0%,
                    rgb(18.72, 95.61, 38.39) 100%);
          color: #ffffff;
          line-height: 1.6;
        }

        button:focus-visible {
          outline: 2px solid #4a90e2 !important;
          outline: -webkit-focus-ring-color auto 5px !important;
        }

        a {
          text-decoration: none;
        }

              /* Movie Header */
        .movie-header {
          position: relative;
          width: 100%;
        }

        .movie-banner {
            position: relative;
            width: 100%;
            height: 258px;
            background-size: cover;
            background-position: center;
        }

        .rectangle {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-color: #000000a1;
        }

        .movie-poster {
          position: absolute;
          width: 200px;
            height: 300px;
            top: 30px;
            left: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            object-fit: cover;
        }

        .movie-title {
            position: absolute;
            top: 150px;
            left: 250px;
            font-family: "Poppins", sans-serif;
            font-weight: 700;
            color: #ffffff;
            font-size: 42px;
            letter-spacing: 0;
            line-height: 66px;
            white-space: nowrap;
        }


        /* Glow effect background */
        .progress-indicator {
          margin-bottom: 20px;
        }

         .progress-steps {
            display: flex;
            align-items: center;
            gap: 95px;
            position: relative;
            margin: 30px auto;
            max-width: 800px;
            justify-content: center;
         }

        .step {
            position: relative;
            display: flex;
            align-items: center;
        }

        .step.active {
          opacity: 1;
        }


        .step-number {
            width: 34px;
            height: 33px;
            background-color: #7a7474;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            color: #ffffff;
            font-size: 17px;
        }

        .step-text {
            margin-left: 10px;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            color: #ffffff;
            font-size: 17px;
            letter-spacing: 0;
            line-height: 17px;
            white-space: nowrap;
        }

        .active .step-number {
            background-color: #ee1616;
        }

        /* Theater screen */
        .theater-section {
          position: relative;
          margin-bottom: 40px;
          filter: drop-shadow(0 0 30px #eded62);
          z-index: 1;
        }

        .screen {
          width: 480px;
          height: 80px;
          background-color: #fffff0;
          margin: 0 auto;
          clip-path: polygon(18% 100%, 82% 100%, 100% 0, 0 0);
        }

        /* Seats container and seat map */
        .seats-container {
          position: relative;
          z-index: 2;
          margin-bottom: 20px;
        }

        .seat-map {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          max-width: 600px;
          margin: 0 auto;
          transform: scale(0.8);
          transform-origin: top center;
        }

        .seat-row {
          display: flex;
          align-items: center;
          margin: 4px 0;
        }

        .seat {
          width: 40px;
          height: 35px;
          border-radius: 4px;
          margin: 1px;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          font-family: "Poppins", sans-serif;
          font-size: 15px;
        }

        /* Seat types */
        .normal-seat {
          background-color: var(--seat-normal);
          color: black;
          border: 1px solid #ccc;
        }

        .vip-seat {
          background-color: var(--seat-vip);
          color: black;
        }

        .couple-seat {
          background-color: var(--seat-couple);
          color: white;
          position: relative;
        }

        /* Couple seat styling to connect pairs */
        .couple-seat[data-seat-label$="1"],
        .couple-seat[data-seat-label$="3"],
        .couple-seat[data-seat-label$="5"],
        .couple-seat[data-seat-label$="7"],
        .couple-seat[data-seat-label$="9"] {
          margin-right: -1px;
          border-top-right-radius: 0;
          border-bottom-right-radius: 0;
          border-right: none;
        }

        .couple-seat[data-seat-label$="2"],
        .couple-seat[data-seat-label$="4"],
        .couple-seat[data-seat-label$="6"],
        .couple-seat[data-seat-label$="8"],
        .couple-seat[data-seat-label$="0"] {
          margin-left: -1px;
          border-top-left-radius: 0;
          border-bottom-left-radius: 0;
          border-left: none;
          margin-right: 6px;
        }

        .couple-seat::before {
          content: "♥";
          font-size: 10px;
          position: absolute;
          top: 2px;
          right: 2px;
          opacity: 0.7;
        }

        /* Seat statuses */
        .seat.booked {
          background-color: var(--seat-booked) !important;
          color: white !important;
          cursor: not-allowed;
        }

        .seat.reserved {
          background-color: var(--seat-reserved) !important;
          cursor: not-allowed;
        }

        .seat:hover:not(.booked):not(.reserved) {
          background-color: #777;
        }

        .seat.selected {
          background-color: #777;
        }

        /* Booking details section */
        .booking-details {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 30px;
          margin: 40px auto;
          max-width: 600px;
          position: relative;
          z-index: 2;
        }

        .showtime-info {
          display: flex;
          justify-content: space-around;
          width: 100%;
        }

        .info-item {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
        }

        .info-label {
          font-family: "Poppins", sans-serif;
          font-weight: 400;
          color: var(--text-muted);
          font-size: 20px;
          margin-bottom: 10px;
        }

        .date-box {
          width: 90px;
          height: 86px;
          background-color: #000000;
          border: 0.25px solid #ffffff;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .info-value {
          font-family: "Poppins", sans-serif;
          font-weight: 700;
          color: var(--text-light);
          font-size: 20px;
        }

        .date-box .info-value {
          font-size: 30px;
          text-align: center;
        }

        .selection-summary {
          width: 100%;
          display: flex;
          justify-content: space-around;
        }

        .summary-item {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
        }

        .summary-label {
          font-family: "Poppins", sans-serif;
          font-size: 16px;
          color: var(--text-muted);
          margin-bottom: 8px;
        }

        .summary-value {
          font-family: "Poppins", sans-serif;
          font-size: 18px;
          font-weight: bold;
          color: white;
          word-wrap: break-word;
          display: block;
          width: 100%;
          line-height: 1.4;
          max-width: 300px;
          overflow-wrap: break-word;
        }

        /* Button styling */
        .action-buttons {
          display: flex;
          justify-content: center;
          gap: 20px;
          margin-top: 30px;
        }

        .btn {
          width: 136px;
          height: 47px;
          border-radius: 5px;
          font-family: "Poppins", sans-serif;
          font-weight: 700;
          font-size: 14px;
          text-align: center;
          cursor: pointer;
        }

        .btn-cancel {
          background-color: #000000;
          border: 0.6px solid var(--accent-color);
          color: var(--accent-color);
        }

        .btn-next {
          background-color: var(--accent-color);
          color: var(--text-light);
          border: none;
          letter-spacing: 2.1px;
        }

.booking-container {
  display: flex;
  flex-wrap: wrap;
  max-width: 1200px;
  margin: 40px auto;
  position: relative;
  z-index: 2;
  gap: 20px;
}

.seats-section {
  flex: 2;
  order: 2;
}

.left-sidebar {
  flex: 1;
  order: 1;
  padding-right: 20px;
}

.right-sidebar {
  flex: 1;
  order: 3;
  padding-left: 20px;
}

.showtime-info, .selection-summary {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.info-item, .summary-item {
  width: 100%;
}

        /* Seat legend */
        .seat-legend {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  margin: -60px auto 10px;
  max-width: 600px;
  position: relative;
  z-index: 2;
}

        .legend-item {
          display: flex;
          align-items: center;
          gap: 5px;
        }

        .legend-color {
          width: 20px;
          height: 18px;
          border-radius: 3px;
        }

        .legend-color.normal {
          background-color: var(--seat-normal);
        }

        .legend-color.vip {
          background-color: var(--seat-vip);
        }

        .legend-color.couple {
          background-color: var(--seat-couple);
        }

        .legend-color.reserved {
          background-color: var(--seat-reserved);
        }

        .legend-text {
          font-family: "Poppins", sans-serif;
          font-weight: 400;
          color: var(--text-muted);
          font-size: 12px;
          line-height: 18px;
        }

        /* Warning popup */
        .warning-popup {
          display: none;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background-color: rgba(0, 0, 0, 0.9);
          border: 2px solid var(--accent-color);
          border-radius: 8px;
          padding: 20px;
          z-index: 1000;
          box-shadow: 0 0 20px rgba(241, 34, 34, 0.5);
          animation: fadeIn 0.3s ease-out;
        }

        .warning-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 15px;
        }

        .warning-icon {
          font-size: 40px;
        }

        .warning-message {
          font-family: "Poppins", sans-serif;
          font-weight: 700;
          color: var(--text-light);
          font-size: 16px;
          text-align: center;
          letter-spacing: 0.5px;
        }

@media screen and (max-width: 992px) {
    /* Keep progress indicator similar to full width view */
    .progress-steps {
        gap: 40px; /* Reduced gap between steps */
        transform: scale(0.85);
        transform-origin: center top;
    }

    .booking-container {
        flex-direction: column;
    }

    .left-sidebar, .right-sidebar {
        width: 100%;
        order: 3; /* Put both sidebars below seat map */
        padding: 0 20px;
    }

    .seats-section {
        order: 1; /* Make seat map first */
        width: 100%;
    }

    /* Make seat legend more compact on smaller screens */
    .seat-legend {
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
    }
}

@media screen and (max-width: 768px) {
    .movie-title {
        left: 190px;
        top: 150px;
        font-size: 30px;
        line-height: normal;
    }

    .movie-poster {
        width: 150px;
        height: 225px;
    }

    .progress-steps {
        gap: 20px;
        transform: scale(0.75);
    }

    .action-buttons {
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    .btn {
        width: 80%;
    }

    .showtime-info {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }

    .info-item {
        width: auto;
        margin: 0 10px;
    }
}

@media screen and (min-width: 769px) and (max-width: 1200px) {
    /* Keep progress indicator position similar to desktop */
    .progress-steps {
        gap: 30px;
        transform: scale(0.8);
        transform-origin: center top;
    }

    /* Fix summary-value alignment to be below label like in non-responsive mode */
    .summary-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .summary-value {
        margin-top: 5px;
        text-align: left;
    }

    /* Adjust the seat map scaling for better fit */
    .seat-map {
        transform: scale(0.7);
    }

    /* Make the booking container layout more efficient for split screen */
    .booking-container {
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
    }

    .left-sidebar {
        flex: 1;
        min-width: 250px;
        order: 1;
    }

    .right-sidebar {
        flex: 1;
        min-width: 250px;
        order: 3;
    }

    .seats-section {
        flex: 2;
        min-width: 300px;
        order: 2;
    }
}
    </style>
</head>
<body>
<!-- Header -->
<div th:replace="~{fragments/header_user :: header_user}"></div>
<div style="height: 132px;" class="adding-margin"></div>

<div class="ticket-booking-container">
    <!-- Hidden input for showtime ID -->
    <input type="hidden" name="showtimeId" th:value="${showtime.showtimeId}"/>

    <!-- Debug info (hidden) -->
    <div style="display:none" th:text="${film != null ? 'Film exists' : 'Film is null'}"></div>
    <div style="display:none" th:if="${film != null}" th:text="${'Film ID: ' + film.filmId}"></div>

    <div class="booking-layout">
        <!-- Movie information header -->
        <div class="movie-header">
            <div th:if="${film != null && film.filmImg != null}"
                 class="movie-banner"
                 th:style="'background-image: url(' + ${film.filmImg} + ');'">
                <div class="rectangle"></div>
            </div>
            <img th:if="${film != null && film.filmImg != null}" th:src="${film.filmImg}" class="movie-poster"
                 alt="Movie Poster">
            <h1 class="movie-title" th:text="${film != null ? film.filmName : ''}">Movie Title</h1>
        </div>

        <!-- Booking progress indicator -->
        <div class="progress-indicator">
            <div class="progress-steps">
                <div class="step active">
                    <div class="step-number">01</div>
                    <div class="step-text">PICK SEAT</div>
                </div>
                <div class="step">
                    <div class="step-number">02</div>
                    <div class="step-text">POPCORNS</div>
                </div>
                <div class="step">
                    <div class="step-number">03</div>
                    <div class="step-text">PAY</div>
                </div>
                <div class="step">
                    <div class="step-number">04</div>
                    <div class="step-text">TICKET</div>
                </div>
            </div>
        </div>

        <!-- Adjusted booking container with swapped sidebars -->
        <div class="booking-container">
            <!-- Right sidebar with showtime info (previously on left) -->
            <div class="right-sidebar">
                <!-- Showtime information - ordered from top to bottom -->
                <div class="showtime-info">
                    <div class="info-item">
                        <div class="info-label">Date:</div>
                        <div class="date-box">
                            <span class="info-value" th:text="${#dates.format(showtime.showDate, 'dd MMM')}">08 DEC</span>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Time:</div>
                        <div class="info-value" th:text="${#strings.substring(showtime.showTime, 0, 5)}">9:40 pm</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Room:</div>
                        <div class="info-value" th:text="${showtime.room.roomName}">A1</div>
                    </div>
                </div>
            </div>
            <!-- Left sidebar with selection summary and buttons (previously on right) -->
            <div class="left-sidebar">
                <!-- Selected seats and price - ordered from top to bottom -->
                <div class="selection-summary">
                    <div class="summary-item">
                        <span class="summary-label">Chosen Seat:</span>
                        <span class="summary-value" id="selectedSeats"></span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Total:</span>
                        <span class="summary-value" id="totalPrice">$0</span>
                    </div>
                </div>

                <!-- Action buttons -->
                <div class="action-buttons">
                    <button id="cancelButton" class="btn btn-cancel">CANCEL</button>
                    <button id="nextButton" class="btn btn-next">NEXT</button>
                </div>
            </div>

            <!-- Center section with theater and seats -->
            <div class="seats-section">
                <!-- Theater screen -->
                <div class="theater-section">
                    <div class="screen"></div>
                </div>

                <!-- Seat selection area -->
                <div class="seats-container">
                    <!-- Seat map -->
                    <div class="seat-map">
                        <!-- Loop through each row of seats -->
                        <div th:each="row : ${seatsByRow.keySet()}" class="seat-row">
                            <!-- Loop through each seat in the row -->
                            <div th:each="seat : ${seatsByRow.get(row)}"
                                 th:with="seatLabel=${seat.seatRow + seat.seatNumber}"
                                 th:class="${'seat ' +
                        (seat.seatType == 'Vip' ? 'vip-seat' :
                        (seat.seatType == 'Couple' ? 'couple-seat' : 'normal-seat')) + ' ' +
                        (seatStatusMap.containsKey(seatLabel) ?
                        (seatStatusMap.get(seatLabel) == 'BOOKED' ? 'booked' :
                        (seatStatusMap.get(seatLabel) == 'Reserved' ? 'reserved' : 'available'))
                        : 'available')}"
                                 th:attr="data-seat-id=${seat.seatId},
                        data-seat-label=${seatLabel},
                        data-seat-type=${seat.seatType},
                        data-seat-price=${seat.seatType == 'Vip' ? 150000 : 100000},
                        onclick=${seatStatusMap.containsKey(seatLabel) &&
                        (seatStatusMap.get(seatLabel) == 'BOOKED' ||
                        seatStatusMap.get(seatLabel) == 'RESERVED') ?
                        'void(0)' : 'toggleSeatSelection(this)'}"
                                 th:text="${seat.seatRow + seat.seatNumber}">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Seat type legend - moved up closer to seat map -->
                <div class="seat-legend">
                    <div class="legend-item">
                        <div class="legend-color normal"></div>
                        <div class="legend-text">Normal seat</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color vip"></div>
                        <div class="legend-text">VIP seat</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color couple"></div>
                        <div class="legend-text">Couple seat</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color reserved"></div>
                        <div class="legend-text">Reserved seat</div>
                    </div>
                </div>
            </div>


        </div>

        <!-- Warning popup -->
        <div id="warning-popup" class="warning-popup">
            <div class="warning-content">
                <div class="warning-icon">⚠️</div>
                <div class="warning-message">Please select at least one seat to continue.</div>
            </div>
        </div>
    </div>
</div>
<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
     // Main elements
     const allSeats = document.querySelectorAll(".seat");
     const selectedSeatsElement = document.getElementById("selectedSeats");
     const totalPriceElement = document.getElementById("totalPrice");
     const warningPopup = document.getElementById('warning-popup');
     const nextButton = document.getElementById('nextButton');
     const cancelButton = document.getElementById('cancelButton');

     // Track selected seats and total price
     let selectedSeats = [];
     let totalPrice = 0;

    // Toggle seat selection function
    function toggleSeatSelection(seatElement) {
    // Skip if seat is booked or reserved
    if (seatElement.classList.contains('booked') || seatElement.classList.contains('reserved')) {
        return;
    }

    const seatId = seatElement.getAttribute("data-seat-id");
    const seatLabel = seatElement.getAttribute("data-seat-label");
    const seatType = seatElement.getAttribute("data-seat-type");
    const seatPrice = parseInt(seatElement.getAttribute("data-seat-price"));

    // Check if seat is already selected
    const seatIndex = selectedSeats.findIndex(seat => seat.id === seatId);

    // For couple seats, determine the partner seat
    if (seatType.toLowerCase() === "couple") {
        const seatRow = seatLabel.charAt(0);
        const seatNumber = parseInt(seatLabel.substring(1));

        // Determine partner seat number
        // For odd seats (1,3,5...), partner is the next seat
        // For even seats (2,4,6...), partner is the previous seat
        const partnerNumber = seatNumber % 2 === 0 ? seatNumber - 1 : seatNumber + 1;
        const partnerLabel = seatRow + partnerNumber;

        // Find partner seat element
        const partnerElement = document.querySelector(`.seat[data-seat-label="${partnerLabel}"]`);

        if (partnerElement && partnerElement.getAttribute("data-seat-type").toLowerCase() === "couple") {
            // If current seat is not selected, select both
            if (seatIndex === -1) {
                // Add current seat
                selectedSeats.push({
                    id: seatId,
                    label: seatLabel,
                    type: seatType,
                    price: seatPrice
                });
                seatElement.style.backgroundColor = "#777";

                // Add partner seat if it's not booked or reserved
                if (!partnerElement.classList.contains('booked') &&
                    !partnerElement.classList.contains('reserved')) {

                    const partnerId = partnerElement.getAttribute("data-seat-id");
                    const partnerType = partnerElement.getAttribute("data-seat-type");
                    const partnerPrice = parseInt(partnerElement.getAttribute("data-seat-price"));

                    // Check if partner is already selected
                    const partnerIndex = selectedSeats.findIndex(seat => seat.id === partnerId);

                    if (partnerIndex === -1) {
                        // Add partner seat
                        selectedSeats.push({
                            id: partnerId,
                            label: partnerLabel,
                            type: partnerType,
                            price: partnerPrice
                        });
                        partnerElement.style.backgroundColor = "#777";
                    }
                }
            } else {
                // Remove current seat
                selectedSeats.splice(seatIndex, 1);

                // Reset background color based on seat type
                seatElement.style.backgroundColor = "#dc2929"; // Couple seat color

                // Find and remove partner seat if it's selected
                const partnerId = partnerElement.getAttribute("data-seat-id");
                const partnerIndex = selectedSeats.findIndex(seat => seat.id === partnerId);

                if (partnerIndex !== -1) {
                    selectedSeats.splice(partnerIndex, 1);
                    partnerElement.style.backgroundColor = "#dc2929"; // Couple seat color
                }
            }
        } else {
            // Standard toggle for this seat only if no partner found
            toggleStandardSeat(seatElement, seatId, seatLabel, seatType, seatPrice, seatIndex);
        }
    } else {
        // Standard toggle for non-couple seats
        toggleStandardSeat(seatElement, seatId, seatLabel, seatType, seatPrice, seatIndex);
    }

    updateDisplay();
}

    // Function to handle standard seat selection/deselection
    function toggleStandardSeat(seatElement, seatId, seatLabel, seatType, seatPrice, seatIndex) {
    if (seatIndex === -1) {
        // Add seat to selection
        selectedSeats.push({
            id: seatId,
            label: seatLabel,
            type: seatType,
            price: seatPrice
        });
        seatElement.style.backgroundColor = "#777";
    } else {
        // Remove seat from selection
        selectedSeats.splice(seatIndex, 1);

        // Reset background color based on seat type
        if (seatType.toLowerCase() === "vip") {
            seatElement.style.backgroundColor = "#fba904";
        } else if (seatType.toLowerCase() === "couple") {
            seatElement.style.backgroundColor = "#dc2929";
        } else {
            seatElement.style.backgroundColor = "#ffffff";
        }
    }
}

     // Update display of selected seats and price
     function updateDisplay() {
         // Format selected seats
         if (selectedSeats.length === 0) {
    selectedSeatsElement.innerHTML = "";
    totalPriceElement.textContent = "$0"; // Changed from VND to $ format
    return;
  }

         // Sort seats by row then number for display
         selectedSeats.sort((a, b) => {
             const rowA = a.label.charAt(0);
             const rowB = b.label.charAt(0);

             if (rowA !== rowB) {
                 return rowA.localeCompare(rowB);
             }

             const numA = parseInt(a.label.substring(1));
             const numB = parseInt(b.label.substring(1));
             return numA - numB;
         });

         // Create text with proper wrapping
         const maxCharsPerLine = 46; // Approximate chars per line
         let displayText = "";
         let currentLine = "";

         selectedSeats.forEach((seat, index) => {
             const seatText = index < selectedSeats.length - 1 ? seat.label + ", " : seat.label;

             if ((currentLine + seatText).length > maxCharsPerLine) {
                 displayText += currentLine + "\n";
                 currentLine = seatText;
             } else {
                 currentLine += seatText;
             }
         });

         displayText += currentLine;

         // Set the text with line breaks for HTML
         selectedSeatsElement.innerHTML = displayText.replace(/\n/g, "<br>");

         // Calculate and display total price
         totalPrice = selectedSeats.reduce((sum, seat) => sum + seat.price, 0);
         totalPriceElement.textContent = "$" + totalPrice.toLocaleString();
     }

     // Add click event to all available seats
     allSeats.forEach(seat => {
         if (!seat.classList.contains('booked') && !seat.classList.contains('reserved')) {
             seat.addEventListener('click', function() {
                 toggleSeatSelection(this);
             });
         }
     });

     // Cancel button handler - return to movie ticket view
     cancelButton.addEventListener('click', function() {
         const urlParams = new URLSearchParams(window.location.search);
         const filmId = urlParams.get('filmId');
         const selectedDate = urlParams.get('selectedDate');

         console.log("FilmId from URL:", filmId);
         console.log("SelectedDate from URL:", selectedDate);

         if (!filmId) {
             console.error("Film ID is missing in URL!");
             window.location.href = '/films';
             return;
         }

         let returnUrl = `/View-movie-ticket?id=${filmId}`;
         if (selectedDate) {
             returnUrl += `&date=${selectedDate}`;
         }

         window.location.href = returnUrl;
     });

     // Next button handler - proceed to popcorn selection
     nextButton.addEventListener('click', function() {
         if (selectedSeats.length > 0) {
             // Get URL parameters
             const urlParams = new URLSearchParams(window.location.search);
             const filmId = urlParams.get('filmId');
             const cinemaId = urlParams.get('cinemaId');
             const showtimeId = urlParams.get('showtimeId');
             const selectedDate = urlParams.get('selectedDate');

             // Build next page URL with all parameters
             let url = `/pick-popcorn?filmId=${filmId}&cinemaId=${cinemaId}` +
                      `&showtimeId=${showtimeId}&selectedDate=${selectedDate}` +
                      `&ticketSubtotal=${totalPrice}`;

             // Add selected seats as JSON parameter
             url += `&selectedSeatsJson=${encodeURIComponent(JSON.stringify(selectedSeats))}`;

             console.log("Navigating to:", url);
             window.location.href = url;
         } else {
             // Show warning if no seats selected
             warningPopup.style.display = 'block';
         }
     });

     // Close warning popup when clicking outside
     document.addEventListener('click', function(event) {
         if (warningPopup.style.display === 'block' &&
             !warningPopup.contains(event.target) &&
             event.target !== nextButton) {
             warningPopup.style.display = 'none';
         }
     });

     // Try to restore previously selected seats (if returning from next page)
     function tryRestoreSelectedSeats() {
         try {
             const urlParams = new URLSearchParams(window.location.search);
             const selectedSeatsJson = urlParams.get('selectedSeatsJson');

             if (selectedSeatsJson) {
                 console.log("Found saved seats in URL:", selectedSeatsJson);
                 const savedSeats = JSON.parse(decodeURIComponent(selectedSeatsJson));

                 if (Array.isArray(savedSeats) && savedSeats.length > 0) {
                     savedSeats.forEach(savedSeat => {
                         const seatElement = document.querySelector(`.seat[data-seat-id="${savedSeat.id}"]`);
                         if (seatElement && !seatElement.classList.contains('booked') &&
                             !seatElement.classList.contains('reserved')) {
                             toggleSeatSelection(seatElement);
                         }
                     });
                 }
             }
         } catch (error) {
             console.error("Error restoring saved seats:", error);
         }
     }

     // Try to restore seats when page loads
     tryRestoreSelectedSeats();
 });
    </script>
