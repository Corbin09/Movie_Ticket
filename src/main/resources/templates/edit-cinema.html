<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/css/header_sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/edit-cinema.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body>

<div th:replace="~{fragments/header_admin_sidebar :: header_sidebar}"></div>

<!-- Edit Cinema View -->
<div class="content-view" th:fragment="content">
    <!-- Success Overlay -->
    <div id="successOverlay" class="success-overlay" th:classappend="${showSuccessOverlay} ? 'show' : ''">
        <div class="success-container">
            <div class="success-message-box">
                <div class="success-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none"
                         stroke="#28a745" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <h2 class="success-heading">Update Success!</h2>
                <p class="success-text"
                   th:text="${successMessage ?: 'Success! Cinema has been updated successfully.'}"></p>
                <div class="success-actions">
                    <a th:href="@{/manage-cinemas}" class="success-btn primary">Go to Cinema List</a>
                    <a th:href="@{/admin-dashboard}" class="success-btn secondary">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>



    <!-- Alert for error message -->
    <div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

    <div class="form-container">
        <h2 class="section-title">Edit Cinema</h2>
        <form th:action="@{/cinemas/update/{id}(id=${cinema.cinemaId})}" th:object="${cinema}" method="post">
            <input type="hidden" th:field="*{cinemaId}" />

            <div class="form-group">
                <label for="cinemaName">Cinema name</label>
                <input type="text" id="cinemaName" th:field="*{cinemaName}" class="form-control">
                <span class="error-message" th:if="${#fields.hasErrors('cinemaName')}"
                      th:errors="*{cinemaName}">This field cannot be empty.</span>
            </div>

            <div class="form-group">
                <label for="selectedRegion">Cinema region</label>
                <div class="custom-select">
                    <div class="select-control">
                            <span class="selected-option"
                                  th:text="${cinema.region != null ? cinema.region.regionName : 'Select Region'}">
                                Select Region
                            </span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="select-dropdown">
                        <div class="select-option" th:each="region : ${regions}" th:text="${region.regionName}"
                             th:data-value="${region.regionId}">North Region</div>
                    </div>
                    <input type="hidden" name="region.regionId"
                           th:value="${cinema.region != null ? cinema.region.regionId : ''}" id="selectedRegion" />
                </div>
                <span class="error-message" th:if="${#fields.hasErrors('region')}" th:errors="*{region}">
                    Region must be selected.
                </span>
            </div>

            <div class="form-group">
                <label for="selectedComplex">Cinema complex</label>
                <div class="custom-select">
                    <div class="select-control">
                            <span class="selected-option"
                                  th:text="${cinema.cinemaCluster != null ? cinema.cinemaCluster.clusterName : 'Select Complex'}">
                                Beta Complex
                            </span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="select-dropdown">
                        <div class="select-option" th:each="cluster : ${clusters}" th:text="${cluster.clusterName}"
                             th:data-value="${cluster.clusterId}">Beta Complex</div>
                    </div>
                    <input type="hidden" name="cinemaCluster.clusterId"
                           th:value="${cinema.cinemaCluster != null ? cinema.cinemaCluster.clusterId : ''}"
                           id="selectedComplex" />
                </div>
                <span class="error-message" th:if="${#fields.hasErrors('cinemaCluster')}"
                      th:errors="*{cinemaCluster}">Cinema complex must be selected.</span>
            </div>

            <div class="form-group">
                <label for="cinemaAddress">Cinema address</label>
                <input type="text" id="cinemaAddress" th:field="*{address}" class="form-control">
                <span class="error-message" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">
                    This field cannot be empty.
                </span>
            </div>

            <div class="form-actions">
                <a th:href="@{/manage-cinemas}" class="cancel-btn">Cancel</a>
                <button type="submit" class="update-btn">Update</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const customSelects = document.querySelectorAll('.custom-select');

        customSelects.forEach(select => {
            const control = select.querySelector('.select-control');
            const dropdown = select.querySelector('.select-dropdown');
            const options = select.querySelectorAll('.select-option');
            const selectedOption = select.querySelector('.selected-option');
            const hiddenInput = select.querySelector('input[type="hidden"]');

            const currentText = selectedOption.textContent.trim();
            if (currentText !== 'Select Region' && currentText !== 'Select Complex') {
                options.forEach(option => {
                    if (option.textContent.trim() === currentText) {
                        hiddenInput.value = option.getAttribute('data-value');
                    }
                });
            }

            control.addEventListener('click', function (e) {
                customSelects.forEach(otherSelect => {
                    if (otherSelect !== select) {
                        otherSelect.classList.remove('active');
                    }
                });

                select.classList.toggle('active');
                e.stopPropagation();
            });

            if (dropdown) {
                dropdown.addEventListener('touchmove', function (e) {
                    e.stopPropagation();
                });
            }

            options.forEach(option => {
                option.addEventListener('click', function (e) {
                    selectedOption.textContent = option.textContent;
                    hiddenInput.value = option.getAttribute('data-value');
                    select.classList.remove('active');
                    e.stopPropagation();
                });

                option.addEventListener('touchend', function (e) {
                    e.preventDefault();
                    selectedOption.textContent = option.textContent;
                    hiddenInput.value = option.getAttribute('data-value');
                    select.classList.remove('active');
                });
            });
        });

        // Close dropdowns when clicking/touching outside
        document.addEventListener('click', function () {
            customSelects.forEach(select => {
                select.classList.remove('active');
            });
        });

        document.addEventListener('touchend', function (e) {
            // Check if the click is outside any custom select
            let clickedOnSelect = false;
            customSelects.forEach(select => {
                if (select.contains(e.target)) {
                    clickedOnSelect = true;
                }
            });

            if (!clickedOnSelect) {
                customSelects.forEach(select => {
                    select.classList.remove('active');
                });
            }
        });

        const successOverlay = document.getElementById('successOverlay');
        if (successOverlay && successOverlay.classList.contains('show')) {
            document.body.style.overflow = 'hidden';

            successOverlay.addEventListener('click', function (e) {
                if (e.target === successOverlay) {
                    successOverlay.classList.remove('show');
                    document.body.style.overflow = '';
                }
            });
        }
    });
</script>

</body>
</html>
