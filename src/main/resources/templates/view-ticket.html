<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.5.0-beta4/html2canvas.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/header_user.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <style>
        /* Base styles and variables */
        :root {
          --primary: #00C853;
          --background: #0A2E0F;
          --dark-background: #0A1F0C;
          --text-light: #ffffff;
          --text-secondary: #7a7474;
          --border-radius: 10px;
        }

        body {
          background: linear-gradient(180deg,
              rgb(1.47, 14.86, 4.89) 0%,
              rgb(18.72, 95.61, 38.39) 100%);

          line-height: 1.6;
          color: var(--text-light);
        }

        .view-ticket-cash {
          width: 100%;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          padding: 0px;
        }

        .frame {
          width: 100%;
          max-width: 100%;
          margin: 0 auto;
        }

              /* Movie Header */
        .movie-header {
          position: relative;
          width: 100vw;
          margin-left: calc(-50vw + 50%);
        }

        .movie-banner {
            position: relative;
            width: 100%;
            height: 258px;
            background-size: cover;
            background-position: center;
        }

        .rectangle {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-color: #000000a1;
        }

        .movie-poster {
          position: absolute;
          width: 200px;
            height: 300px;
            top: 30px;
            left: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            object-fit: cover;
        }

        .movie-title {
            position: absolute;
            top: 150px;
            left: 250px;
            font-family: "Poppins", sans-serif;
            font-weight: 700;
            color: #ffffff;
            font-size: 42px;
            letter-spacing: 0;
            line-height: 66px;
            white-space: nowrap;
        }


        /* Glow effect background */
        .progress-indicator {
          margin-bottom: 20px;
        }

         .progress-steps {
            display: flex;
            align-items: center;
            gap: 95px;
            position: relative;
            margin: 30px auto;
            justify-content: center;
         }

        .step {
            position: relative;
            display: flex;
            align-items: center;
        }

        .step.active {
          opacity: 1;
        }


        .step-number {
            width: 34px;
            height: 33px;
            background-color: #7a7474;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            color: #ffffff;
            font-size: 17px;
        }

        .step-text {
            margin-left: 10px;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            color: #ffffff;
            font-size: 17px;
            letter-spacing: 0;
            line-height: 17px;
            white-space: nowrap;
        }

        .active .step-number {
            background-color: #ee1616;
        }

        /* Ticket content */
        .ticket-container {
          margin: 20px auto;
          background-color: var(--dark-background);
          border-radius: var(--border-radius);
          padding: 15px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
          position: relative;
          width: 60%;
          max-width: 800px;
        }

        /* Ticket information */
        .info-row {
          margin-bottom: 15px;
        }

        .info-label {
          color: var(--text-secondary);
          font-size: 14px;
          margin-bottom: 2px;
        }

        .info-value {
          color: var(--text-light);
          font-size: 16px;
          font-weight: bold;
        }

        .status-unpaid {
          color: #FF5252;
        }

        .info-column-left {
          float: left;
          width: 60%;
        }

        .info-column-right {
          float: right;
          width: 40%;
          text-align: right;
        }

        /* Button container for layout */
.button-container {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-top: 20px;
    margin-bottom: 50px;
    width: 60%;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
}

/* Update both button containers */
.download-button,
.back-button {
    margin: 0;
    flex: 1;
}

        /* Buttons */

        .download-btn {
          background-color: var(--primary);
          color: var(--text-light);
          border: none;
          border-radius: 5px;
          padding: 12px;
          width: 100%;
          font-weight: bold;
          cursor: pointer;
          transition: background-color 0.3s;
          text-decoration: none;
          display: block;
          text-align: center;
        }

        .download-btn:hover {
          background-color: #00A844;
        }

        .back-btn {
          background-color: transparent;
          color: var(--text-light);
          border: 1px solid var(--text-light);
          border-radius: 5px;
          padding: 12px;
          width: 100%;
          font-weight: bold;
          cursor: pointer;
          transition: background-color 0.3s;
          text-decoration: none;
          display: block;
          text-align: center;
        }

        .back-btn:hover {
          background-color: rgba(255, 255, 255, 0.1);
        }

        /* Clear fix for floats */
        .clearfix::after {
          content: "";
          clear: both;
          display: table;
        }

        /* Responsive design */
        @media screen and (max-width: 600px) {
        .movie-title {
        top: 330px;
        left: 20px;
        right: 20px;
        text-align: center;
        max-width: none;
        font-size: 28px;
    }

    .movie-poster {
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        top: 20px;
    }
          .img {
            width: 100px;
            height: 150px;
          }

          .text-wrapper {
            font-size: 24px;
          }

          .info-column-left,
          .info-column-right {
            float: none;
            width: 100%;
            text-align: left;
          }

          .info-column-right {
            margin-top: 15px;
          }
        }

        @media screen and (max-width: 1200px) {
    .progress-steps {
        gap: 40px;
    }

    .step-text {
        font-size: 14px;
    }

    .step-number {
        width: 28px;
        height: 28px;
        font-size: 14px;
    }
}

@media screen and (max-width: 900px) {
    .progress-steps {
        gap: 20px;
    }

    .ticket-container,
    .button-container {
        width: 80%;
    }
}

@media screen and (max-width: 768px) {
    .movie-title {
        left: 190px;
        top: 150px;
        font-size: 30px;
        line-height: normal;
    }

    .movie-poster {
        width: 150px;
        height: 225px;
    }

}
     @media screen and (max-width: 480px) {
    .movie-poster {
        width: 120px;
        height: 180px;
        top: 20px;
        left: 20px;
    }

    .movie-title {
        left: 160px; /* 120px (poster width) + 20px (left position) + 20px (spacing) */
        top: 120px;
        font-size: 24px;
        line-height: normal;
    }
}
    </style>
</head>

<body>
<div th:replace="~{fragments/header_user :: header_user}"></div>
<div style="height: 132px;" class="adding-margin"></div>

<div class="view-ticket-cash">
    <div class="frame">
        <!-- Movie information header -->
        <div class="movie-header">
            <div th:if="${film != null && film.filmImg != null}"
                 class="movie-banner"
                 th:style="'background-image: url(' + ${film.filmImg} + ');'">
                <div class="rectangle"></div>
            </div>
            <img th:if="${film != null && film.filmImg != null}"
                 th:src="${film.filmImg}" class="movie-poster"
                 alt="Movie Poster">
            <h1 class="movie-title" th:text="${film != null ? film.filmName : ''}">Movie Title</h1>
        </div>

        <!-- Booking progress indicator -->
        <div class="progress-indicator">
            <div class="progress-steps">
                <div class="step">
                    <div class="step-number">01</div>
                    <div class="step-text">PICK SEAT</div>
                </div>
                <div class="step">
                    <div class="step-number">02</div>
                    <div class="step-text">POPCORNS</div>
                </div>
                <div class="step">
                    <div class="step-number">03</div>
                    <div class="step-text">PAY</div>
                </div>
                <div class="step active">
                    <div class="step-number">04</div>
                    <div class="step-text">TICKET</div>
                </div>
            </div>
        </div>

        <!-- Ticket Container -->
        <div class="ticket-container" id="ticket-container">
            <div class="ticket-content">
                <!-- Left Column -->
                <div class="info-column-left">
                    <!-- Date -->
                    <div class="info-row">
                        <div class="info-label">Date</div>
                        <div class="info-value"
                             th:text="${#dates.format(showtime != null ? showtime.showDate : new java.util.Date(), 'EEE, dd MMM yyyy')}">
                            Mon, 23 Oct 2023
                        </div>
                    </div>

                    <!-- Movie Title -->
                    <div class="info-row">
                        <div class="info-label">Movie Title</div>
                        <div class="info-value" th:text="${film != null ? film.filmName : ''}">CẤM</div>
                    </div>

                    <!-- Cinema -->
                    <div class="info-row">
                        <div class="info-label">Cinema</div>
                        <div class="info-value" th:text="${cinema != null ? cinema.cinemaName : ''}">Vincom Ba Trieu</div>
                    </div>

                    <!-- All Seats combined - using a different approach for compatibility -->
                    <div class="info-row">
                        <div class="info-label">Seat(s)</div>
                        <div class="info-value">
                            <th:block th:if="${tickets != null && !tickets.isEmpty()}">
            <span th:remove="tag">
              <th:block th:each="ticket, iterStat : ${tickets}">
                <span th:remove="tag" th:text="${ticket.seat != null ? ticket.seat.seatRow + ticket.seat.seatNumber : ''}"></span>
                <span th:remove="tag" th:if="${!iterStat.last}">, </span>
              </th:block>
            </span>
                            </th:block>
                            <th:block th:if="${tickets == null || tickets.isEmpty()}">
                                No seats selected
                            </th:block>
                        </div>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="info-column-right">
                    <!-- ID -->
                    <div class="info-row">
                        <div class="info-label">ID</div>
                        <div class="info-value" th:text="${order != null ? order.orderId : ''}">2101040075</div>
                    </div>

                    <!-- Room -->
                    <div class="info-row">
                        <div class="info-label">Room</div>
                        <div class="info-value"
                             th:text="${showtime != null && showtime.room != null ? showtime.room.roomName : ''}">A1</div>
                    </div>

                    <!-- Hours -->
                    <div class="info-row">
                        <div class="info-label">Hours</div>
                        <div class="info-value" th:text="${showtime != null ? showtime.showTime : ''}">14:40</div>
                    </div>
                </div>

                <div class="clearfix"></div>
            </div>
        </div>

        <!-- Buttons container -->
        <div class="button-container">
            <!-- Download Button -->
            <div class="download-button">
                <a href="#" id="downloadTicket" class="download-btn">Download Ticket</a>
            </div>

            <!-- Back to Homepage Button -->
            <div class="back-button">
                <a href="#" th:href="@{/home}" class="back-btn">Back to Homepage</a>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
  // Download ticket functionality - simplified version for single ticket
  const downloadBtn = document.getElementById('downloadTicket');

  if (downloadBtn) {
    downloadBtn.addEventListener('click', function (e) {
      e.preventDefault();

      // Get the ticket container
      const ticketContainer = document.getElementById('ticket-container');

      // Use html2canvas to capture the ticket container
      html2canvas(ticketContainer).then(function (canvas) {
        // Convert canvas to image data URL
        const imgData = canvas.toDataURL('image/png');

        // Create download link
        const link = document.createElement('a');
        link.href = imgData;
        const movieName = document.querySelector('.info-value').textContent.trim() || 'movie';
        link.download = movieName + '-ticket.png';

        // Trigger download
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
    });
  }
});
</script>
</body>

</html>
