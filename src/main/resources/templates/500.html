<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>500 - Internal Server Error</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
          --green-900: #064e3b;
          --green-700: #15803d;
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: 'Poppins', sans-serif;
        }

        html, body {
          height: 100%;
          overflow: hidden;
          background: linear-gradient(to bottom, var(--green-900), var(--green-700));
        }

        .container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100%;
          flex-wrap: wrap;
          transition: transform 0.5s;
        }

        .error {
          width: 400px;
          padding: 40px;
          text-align: center;
          color: #fff;
        }

        .error h1 {
          font-size: 125px;
          margin: 0;
          font-weight: 700;
        }

        .error h2 {
          margin: -30px 0 10px;
          font-size: 47px;
          letter-spacing: 12px;
        }

        .error p {
          font-size: 16px;
          margin-top: 12px;
        }

        .subtitle {
          font-size: 14px;
          color: #b3b3b3;
        }

        .stack-container {
          position: relative;
          width: 420px;
          height: 210px;
          transition: width 1s, height 1s;
        }

        .card-container {
          position: absolute;
        }

        .perspec {
          perspective: 1000px;
        }

        .card {
          animation: tiltcard 0.5s ease-in-out 1s forwards;
          position: absolute;
        }

        .writing, .writing-error {
          width: 320px;
          height: 200px;
          background-color: #3f3f3f;
          border: 1px solid #bbb;
          border-radius: 6px 6px 4px 4px;
          position: relative;
        }

        .writing-error {
          animation: glitchError 2.5s infinite;
        }

        .topbar {
          position: absolute;
          width: 100%;
          height: 12px;
          background-color: #f1f1f1;
          border-top-left-radius: 4px;
          border-top-right-radius: 4px;
        }

        .topbar div {
          height: 6px;
          width: 6px;
          border-radius: 50%;
          margin: 3px;
          float: left;
        }

        .red { background-color: red; }
        .yellow { background-color: #e6c015; }
        .green { background-color: #60d060; }

        .code { padding: 15px; }
        .code ul {
          list-style: none;
          margin: 0;
          padding: 0;
        }

        .code ul li {
          background-color: #9e9e9e;
          width: 0;
          height: 7px;
          border-radius: 6px;
          margin: 10px 0;
        }

        .errorLine {
          background-color: #c7151e !important;
        }

        .writeLine {
          animation: writeLine 0.4s linear forwards;
        }

        .explode {
          animation: explode 0.5s ease-in-out forwards;
        }

        .pokeup {
          transition: all 0.3s ease;
        }

        .pokeup:hover {
          transform: translateY(-10px);
        }


        @keyframes tiltcard {
          from { transform: rotateY(0deg); }
          to   { transform: rotateY(-30deg); }
        }

        @keyframes explode {
          to {
            transform: translate(var(--spreaddist), var(--vertdist)) scale(var(--scaledist));
          }
        }

        @keyframes glitchError {
          0%, 10%, 27%, 35%, 52%, 72%, 80%, 100% { transform: none; opacity: 1; }
          7% { transform: skew(-0.5deg, -0.9deg); opacity: 0.75; }
          30% { transform: skew(0.8deg, -0.1deg); opacity: 0.75; }
          55% { transform: skew(-1deg, 0.2deg); opacity: 0.75; }
          75% { transform: skew(0.4deg, 1deg); opacity: 0.75; }
        }

        @keyframes writeLine {
          to { width: var(--linelength); }
        }

        @media screen and (max-width: 775px) {
          .container { flex-direction: column; transform: scale(0.85); }
        }
        @media screen and (max-width: 370px) {
          .container { transform: scale(0.6); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="error">
        <h1>500</h1>
        <h2>ERROR</h2>
        <p>Oh no, algo ha fallado. Intentalo de nuevo más tarde.<br>Si el problema continúa, por favor, contacta al administrador.</p>
        <p class="subtitle">ERR_INTERNAL_SERVER_ERROR</p>
    </div>

    <div class="stack-container"></div>
</div>


<script>
    const stackContainer = document.querySelector('.stack-container');

    for (let i = 0; i < 6; i++) {
      const spread = 125 - (i * 25);
      const scale = 0.75 + (i * 0.05);
      const vert = -25 + (i * 5);
      const cardContainer = document.createElement('div');
      cardContainer.classList.add('card-container');
      cardContainer.innerHTML = `
        <div class="perspec" style="--spreaddist: ${spread}px; --scaledist: ${scale}; --vertdist: ${vert}px;">
          <div class="card">
            <div class="writing">
              <div class="topbar">
                <div class="red"></div>
                <div class="yellow"></div>
                <div class="green"></div>
              </div>
              <div class="code"><ul></ul></div>
            </div>
          </div>
        </div>`;
      stackContainer.appendChild(cardContainer);
    }

    const cardNodes = document.querySelectorAll('.card-container');
    const perspecNodes = document.querySelectorAll('.perspec');
    const consoleNodes = document.querySelectorAll('.writing');
    const mainCard = document.querySelector('.card');

    let counter = cardNodes.length;

    mainCard.addEventListener('animationend', () => {
      perspecNodes.forEach(el => el.classList.add('explode'));
    });

    document.querySelector('.perspec').addEventListener('animationend', e => {
      if (e.animationName !== 'explode') return;

      cardNodes.forEach((el, i) => {
        el.classList.add('pokeup');
        el.addEventListener('click', () => {
          const updown = [800, -800];
          const randomY = updown[Math.floor(Math.random() * updown.length)];
          const randomX = Math.floor(Math.random() * 1000) - 1000;
          el.style.transform = `translate(${randomX}px, ${randomY}px) rotate(-540deg)`;
          el.style.transition = "transform 1s ease, opacity 2s";
          el.style.opacity = "0";
          counter--;
          if (counter === 0) {
            stackContainer.style.width = "0";
            stackContainer.style.height = "0";
          }
        });

        const numLines = Math.floor(Math.random() * 6) + 5;
        for (let j = 0; j < numLines; j++) {
          const lineLength = Math.floor(Math.random() * 72) + 25;
          const node = document.createElement("li");
          node.classList.add('node-' + j);
          node.style.setProperty('--linelength', `${lineLength}%`);
          const codeList = el.querySelector('.code ul');
          codeList.appendChild(node);

          if (j === 0) {
            node.classList.add('writeLine');
          } else {
            const prev = codeList.querySelector('.node-' + (j - 1));
            prev.addEventListener('animationend', () => {
              node.classList.add('writeLine');
              if (j === numLines - 1) {
                node.classList.add('errorLine');
                setTimeout(() => {
                  consoleNodes.forEach(c => c.classList.add('writing-error'));
                }, 1000);
              }
            });
          }
        }
      });
    });
</script>
</body>
</html>
