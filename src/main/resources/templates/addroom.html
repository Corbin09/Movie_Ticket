<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Room</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/header_sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/addroom.css}">
</head>

<body>
<div th:replace="~{fragments/header_admin_sidebar :: header_sidebar}"></div>
<div class="container-add-room">
  <h2>Add Room</h2>
  <div class="card">
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <form th:action="@{/rooms/save}" th:object="${room}" method="post" id="addRoomForm">
      <div class="form-group">
        <label for="roomName">Room Name</label>
        <input type="text" class="form-control" id="roomName" th:field="*{roomName}" required>
        <div class="error-feedback" id="roomNameError">Please enter a valid room name</div>
        <span class="error-message" th:if="${#fields.hasErrors('roomName')}" th:errors="*{roomName}"></span>
      </div>
      <div class="form-group">
        <label for="cinemaId">Cinema</label>
        <select class="form-control" id="cinemaId" th:field="*{cinema.cinemaId}" required>
          <option value="">Select Cinema</option>
          <option th:each="cinema : ${cinemas}" th:value="${cinema.cinemaId}"
                  th:text="${cinema.cinemaName}"></option>
        </select>
        <div class="error-feedback" id="cinemaError">Please select a cinema</div>
        <span class="error-message" th:if="${#fields.hasErrors('cinema')}" th:errors="*{cinema}"></span>
      </div>
      <div class="button-group">
        <a th:href="@{/manage-rooms}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Add Room</button>
      </div>
    </form>
  </div>
</div>

<!-- Success Overlay -->
<div id="successOverlay" class="success-overlay" th:classappend="${successMessage} ? 'show' : ''">
  <div class="success-container">
    <div class="success-message-box">
      <div class="success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none"
             stroke="#28a745" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <h2 class="success-heading">Add Success!</h2>
      <p class="success-text" th:text="${successMessage ?: 'Room has been added successfully.'}"></p>
      <a th:href="@{/manage-rooms}" class="success-btn primary">Go to Room List</a>
      <a th:href="@{/admin-dashboard}" class="success-btn secondary">Back to Dashboard</a>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('addRoomForm');
      const successOverlay = document.getElementById('successOverlay');
      const roomNameInput = document.getElementById('roomName');
      const cinemaInput = document.getElementById('cinemaId');
      const roomNameError = document.getElementById('roomNameError');
      const cinemaError = document.getElementById('cinemaError');

      if (successOverlay.classList.contains('show')) {
          document.body.style.overflow = 'hidden';
          successOverlay.style.display = 'flex';
      }

      function validateForm() {
          let isValid = true;
          if (!roomNameInput.value.trim()) {
              roomNameError.style.display = 'block';
              roomNameInput.classList.add('is-invalid');
              isValid = false;
          } else {
              roomNameError.style.display = 'none';
              roomNameInput.classList.remove('is-invalid');
          }
          if (!cinemaInput.value) {
              cinemaError.style.display = 'block';
              cinemaInput.classList.add('is-invalid');
              isValid = false;
          } else {
              cinemaError.style.display = 'none';
              cinemaInput.classList.remove('is-invalid');
          }
          return isValid;
      }

      if (form) {
          form.addEventListener('submit', function (e) {
              if (!validateForm()) {
                  e.preventDefault();
                  alert('Please fill out all required fields correctly.');
              }
          });
      }
  });
</script>
</body>
</html>
