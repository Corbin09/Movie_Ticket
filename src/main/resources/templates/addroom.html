<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Room</title>
  <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #1E5631;
        min-height: 100vh;
    }

    .logo {
        display: flex;
        align-items: center;
        padding: 15px 30px;
    }

    .logo img {
        height: 40px;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        color: white;
    }

    .user-info {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .user-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .user-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .log-out-btn {
        background-color: #dc3545;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
    }

    .page-title {
        color: white;
        font-size: 1.5rem;
        padding: 10px 30px;
        margin-bottom: 20px;
    }

    .content-container {
        display: flex;
    }

    .sidebar {
        width: 220px;
        background-color: #1E5631;
        padding: 15px;
    }

    .nav-item {
        display: flex;
        align-items: center;
        color: white;
        padding: 12px 15px;
        margin-bottom: 8px;
        border-radius: 5px;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.3s;
    }

    .nav-item:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }

    .nav-item.active {
        background-color: white;
        color: #1E5631;
    }

    .nav-item i {
        margin-right: 10px;
        font-size: 1.2rem;
    }

    .main-content {
        flex: 1;
        padding: 0 20px;
    }

    .card {
        background-color: white;
        border-radius: 10px;
        padding: 30px;
        max-width: 800px;
        margin: 0 auto;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: none;
        background-color: #e8f5e9;
        border-radius: 5px;
        font-size: 1rem;
    }

    select.form-control {
        appearance: none;
        background-image: url('data:image/svg+xml;utf8,<svg fill="black" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
        background-repeat: no-repeat;
        background-position: right 10px center;
    }

    .error-message {
        color: #dc3545;
        font-size: 0.85rem;
        margin-top: 5px;
    }

    .button-group {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
    }

    .btn {
        padding: 12px 25px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 500;
        transition: background-color 0.3s;
    }

    .btn-cancel {
        background-color: #b26836;
        color: white;
    }

    .btn-cancel:hover {
        background-color: #a05a2c;
    }

    .btn-add {
        background-color: #4CAF50;
        color: white;
    }

    .btn-add:hover {
        background-color: #3d8b40;
    }

    /* Icons for sidebar */
    .icon {
        width: 20px;
        height: 20px;
        margin-right: 10px;
        fill: currentColor;
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .content-container {
            flex-direction: column;
        }

        .sidebar {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding-bottom: 0;
        }

        .nav-item {
            width: auto;
            margin-right: 5px;
            font-size: 0.9rem;
            padding: 8px 12px;
        }

        .nav-item i, .icon {
            margin-right: 5px;
        }

        .main-content {
            padding: 10px;
        }

        .card {
            padding: 20px;
        }

        .header {
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .user-info {
            width: 100%;
            justify-content: space-between;
        }
    }

    @media (max-width: 480px) {
        .nav-item {
            padding: 8px;
            font-size: 0.8rem;
        }

        .button-group {
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
        }
    }
  </style>
</head>
<body>
<div class="logo">
  <svg class="icon" viewBox="0 0 24 24" style="width: 40px; height: 40px; fill: #4CAF50;">
    <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
  </svg>
  <span style="color: #4CAF50; font-size: 1.5rem; font-weight: bold; margin-left: 5px;">Cinemas</span>
</div>

<div class="header">
  <div class="page-title">Room Management\Add Room</div>
  <div class="user-info">
    <div class="user-avatar">
      <img th:src="@{/img/avatar.jpg}" alt="User Avatar" />
    </div>
    <span th:text="${username}">Phan Thuy Ngan</span>
    <button class="log-out-btn">Log out</button>
  </div>
</div>

<div class="content-container">
  <nav class="sidebar">
    <a href="/dashboard" class="nav-item">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
      </svg>
      Dashboard
    </a>
    <a href="/movies" class="nav-item">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
      </svg>
      Movies
    </a>
    <a href="/cinemas" class="nav-item">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M18 4v1h-2V4c0-.55-.45-1-1-1H9c-.55 0-1 .45-1 1v1H6V4c0-.55-.45-1-1-1s-1 .45-1 1v16c0 .55.45 1 1 1s1-.45 1-1v-1h2v1c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-1h2v1c0 .55.45 1 1 1s1-.45 1-1V4c0-.55-.45-1-1-1s-1 .45-1 1zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/>
      </svg>
      Cinemas
    </a>
    <a href="/showtimes" class="nav-item">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
      </svg>
      Showtimes
    </a>
    <a href="/rooms" class="nav-item active">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M14 6v15H3v-2h2V3h9v3h5v15h2v2h-4V6h-3zm-4 5v2h2v-2h-2z"/>
      </svg>
      Rooms
    </a>
    <a href="/orders" class="nav-item">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 15l-5-5h3V9h4v4h3l-5 5z"/>
      </svg>
      Orders
    </a>
    <a href="/users" class="nav-item">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      Users
    </a>
    <a href="/" class="nav-item">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      Homepage
    </a>
  </nav>

  <div class="main-content">
    <div class="card">
      <form th:action="@{/rooms/add}" th:object="${room}" method="post" id="addRoomForm">
        <div class="form-group">
          <label for="roomName">Room name</label>
          <input type="text" class="form-control" id="roomName" th:field="*{roomName}" />
          <div class="error-message" id="roomNameError" th:if="${#fields.hasErrors('roomName')}" th:errors="*{roomName}">This field cannot be empty.</div>
        </div>

        <div class="form-group">
          <label for="cinemaId">Cinema name</label>
          <select class="form-control" id="cinemaId" th:field="*{cinema.cinemaId}">
            <option th:each="cinema : ${cinemas}" th:value="${cinema.cinemaId}" th:text="${cinema.cinemaName}">Beta Thanh Xuan</option>
          </select>
        </div>

        <div class="form-group">
          <label for="seatsCount">Seats</label>
          <input type="text" class="form-control" id="seatsCount" name="seatsCount" />
          <div class="error-message" id="seatsCountError"></div>
        </div>

        <div class="button-group">
          <a th:href="@{/rooms}" class="btn btn-cancel" id="cancelBtn">Cancel</a>
          <button type="submit" class="btn btn-add" id="addBtn">Add</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script th:inline="javascript">
  document.addEventListener('DOMContentLoaded', function() {
      const roomNameInput = document.getElementById('roomName');
      const roomNameError = document.getElementById('roomNameError');
      const seatsCountInput = document.getElementById('seatsCount');
      const seatsCountError = document.getElementById('seatsCountError');
      const addRoomForm = document.getElementById('addRoomForm');

      // Validate room name
      roomNameInput.addEventListener('input', function() {
          if (!this.value.trim()) {
              roomNameError.textContent = 'This field cannot be empty.';
              roomNameError.style.display = 'block';
          } else {
              roomNameError.style.display = 'none';
          }
      });

      // Validate seats count - must be a number
      seatsCountInput.addEventListener('input', function() {
          if (isNaN(this.value) || this.value.trim() === '') {
              seatsCountError.textContent = 'This field must be number.';
              seatsCountError.style.display = 'block';
          } else {
              seatsCountError.style.display = 'none';
          }
      });

      // Form submission validation
      addRoomForm.addEventListener('submit', function(e) {
          let isValid = true;

          // Validate room name
          if (!roomNameInput.value.trim()) {
              roomNameError.textContent = 'This field cannot be empty.';
              roomNameError.style.display = 'block';
              isValid = false;
          }

          // Validate seats count
          if (isNaN(seatsCountInput.value) || seatsCountInput.value.trim() === '') {
              seatsCountError.textContent = 'This field must be number.';
              seatsCountError.style.display = 'block';
              isValid = false;
          }

          if (!isValid) {
              e.preventDefault();
          }
      });
  });
</script>
</body>
</html>
