<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Updated Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Import Poppins font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to right, #0a4322, #127b40, #0a4322);
            font-family: 'Poppins', sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            padding: 1.5rem;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            color: #0a4322;
            margin: 0 0 1rem;
            font-weight: 600;
            font-size: clamp(1.2rem, 5vw, 1.4rem);
        }

        label {
            display: block;
            margin: 0.5rem 0 0.3rem;
            color: #333;
            font-weight: 400;
            font-size: clamp(0.85rem, 4vw, 0.9rem);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.6rem;
            margin: 0.3rem 0 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
            font-size: clamp(0.85rem, 4vw, 0.9rem);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #1DE782;
            box-shadow: 0 0 3px rgba(29, 231, 130, 0.3);
        }

        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            right: 1rem;
            cursor: pointer;
            color: #777;
            font-size: clamp(0.8rem, 4vw, 0.9rem);
        }

        button {
            width: 100%;
            padding: 0.7rem;
            background: #1DE782;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: clamp(0.9rem, 4vw, 1rem);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 0.3rem;
            font-family: 'Poppins', sans-serif;
        }

        button:hover {
            background: #19c772;
        }

        .error-message,
        .logout-message {
            color: #ff3333;
            text-align: center;
            margin-bottom: 0.8rem;
            font-size: clamp(0.8rem, 4vw, 0.9rem);
        }

        .logout-message {
            color: #0a4322;
        }

        .register-container {
            text-align: center;
            margin-top: 1rem;
            color: #333;
            font-weight: 400;
            font-size: clamp(0.8rem, 4vw, 0.9rem);
        }

        .register-container a {
            color: #008300;
            text-decoration: none;
            margin-left: 0.3rem;
            font-weight: 400;
        }

        .register-container a:hover {
            color: #1DE782;
        }

        /* Media Queries for additional responsiveness */
        @media (max-width: 600px) {
            .login-container {
                padding: 1rem;
            }

            h2 {
                font-size: clamp(1.1rem, 5vw, 1.3rem);
            }

            button {
                padding: 0.6rem;
            }
        }

        @media (max-width: 400px) {
            input[type="text"],
            input[type="password"] {
                padding: 0.5rem;
            }

            .password-container i {
                right: 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Login to your account</h2>
    <div th:if="${param.error}">
        <p class="error-message">Invalid username or password</p>
    </div>
    <div th:if="${param.logout}">
        <p class="logout-message">You have been logged out</p>
    </div>
    <form th:action="@{/login}" method="post">
        <div>
            <label>Username:</label>
            <input type="text" name="username" placeholder="Enter your username" required>
        </div>
        <div class="password-container">
            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter your password" required id="password">
            <i class="fas fa-eye-slash" id="togglePassword" onclick="togglePasswordVisibility()"></i>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Log in</button>
    </form>
    <div class="register-container">
        Don't have an account? <a href="/register">Register Here</a>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.getElementById("togglePassword");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.classList.remove("fa-eye-slash");
            toggleIcon.classList.add("fa-eye");
        } else {
            passwordInput.type = "password";
            toggleIcon.classList.remove("fa-eye");
            toggleIcon.classList.add("fa-eye-slash");
        }
    }
</script>
</body>
</html>
