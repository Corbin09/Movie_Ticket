<body>
<div class="overlay-scan-qr">
  <div class="scan">
    <img class="line" src="img/line-24.svg" />
    <div class="div"></div>
    <div class="heading-ch-n-h-nh">Pay with Momo</div>
    <p class="text-wrapper">Scan QR code to pay</p>
    <div class="heading-ch-n-h-nh-2">Change other method</div>
    <div class="group">
      <div class="overlap-group">
        <div class="overlap"><img class="image" src="img/image-20.png" /></div>
        <div class="heading-ch-n-h-nh-3">Total amount:</div>
        <div class="heading-ch-n-h-nh-4">$90.00</div>
      </div>
    </div>
    <div class="group-2">
      <p class="p">Open Momo Mobile Application on Phone</p>
      <div class="div-wrapper"><div class="text-wrapper-2">1</div></div>
    </div>
    <div class="group-3">
      <div class="overlap-2">
        <p class="heading-ch-n-h-nh-5">On Momo, choose symbol&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Scan QR Code</p>
        <img class="ph-scan-light" src="img/ph-scan-light.svg" />
      </div>
      <div class="div-wrapper"><div class="text-wrapper-2">2</div></div>
    </div>
    <div class="group-4">
      <p class="p">Scan QR code on this page to complete payment</p>
      <div class="div-wrapper"><div class="text-wrapper-2">3</div></div>
    </div>
    <div class="overlap-3">
      <div class="heading-ch-n-h-nh-6">Transaction will end after</div>
      <div class="overlap-wrapper">
        <div class="overlap-4">
          <div class="rectangle"></div>
          <div class="text-wrapper-3" th:text="${minutes}">03</div>
          <div class="rectangle-2"></div>
          <div class="text-wrapper-4" th:text="${seconds}">00</div>
          <div class="text-wrapper-5">:</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    let minutes = parseInt(document.querySelector(".text-wrapper-3").textContent);
    let seconds = parseInt(document.querySelector(".text-wrapper-4").textContent);

    function updateDisplay() {
        document.querySelector(".text-wrapper-3").textContent = String(minutes).padStart(2, '0');
        document.querySelector(".text-wrapper-4").textContent = String(seconds).padStart(2, '0');
    }

    function countdown() {
        if (minutes === 0 && seconds === 0) {
            clearInterval(timer);
            alert("Transaction time ended");
            return;
        }

        if (seconds === 0) {
            minutes--;
            seconds = 59;
        } else {
            seconds--;
        }
        updateDisplay();
    }

    updateDisplay();
    const timer = setInterval(countdown, 1000);
  });
</script>
