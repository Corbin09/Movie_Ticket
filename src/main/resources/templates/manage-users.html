<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Cinema Management System</title>
    <link rel="stylesheet" th:href="@{/css/header_sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/manage-users.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
<div class="app-container">
    <div th:replace="~{fragments/header_admin_sidebar :: header_sidebar}"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Content -->
        <div class="content-view">
            <!-- Page Header -->
            <div class="content-header">
                <h1>User Management</h1>
            </div>

            <!-- Filters -->
            <div class="filters">
                <div class="filter-group">
                    <span>Filter by:</span>
                    <div class="dropdown">
                        <div class="dropdown-toggle">
                            <span th:text="${currentSearchField != null ? searchFields.get(currentSearchField) : 'Select Field'}">
                                    Select Field
                            </span>
                            <i class="fa fa-chevron-down"></i>
                        </div>
                        <div class="dropdown-menu">
                            <a th:each="field : ${searchFields}"
                               th:href="@{/manage-users(searchField=${field.key},
                               searchText=${currentSearchText},
                               page=1,
                               pageSize=${pageSize})}"
                               th:text="${field.value}">Field</a>
                        </div>
                    </div>
                </div>
                <div class="search-box">
                    <form id="searchForm" th:action="@{/manage-users}" method="get">
                        <input type="hidden" name="searchField" th:value="${currentSearchField}">
                        <input type="hidden" name="pageSize" th:value="${pageSize}">
                        <input type="text" name="searchText" th:value="${currentSearchText}"
                               placeholder="Search..." />
                        <button type="submit" class="search-icon">
                            <i class="fa fa-search"></i>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>User Names</th>
                        <th>Emails</th>
                        <th>Phone Numbers</th>
                        <th>Roles</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="user : ${users}" th:data-id="${user.userId}">
                        <td>
                            <a th:href="@{/users/edit/{id}(id=${user.userId})}"
                               style="text-decoration: none; color: inherit;">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <div class="user-avatar-small">
                                        <img th:if="${user.userImg}" th:src="${user.userImg}" alt="User Avatar">
                                    </div>
                                    <span th:text="${user.username}">User Name</span>
                                </div>
                            </a>
                        </td>
                        <td th:text="${user.email}">user@example.com</td>
                        <td th:text="${user.phoneNumber}">0000000000</td>
                        <td>
                            <!-- Inline Role Selection -->
                            <select class="role-select" th:data-user-id="${user.userId}">
                                <option value="ADMIN"
                                        th:selected="${user.role == 'ADMIN' || user.role == 'ROLE_ADMIN'}">Admin
                                </option>
                                <option value="USER"
                                        th:selected="${user.role == 'USER' || user.role == 'ROLE_USER'}">User
                                </option>
                            </select>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="4" style="text-align: center;">No users found</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <div class="pagination-info">
                    <span th:if="${totalItems > 0}"
                          th:text="'Showing '
                              + ${(currentPage - 1) * pageSize + 1}
                              + '-'
                              + ${currentPage * pageSize > totalItems ? totalItems : currentPage * pageSize}
                              + ' of '
                              + ${totalItems}">
                            Showing 1-10 of 100
                    </span>
                    <span th:if="${totalItems == 0}">No users found</span>
                </div>
                <div class="page-controls">
                    <div class="page-size">
                        <span>Lines per page:</span>
                        <div class="dropdown">
                            <div class="dropdown-toggle">
                                <span th:text="${pageSize}">10</span>
                                <i class="fa fa-chevron-down"></i>
                            </div>
                            <div class="dropdown-menu">
                                <a th:each="size : ${#numbers.sequence(5, 25, 5)}"
                                   th:href="@{/manage-users(searchField=${currentSearchField},
                                   searchText=${currentSearchText},
                                   page=1,
                                   pageSize=${size})}"
                                   th:text="${size}">10</a>
                            </div>
                        </div>
                    </div>
                    <div class="page-navigation">
                        <a th:if="${currentPage > 1}"
                           th:href="@{/manage-users(searchField=${currentSearchField},
                           searchText=${currentSearchText},
                           page=${currentPage - 1},
                           pageSize=${pageSize})}"
                           class="prev-btn">
                            <i class="fa fa-chevron-left"></i>
                        </a>
                        <a th:if="${currentPage <= 1}" class="prev-btn disabled">
                            <i class="fa fa-chevron-left"></i>
                        </a>

                        <span th:text="${currentPage + ' / ' + totalPages}">1 / 5</span>

                        <a th:if="${currentPage < totalPages}"
                           th:href="@{/manage-users(searchField=${currentSearchField},
                           searchText=${currentSearchText},
                           page=${currentPage + 1},
                           pageSize=${pageSize})}"
                           class="next-btn">
                            <i class="fa fa-chevron-right"></i>
                        </a>
                        <a th:if="${currentPage >= totalPages}" class="next-btn disabled">
                            <i class="fa fa-chevron-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Notification Component -->
<div id="notification" class="notification">
    <i id="notification-icon" class="fas"></i>
    <span id="notification-message"></span>
</div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        initUserAvatars();
        initDropdowns();
        initRoleSelector();
    });

    // Initialize user avatars
    function initUserAvatars() {
        const avatars = document.querySelectorAll('.user-avatar:not(:has(img)), .user-avatar-small:not(:has(img))');

        avatars.forEach((avatar, index) => {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA62B', '#A78BFA', '#10B981'];
            const initials = ['CB', 'DB', 'GJ', 'PT'];

            const userInitials = avatar.getAttribute('data-initials') || initials[index % initials.length];

            // Create SVG element
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', '100%');
            svg.setAttribute('height', '100%');
            svg.setAttribute('viewBox', '0 0 100 100');

            // Create circle background
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', '50');
            circle.setAttribute('cy', '50');
            circle.setAttribute('r', '50');
            circle.setAttribute('fill', colors[index % colors.length]);

            // Create text
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', '50');
            text.setAttribute('y', '50');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('dominant-baseline', 'middle');
            text.setAttribute('fill', 'white');
            text.setAttribute('font-size', '40');
            text.textContent = userInitials;

            svg.appendChild(circle);
            svg.appendChild(text);

            avatar.appendChild(svg);
        });
    }

    // Initialize dropdown functionality
    function initDropdowns() {
        const dropdowns = document.querySelectorAll('.dropdown');

        dropdowns.forEach(dropdown => {
            const toggle = dropdown.querySelector('.dropdown-toggle');
            const menu = dropdown.querySelector('.dropdown-menu');

            toggle.addEventListener('click', function (event) {
                if (menu.classList.contains('show')) {
                    menu.classList.remove('show');
                } else {
                    document.querySelectorAll('.dropdown-menu.show').forEach(m => {
                        m.classList.remove('show');
                    });
                    menu.classList.add('show');
                }
                event.stopPropagation();
            });
        });

        document.addEventListener('click', function () {
            document.querySelectorAll('.dropdown-menu.show').forEach(menu => {
                menu.classList.remove('show');
            });
        });
    }

    // Initialize role selection functionality
    function initRoleSelector() {
        const roleSelects = document.querySelectorAll('.role-select');

        roleSelects.forEach(select => {
            select.addEventListener('change', function () {
                const userId = this.getAttribute('data-user-id');
                const newRole = this.value;

                const loadingIndicator = document.createElement('span');
                loadingIndicator.classList.add('loading-indicator');
                this.parentNode.appendChild(loadingIndicator);

                this.disabled = true;

                // Call the API to update user role
                updateUserRole(userId, newRole)
                    .then(response => {
                        if (response.success) {
                            showNotification('success', 'Role updated successfully');
                        } else {
                            showNotification('error', response.message || 'Failed to update role');
                            this.value = this.getAttribute('data-original-value');
                        }
                    })
                    .catch(error => {
                        console.error('Error updating role:', error);
                        showNotification('error', 'Failed to update role');
                        this.value = this.getAttribute('data-original-value');
                    })
                    .finally(() => {
                        // Remove loading indicator
                        if (loadingIndicator) {
                            loadingIndicator.remove();
                        }
                        this.disabled = false;
                        this.setAttribute('data-original-value', this.value);
                    });
            });

            select.setAttribute('data-original-value', select.value);
        });
    }

    // Function to update user role via AJAX
    function updateUserRole(userId, role) {
        const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') ||
            document.querySelector('input[name="_csrf"]')?.value;
        const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';

        if (!token) {
            console.error('CSRF token not found');
            return Promise.reject('CSRF token not found');
        }

        const headers = {
            'Content-Type': 'application/json',
            [header]: token
        };

        return fetch('/users/update-role', {
            method: 'POST',
            headers: headers,
            credentials: 'same-origin',
            body: JSON.stringify({
                userId: userId,
                role: role
            })
        })
            .then(response => {
                if (!response.ok) {
                    console.error('Error status:', response.status);
                    return response.text().then(text => {
                        console.error('Error response:', text);
                        throw new Error('Network response was not ok');
                    });
                }
                return response.json();
            });
    }

    // Function to show notification
    function showNotification(type, message) {
        const notification = document.getElementById('notification');
        const notificationIcon = document.getElementById('notification-icon');
        const notificationMessage = document.getElementById('notification-message');

        notification.className = 'notification';
        notification.classList.add(type);

        if (type === 'success') {
            notificationIcon.className = 'fas fa-check-circle';
        } else if (type === 'error') {
            notificationIcon.className = 'fas fa-exclamation-circle';
        }

        notificationMessage.textContent = message;

        notification.classList.add('show');

        // Auto-hide after delay
        setTimeout(() => {
            notification.classList.remove('show');
        }, 3000);
    }
</script>

</body>
</html>
