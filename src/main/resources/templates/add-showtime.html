<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Showtime</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
    <link rel="stylesheet" th:href="@{/css/header_sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/add-showtime.css}">
</head>

<body>

<div th:replace="~{fragments/header_admin_sidebar :: header_sidebar}"></div>

<section id="add-showtime-screen" class="screen active">
    <div class="form-container">
        <h2>Add Showtime</h2>

        <form id="add-showtime-form" th:action="@{/showtimes/save}" th:object="${showtime}" method="post">
            <div class="form-group">
                <label for="film-select">Film</label>
                <div class="select-wrapper">
                    <select id="film-select" name="film.filmId" required>
                        <option value="">Select Film</option>
                        <option th:each="film : ${films}" th:value="${film.filmId}" th:text="${film.filmName}"
                                th:selected="${showtime.film != null && film.filmId == showtime.film.filmId}">Film Title
                        </option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <span class="error" th:if="${#fields.hasErrors('film')}" th:errors="*{film}"></span>
            </div>

            <div class="form-group">
                <label for="cinema-select">Cinema</label>
                <div class="select-wrapper">
                    <select id="cinema-select" name="cinema.cinemaId" required>
                        <option value="">Select Cinema</option>
                        <option th:each="cinema : ${cinemas}" th:value="${cinema.cinemaId}"
                                th:text="${cinema.cinemaName}"
                                th:selected="${showtime.cinema != null && cinema.cinemaId == showtime.cinema.cinemaId}">
                            Cinema Name</option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <span class="error" th:if="${#fields.hasErrors('cinema')}" th:errors="*{cinema}"></span>
            </div>

            <div class="form-group">
                <label for="room-select">Room</label>
                <div class="select-wrapper">
                    <select id="room-select" name="room.roomId" required>
                        <option value="">Select Room</option>
                        <option th:each="room : ${rooms}" th:value="${room.roomId}" th:text="${room.roomName}"
                                th:attr="data-cinema-id=${room.cinema.cinemaId}"
                                th:selected="${showtime.room != null && room.roomId == showtime.room.roomId}">Room Name
                        </option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <span class="error" th:if="${#fields.hasErrors('room')}" th:errors="*{room}"></span>
            </div>

            <!-- Date picker using flatpickr for better format control -->
            <div class="form-group">
                <label for="show-date-display">Show Date</label>
                <input type="text" id="show-date-display" placeholder="Select date" required>
                <input type="hidden" id="show-date" name="showDate"
                       th:value="${showtime.showDate != null ? #dates.format(showtime.showDate, 'MM/dd/yyyy') : ''}">
                <span class="error" th:if="${#fields.hasErrors('showDate')}" th:errors="*{showDate}"></span>
            </div>

            <!-- Time picker with flatpickr -->
            <div class="form-group">
                <label for="show-time-display">Show Time</label>
                <div class="time-picker-container">
                    <!-- Visible input for time display -->
                    <input type="text" id="show-time-display" placeholder="Select time" required>
                    <input type="hidden" id="show-time" name="showTime" th:value="${showtime.showTime}">
                    <span class="error" th:if="${#fields.hasErrors('showTime')}" th:errors="*{showTime}"></span>
                </div>
            </div>

            <div class="form-actions">
                <a th:href="@{/manage-showtimes}" class="cancel-btn">Cancel</a>
                <button type="submit" class="submit-btn">Add Showtime</button>
            </div>
        </form>
    </div>
</section>

<!-- Success Overlay -->
<div th:if="${successMessage}" class="overlay-container" id="successOverlay">
    <div class="overlay-box">
        <div class="overlay-icon">
            <img src="/api/placeholder/80/80" alt="Success">
        </div>
        <h2 class="overlay-title">Add Success!</h2>
        <p class="overlay-text" th:text="${successMessage}">Showtime has been added successfully.</p>
        <a th:href="@{/manage-showtimes}" class="overlay-btn overlay-btn-success">Go to Showtimes List</a>
        <a th:href="@{/admin-dashboard}" class="overlay-btn overlay-btn-back">Back to Dashboard</a>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        // Date picker with flatpickr for better format control
        const dateDisplayInput = document.getElementById('show-date-display');
        const dateHiddenInput = document.getElementById('show-date');

        // Initialize flatpickr for date
        const datePicker = flatpickr(dateDisplayInput, {
            dateFormat: "m/d/Y", // MM/DD/YYYY format for Java's SimpleDateFormat
            minDate: "today",
            defaultDate: dateHiddenInput.value || null,
            onChange: function (selectedDates, dateStr) {
                const date = selectedDates[0];
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const year = date.getFullYear();
                const formattedDate = `${month}/${day}/${year}`;

                dateHiddenInput.value = formattedDate;
                dateDisplayInput.classList.remove('invalid');

                const errorElement = dateDisplayInput.parentNode.querySelector('.field-error');
                if (errorElement) {
                    errorElement.remove();
                }
            }
        });

        if (dateHiddenInput.value) {
            dateDisplayInput.value = dateHiddenInput.value;
        }

        // Time picker initialization with flatpickr
        const timeDisplayInput = document.getElementById('show-time-display');
        const timeHiddenInput = document.getElementById('show-time');

        // Initialize flatpickr for time
        const timePicker = flatpickr(timeDisplayInput, {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i:S",
            time_24hr: true,
            defaultDate: timeHiddenInput.value || null,
            minuteIncrement: 5,
            onChange: function (selectedDates, timeStr) {
                const time = selectedDates[0];
                const hours = String(time.getHours()).padStart(2, '0');
                const minutes = String(time.getMinutes()).padStart(2, '0');
                const seconds = String(time.getSeconds()).padStart(2, '0');
                const formattedTime = `${hours}:${minutes}:${seconds}`;

                timeHiddenInput.value = formattedTime;
                timeDisplayInput.classList.remove('invalid');

                const errorElement = timeDisplayInput.parentNode.querySelector('.field-error');
                if (errorElement) {
                    errorElement.remove();
                }
            }
        });

        if (timeHiddenInput.value) {
            timeDisplayInput.value = timeHiddenInput.value;
        }

        // Store all rooms for filtering
        const cinemaSelect = document.getElementById('cinema-select');
        const roomSelect = document.getElementById('room-select');
        const allRooms = Array.from(roomSelect.options).slice(1); // Skip the placeholder option

        // Filter rooms based on selected cinema
        cinemaSelect.addEventListener('change', function () {
            const selectedCinemaId = this.value;

            while (roomSelect.options.length > 1) {
                roomSelect.remove(1);
            }

            if (!selectedCinemaId) {
                return;
            }

            // Add rooms that belong to the selected cinema
            allRooms.forEach(roomOption => {
                const cinemaBelongsTo = roomOption.getAttribute('data-cinema-id');
                if (cinemaBelongsTo === selectedCinemaId) {
                    roomSelect.add(roomOption.cloneNode(true));
                }
            });
        });

        const form = document.getElementById('add-showtime-form');

        form.addEventListener('submit', function (e) {
            let isValid = true;

            // Check if date is selected
            if (!dateHiddenInput.value) {
                dateDisplayInput.classList.add('invalid');
                isValid = false;

                let errorSpan = dateDisplayInput.nextElementSibling;
                if (!errorSpan || !errorSpan.classList.contains('field-error')) {
                    errorSpan = document.createElement('span');
                    errorSpan.classList.add('field-error');
                    errorSpan.textContent = 'Show date must be selected';
                    dateDisplayInput.parentNode.insertBefore(errorSpan, dateDisplayInput.nextSibling);
                }
            } else {
                dateDisplayInput.classList.remove('invalid');
                let errorSpan = dateDisplayInput.nextElementSibling;
                if (errorSpan && errorSpan.classList.contains('field-error')) {
                    errorSpan.remove();
                }
            }

            // Check if time is selected
            if (!timeHiddenInput.value) {
                timeDisplayInput.classList.add('invalid');
                isValid = false;

                let container = document.querySelector('.time-picker-container');
                let errorSpan = container.querySelector('.field-error');
                if (!errorSpan) {
                    errorSpan = document.createElement('span');
                    errorSpan.classList.add('field-error');
                    errorSpan.textContent = 'Show time must be selected';
                    container.appendChild(errorSpan);
                }
            } else {
                timeDisplayInput.classList.remove('invalid');
                let errorSpan = document.querySelector('.time-picker-container .field-error');
                if (errorSpan) {
                    errorSpan.remove();
                }
            }

            // Check other required fields
            const requiredSelects = form.querySelectorAll('select[required]');
            requiredSelects.forEach(select => {
                if (!select.value) {
                    select.classList.add('invalid');
                    isValid = false;

                    let errorSpan = select.nextElementSibling;
                    if (!errorSpan || !errorSpan.classList.contains('field-error')) {
                        errorSpan = document.createElement('span');
                        errorSpan.classList.add('field-error');
                        errorSpan.textContent = 'This field is required';
                        select.parentNode.insertBefore(errorSpan, select.nextSibling);
                    }
                } else {
                    select.classList.remove('invalid');
                    let errorSpan = select.nextElementSibling;
                    if (errorSpan && errorSpan.classList.contains('field-error')) {
                        errorSpan.remove();
                    }
                }
            });

            if (!isValid) {
                e.preventDefault();
            }
        });
    });
</script>

</body>
</html>
