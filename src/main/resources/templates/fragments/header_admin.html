<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Cinema Header and Sidebar</title>
    <!-- Fix for 404: Reference CSS with Thymeleaf syntax -->
    <link rel="stylesheet" th:href="@{/css/header_sidebar.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Original header styles (add your existing styles here) */
        /* Profile Overlay Styles */
        /* Update your profile-overlay CSS */
.profile-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    overflow: auto; /* Add this to allow scrolling if needed */
}

/* Ensure your profile containers have proper z-index */
.profile-container, .edit-profile-container {
    z-index: 1001; /* Higher than the overlay */
    /* Keep your other styles */
}

/* Add this to prevent body scroll when overlay is active */
body.overlay-active {
    overflow: hidden;
}

        /* Profile Container Styles */
        .profile-container {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
            border: 1px solid #e0e0e0;
            border-bottom: 4px solid #45c486;
            position: relative;
        }

        /* Close Button */
        .close-profile {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            color: white;
            cursor: pointer;
            z-index: 1010;
        }

        /* Profile Header */
        .profile-header {
            background-color: #0f4d2e;
            height: 100px;
            position: relative;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background-color: #e9f3d9;
            border-radius: 50%;
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            border: 3px solid white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Profile Content */
        .profile-content {
            padding: 50px 20px 20px;
            background-color: white;
        }

        .profile-field {
            margin-bottom: 15px;
        }

        .profile-field label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .profile-field input, .profile-field select {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            color: #333;
            outline: none;
            background-color: #f9f9f9;
        }

        .profile-field input:read-only {
            background-color: #f5f5f5;
            cursor: default;
        }

        /* Profile Actions */
        .profile-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: center;
        }

        .profile-actions a {
            text-decoration: none;
        }

        .profile-actions button {
            padding: 12px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            font-size: 14px;
        }

        .edit-btn, .update-btn, .view-btn {
            background-color: #0f4d2e;
            color: white;
            flex: 1;
            max-width: 135px;
        }

        .edit-btn:hover, .update-btn:hover, .view-btn:hover {
            background-color: #0a3b23;
        }

        .cancel-btn {
            background-color: #777;
            color: white;
            flex: 1;
            max-width: 135px;
        }

        .cancel-btn:hover {
            background-color: #555;
        }

        /* Edit Profile Container */
        .edit-profile-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .avatar-edit-icon {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border-radius: 50%;
            padding: 5px;
            cursor: pointer;
            font-size: 10px;
        }

        .profile-field-container {
            position: relative;
            width: 100%;
        }

        .error-message {
            color: #d9534f;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* Date picker and select styles */
        .profile-field select, .profile-field input[type="date"] {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            color: #333;
            outline: none;
            background-color: #f9f9f9;
        }

        /* Notification styling */
        .notification {
            padding: 12px;
            margin: 10px 20px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .notification.success {
            color: green;
        }

        .notification.error {
            color: green;
        }

        .field-hint {
            font-size: 12px;
            color: #666;
            margin: 3px 0 0;
        }

        /* Loader for button */
        @keyframes spinner {
            to {transform: rotate(360deg);}
        }

        .loading-spinner::before {
            content: '';
            box-sizing: border-box;
            position: absolute;
            top: 50%;
            left: 10px;
            width: 16px;
            height: 16px;
            margin-top: -8px;
            border-radius: 50%;
            border: 2px solid #ccc;
            border-top-color: #fff;
            animation: spinner .6s linear infinite;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .profile-container, .edit-profile-container {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
<!-- Header và Sidebar Fragment -->
<header th:fragment="header_admin">
    <div class="header" style="z-index: 1000;">
        <div class="container">
            <div class="header-top">
                <div class="to-menu">
                    <img th:src="@{/images/cinema_logo.png}" alt="Cinema Logo" class="logo">
                    <!-- Sidebar Toggle Button for Mobile -->
                </div>

                <!-- User Section: Hiển thị Avatar và Username -->
                <div class="user-section" id="userSection" style="cursor: pointer;">
                    <img th:src="${user.userImg}" alt="User  Avatar" class="user-avatar" onerror="this.src='images/anonymous.png';">
                    <span class="username" th:text="${user.username}">User  Name</span>
                    <a th:href="@{/logout}" class="logout-btn">Log out</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Overlay -->
    <div class="profile-overlay" id="profileOverlay">
        <div class="profile-container" id="viewProfileContainer">
            <div class="profile-header">
                <div class="close-profile" id="closeProfile">
                    <i class="fas fa-times"></i>
                </div>
                <div class="profile-avatar">
                    <img th:src="${user.userImg}" alt="User Avatar" id="viewProfileAvatar"
                         onerror="this.src='images/anonymous.png';">
                </div>
            </div>

            <div class="profile-content">
                <div class="profile-field">
                    <label for="viewUsername">Username</label>
                    <input type="text" id="viewUsername" name="username" th:value="${user.username}" readonly>
                </div>

                <div class="profile-field">
                    <label for="viewEmail">Email</label>
                    <input type="email" id="viewEmail" name="email" th:value="${user.email}" readonly>
                </div>

                <div class="profile-field">
                    <label for="viewPhone">Phone Number</label>
                    <input type="tel" id="viewPhone" name="phone" th:value="${user.phoneNumber}" readonly>
                </div>

                <div class="profile-field">
                    <label for="viewSex">Sex</label>
                    <input type="text" id="viewSex" name="sex" th:value="${user.sex}" readonly>
                </div>

                <div class="profile-field">
                    <label for="viewDateOfBirth">Date of Birth</label>
                    <input type="text" id="viewDateOfBirth" name="dateOfBirth" th:value="${#dates.format(user.dateOfBirth, 'dd/MM/yyyy')}" readonly>
                </div>

                <div class="profile-actions">
                    <button class="edit-btn" id="showEditProfile">Edit Profile</button>
                    <a th:href="@{/user/detail-profile}" class="view-btn">View Profile</a>
                </div>
            </div>
        </div>

        <!-- Edit Profile Container -->
        <div class="edit-profile-container" id="editProfileContainer" style="display: none;">
            <div class="profile-header">
                <div class="close-profile" id="closeEditProfile">
                    <i class="fas fa-times"></i>
                </div>
                <div class="profile-avatar" id="avatar">
                    <img th:src="${user.userImg}" id="avatar-img" alt="Avatar"
                         onerror="this.src='images/anonymous.png';">
                    <span class="avatar-edit-icon" onclick="document.getElementById('avatar-input').click()">
                        <i class="fas fa-pencil-alt"></i>
                    </span>
                    <input type="file" id="avatar-input" style="display: none;" accept="image/*" onchange="previewAvatar(event)">
                </div>
            </div>

            <div class="profile-content">
                <form id="profileForm">
                    <input type="hidden" name="_csrf" th:value="${_csrf?.token}">
                    <!-- Notification area -->
                    <div id="updateNotification" class="notification" style="display: none;"></div>
                    <div class="profile-field">
                        <label for="editUsername">Username</label>
                        <div class="profile-field-container">
                            <input type="text" id="editUsername" name="username" th:value="${user.username}">
                            <div class="error-message" id="usernameError"></div>
                        </div>
                    </div>

                    <div class="profile-field">
                        <label for="editEmail">Email</label>
                        <div class="profile-field-container">
                            <input type="email" id="editEmail" name="email" th:value="${user.email}">
                            <div class="error-message" id="emailError"></div>
                        </div>
                    </div>

                    <div class="profile-field">
                        <label for="editPhone">Phone Number</label>
                        <div class="profile-field-container">
                            <input type="tel" id="editPhone" name="phoneNumber" th:value="${user.phoneNumber}">
                            <div class="error-message" id="phoneError"></div>
                        </div>
                    </div>

                    <div class="profile-field">
                        <label for="editSex">Sex</label>
                        <div class="profile-field-container">
                            <select id="editSex" name="sex">
                                <option value="Male" th:selected="${user.sex == 'Male'}">Male</option>
                                <option value="Female" th:selected="${user.sex == 'Female'}">Female</option>
                                <option value="Other" th:selected="${user.sex == 'Other'}">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="profile-field">
                        <label for="editDateOfBirth">Date of Birth</label>
                        <div class="profile-field-container">
                            <input type="date" id="editDateOfBirth" name="dateOfBirth" th:value="${#dates.format(user.dateOfBirth, 'yyyy-MM-dd')}">
                        </div>
                    </div>

                    <div class="profile-actions">
                        <button type="button" class="cancel-btn" id="cancelEdit">Cancel</button>
                        <button type="button" class="update-btn" id="updateProfile">Update Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">

        // Profile and User Management JavaScript
 document.addEventListener('DOMContentLoaded', function() {
     // Cache DOM elements
     const userSection = document.getElementById('userSection');
     const profileOverlay = document.getElementById('profileOverlay');
     const viewProfileContainer = document.getElementById('viewProfileContainer');
     const editProfileContainer = document.getElementById('editProfileContainer');
     const showEditProfile = document.getElementById('showEditProfile');
     const cancelEdit = document.getElementById('cancelEdit');
     const updateProfile = document.getElementById('updateProfile');
     const profileForm = document.getElementById('profileForm');
     const closeProfile = document.getElementById('closeProfile');
     const closeEditProfile = document.getElementById('closeEditProfile');
     const avatarInput = document.getElementById('avatar-input');

     console.log('DOM loaded, initializing profile management');

     // Profile overlay functions
     function showProfileOverlay() {
         if (profileOverlay) {
             profileOverlay.style.display = 'flex';
             document.body.classList.add('overlay-active');
         }
     }

     function hideProfileOverlay() {
         if (profileOverlay) {
             profileOverlay.style.display = 'none';
             document.body.classList.remove('overlay-active');
             resetUpdateButton();
         }
     }

     // Reset update button state
     function resetUpdateButton() {
         const updateBtn = document.getElementById('updateProfile');
         if (updateBtn) {
             updateBtn.innerHTML = 'Update Profile';
             updateBtn.disabled = false;
         }
     }

     // Handle avatar preview
     function previewAvatar(event) {
         const file = event.target.files[0];
         if (file) {
             // Check file size (max 5MB)
             if (file.size > 5 * 1024 * 1024) {
                 showNotification('Image file size should not exceed 5MB', false);
                 event.target.value = '';
                 return;
             }

             const reader = new FileReader();
             reader.onload = function(e) {
                 const avatarImg = document.getElementById('avatar-img');
                 if (avatarImg) {
                     avatarImg.src = e.target.result;
                 }
             };
             reader.readAsDataURL(file);
         }
     }

     // Form validation
     function clearAllErrors() {
         const errorElements = document.querySelectorAll('.error-message');
         errorElements.forEach(element => {
             element.textContent = '';
             element.style.display = 'none';
         });
     }

     function showError(elementId, message) {
         const errorElement = document.getElementById(elementId);
         if (errorElement) {
             errorElement.textContent = message;
             errorElement.style.display = 'block';
         }
     }

     function showNotification(message, isSuccess) {
         const notification = document.getElementById('updateNotification');
         if (notification) {
             notification.textContent = message;
             notification.className = 'notification ' + (isSuccess ? 'success' : 'error');
             notification.style.display = 'block';

             // Auto-hide success notifications after 3 seconds
             if (isSuccess) {
                 setTimeout(() => {
                     notification.style.display = 'none';
                 }, 3000);
             }
         }
     }

     function validateProfileForm() {
         let isValid = true;
         clearAllErrors();

         // Validate username
         const username = document.getElementById('editUsername');
         if (username) {
             const usernameValue = username.value.trim();
             if (!usernameValue) {
                 showError('usernameError', 'Username is required');
                 isValid = false;
             } else if (usernameValue.length < 3) {
                 showError('usernameError', 'Username must be at least 3 characters');
                 isValid = false;
             }
         }

         // Validate email
         const email = document.getElementById('editEmail');
         if (email) {
             const emailValue = email.value.trim();
             const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
             if (!emailValue) {
                 showError('emailError', 'Email is required');
                 isValid = false;
             } else if (!emailRegex.test(emailValue)) {
                 showError('emailError', 'Please enter a valid email address');
                 isValid = false;
             }
         }

         // Validate phone number
         const phone = document.getElementById('editPhone');
         if (phone) {
             const phoneValue = phone.value.trim();
             const phoneRegex = /^\d{10,}$/;
             if (phoneValue && !phoneRegex.test(phoneValue)) {
                 showError('phoneError', 'Please enter a valid phone number (at least 10 digits)');
                 isValid = false;
             }
         }

         // Validate avatar file if one is selected
         const avatarInput = document.getElementById('avatar-input');
         if (avatarInput && avatarInput.files.length > 0) {
             const file = avatarInput.files[0];
             if (file.size > 5 * 1024 * 1024) {
                 showNotification('Image file size should not exceed 5MB', false);
                 isValid = false;
             }
         }

         return isValid;
     }

     function updateUserProfile() {
         // Hide previous notifications
         const notification = document.getElementById('updateNotification');
         if (notification) {
             notification.style.display = 'none';
         }

         if (!validateProfileForm()) {
             return;
         }

         // Show loading state on button
         const updateBtn = document.getElementById('updateProfile');
         if (updateBtn) {
             updateBtn.innerHTML = '<span class="loading-spinner"></span> Updating...';
             updateBtn.disabled = true;
         }

         // Prepare form data
         const formData = new FormData();

         // Add form fields
         const username = document.getElementById('editUsername');
         if (username) {
             formData.append('username', username.value.trim());
         }

         const email = document.getElementById('editEmail');
         if (email) {
             formData.append('email', email.value.trim());
         }

         const phone = document.getElementById('editPhone');
         if (phone && phone.value.trim()) {
             formData.append('phoneNumber', phone.value.trim());
         }

         const sex = document.getElementById('editSex');
         if (sex) {
             formData.append('sex', sex.value);
         }

         const dob = document.getElementById('editDateOfBirth');
         if (dob && dob.value) {
             formData.append('dateOfBirth', dob.value);
         }

         // Add avatar file if selected
         const avatarInput = document.getElementById('avatar-input');
         if (avatarInput && avatarInput.files.length > 0) {
             formData.append('userImg', avatarInput.files[0]);
         }

         // Add CSRF token if available
         const csrfToken = document.querySelector('input[name="_csrf"]');
         if (csrfToken) {
             formData.append('_csrf', csrfToken.value);
         }

         console.log('Submitting profile update...');

         // Set timeout for long requests (20 seconds)
         const timeoutId = setTimeout(() => {
             resetUpdateButton();
             showNotification('Request timed out. The server might be processing your image or unavailable.', false);
         }, 20000);

         // Send AJAX request
         fetch('/user/update-profile', {
             method: 'POST',
             body: formData,
             credentials: 'same-origin'
         })
         .then(response => {
             clearTimeout(timeoutId);
             console.log('Server response status:', response.status);

             if (!response.ok) {
                 return response.text().then(text => {
                     console.log('Error response text:', text);
                     try {
                         return JSON.parse(text);
                     } catch (e) {
                         console.error('Failed to parse error response:', e);
                         if (response.status === 403) {
                             throw new Error('Access denied. You may need to log in again.');
                         } else {
                             throw new Error('Server returned an error: ' + response.status);
                         }
                     }
                 });
             }

             return response.text().then(text => {
                 console.log('Success response text:', text);
                 try {
                     return JSON.parse(text);
                 } catch (e) {
                     console.error('Failed to parse success response:', e);
                     throw new Error('Invalid response format');
                 }
             });
         })
         .then(data => {
             console.log('Parsed response data:', data);

             // Handle server validation errors
             if (data.success === false) {
                 if (data.errors) {
                     // Show field-specific errors
                     Object.keys(data.errors).forEach(field => {
                         const errorField = field + 'Error';
                         showError(errorField, data.errors[field]);
                     });
                     throw new Error('Please fix the errors above');
                 } else {
                     throw new Error(data.message || 'Update failed');
                 }
             }

             // Success case
             resetUpdateButton();
             showNotification('Profile updated successfully!', true);

             // Update view profile with new data
             updateViewProfile();

             // Update header username if it was changed
             const headerUsername = document.querySelector('.username');
             const editUsernameInput = document.getElementById('editUsername');
             if (headerUsername && editUsernameInput) {
                 headerUsername.textContent = editUsernameInput.value;
             }

             // Update avatars if returned in response
             if (data.user && data.user.userImg) {
                 const avatarUrl = data.user.userImg;
                 // Update all avatar instances
                 const avatars = document.querySelectorAll('.user-avatar, #viewProfileAvatar, #avatar-img');
                 avatars.forEach(avatar => {
                     avatar.src = avatarUrl;
                 });
             }

             // Switch back to view profile after success
             setTimeout(() => {
                 if (editProfileContainer && viewProfileContainer) {
                     editProfileContainer.style.display = 'none';
                     viewProfileContainer.style.display = 'block';
                 }
             }, 2000);
         })
         .catch(error => {
             console.error('Profile update error:', error);
             clearTimeout(timeoutId);
             resetUpdateButton();
             showNotification(error.message || 'Failed to update profile. Please try again.', false);
         });
     }

     // Update view profile from edit form
     function updateViewProfile() {
         // Update username
         const viewUsername = document.getElementById('viewUsername');
         const editUsername = document.getElementById('editUsername');
         if (viewUsername && editUsername) {
             viewUsername.value = editUsername.value;
         }

         // Update email
         const viewEmail = document.getElementById('viewEmail');
         const editEmail = document.getElementById('editEmail');
         if (viewEmail && editEmail) {
             viewEmail.value = editEmail.value;
         }

         // Update phone
         const viewPhone = document.getElementById('viewPhone');
         const editPhone = document.getElementById('editPhone');
         if (viewPhone && editPhone) {
             viewPhone.value = editPhone.value;
         }

         // Update sex
         const viewSex = document.getElementById('viewSex');
         const editSex = document.getElementById('editSex');
         if (viewSex && editSex) {
             viewSex.value = editSex.value;
         }

         // Update date of birth with formatting
         const editDate = document.getElementById('editDateOfBirth');
         const viewDob = document.getElementById('viewDateOfBirth');
         if (editDate && viewDob && editDate.value) {
             const parts = editDate.value.split('-');
             if (parts.length === 3) {
                 const formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
                 viewDob.value = formattedDate;
             }
         }
     }

     // Reset edit form from view form
     function resetEditForm() {
         const viewUsername = document.getElementById('viewUsername');
         const editUsername = document.getElementById('editUsername');
         if (viewUsername && editUsername) {
             editUsername.value = viewUsername.value;
         }

         const viewEmail = document.getElementById('viewEmail');
         const editEmail = document.getElementById('editEmail');
         if (viewEmail && editEmail) {
             editEmail.value = viewEmail.value;
         }

         const viewPhone = document.getElementById('viewPhone');
         const editPhone = document.getElementById('editPhone');
         if (viewPhone && editPhone) {
             editPhone.value = viewPhone.value;
         }

         const viewSex = document.getElementById('viewSex');
         const editSex = document.getElementById('editSex');
         if (viewSex && editSex) {
             // Use selectedIndex to match the option
             for (let i = 0; i < editSex.options.length; i++) {
                 if (editSex.options[i].value === viewSex.value) {
                     editSex.selectedIndex = i;
                     break;
                 }
             }
         }

         // Convert dd/MM/yyyy to yyyy-MM-dd for date input
         const viewDob = document.getElementById('viewDateOfBirth');
         const editDob = document.getElementById('editDateOfBirth');
         if (viewDob && editDob && viewDob.value) {
             const parts = viewDob.value.split('/');
             if (parts.length === 3) {
                 const formattedDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                 editDob.value = formattedDate;
             }
         }

         // Reset avatar file input
         const avatarInput = document.getElementById('avatar-input');
         if (avatarInput) {
             avatarInput.value = '';
         }

         // Clear errors and notifications
         clearAllErrors();
         const notification = document.getElementById('updateNotification');
         if (notification) {
             notification.style.display = 'none';
         }
     }

     // Initialize event listeners
     if (userSection) {
         userSection.addEventListener('click', function(e) {
             // If clicked on logout button, don't show profile
             if (e.target.classList.contains('logout-btn')) {
                 return;
             }
             showProfileOverlay();
             if (viewProfileContainer && editProfileContainer) {
                 viewProfileContainer.style.display = 'block';
                 editProfileContainer.style.display = 'none';
             }
         });
     }

     // Close profile overlay handlers
     if (closeProfile) {
         closeProfile.addEventListener('click', function() {
             hideProfileOverlay();
         });
     }

     if (closeEditProfile) {
         closeEditProfile.addEventListener('click', function() {
             hideProfileOverlay();
         });
     }

     // Close overlay when clicking background
     if (profileOverlay) {
         profileOverlay.addEventListener('click', function(e) {
             if (e.target === profileOverlay) {
                 hideProfileOverlay();
             }
         });
     }

     // Show edit profile view
     if (showEditProfile) {
         showEditProfile.addEventListener('click', function() {
             if (viewProfileContainer && editProfileContainer) {
                 viewProfileContainer.style.display = 'none';
                 editProfileContainer.style.display = 'block';
                 clearAllErrors();

                 // Reset notification
                 const notification = document.getElementById('updateNotification');
                 if (notification) {
                     notification.style.display = 'none';
                 }
             }
         });
     }

     // Cancel edit and return to view profile
     if (cancelEdit) {
         cancelEdit.addEventListener('click', function() {
             if (editProfileContainer && viewProfileContainer) {
                 editProfileContainer.style.display = 'none';
                 viewProfileContainer.style.display = 'block';
                 resetEditForm();
             }
         });
     }

     // Update profile button handler
     if (updateProfile) {
         updateProfile.addEventListener('click', function(e) {
             e.preventDefault();
             updateUserProfile();
         });
     }

     // Handle pressing Enter key in form fields
     if (profileForm) {
         profileForm.addEventListener('keypress', function(e) {
             if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
                 e.preventDefault();
                 updateProfile && updateProfile.click();
             }
         });
     }

     // Setup avatar file input handler
     if (avatarInput) {
         avatarInput.addEventListener('change', previewAvatar);
     }

     // Initialize view profile data on page load
     const editSex = document.getElementById('editSex');
     const viewSex = document.getElementById('viewSex');
     if (editSex && viewSex && editSex.value) {
         viewSex.value = editSex.value;
     }

     const editDob = document.getElementById('editDateOfBirth');
     const viewDob = document.getElementById('viewDateOfBirth');
     if (editDob && viewDob && editDob.value) {
         const parts = editDob.value.split('-');
         if (parts.length === 3) {
             const formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
             viewDob.value = formattedDate;
         }
     }

     console.log('Profile management initialized');
 });
    </script>
</header>
</body>
</html>
