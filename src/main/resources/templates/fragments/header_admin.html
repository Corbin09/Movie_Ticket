<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Cinema Header and Sidebar</title>
    <!-- Fix for 404: Reference CSS with Thymeleaf syntax -->
    <link rel="stylesheet" th:href="@{/css/header_admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>


        /* Original header styles (add your existing styles here) */
        /* Profile Overlay Styles */
        /* Update your profile-overlay CSS */
.profile-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    overflow: auto; /* Add this to allow scrolling if needed */
}

/* Ensure your profile containers have proper z-index */
.profile-container, .edit-profile-container {
    z-index: 1001; /* Higher than the overlay */
    /* Keep your other styles */
}

/* Add this to prevent body scroll when overlay is active */
body.overlay-active {
    overflow: hidden;
}

        /* Profile Container Styles */
        .profile-container {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
            border: 1px solid #e0e0e0;
            border-bottom: 4px solid #45c486;
            position: relative;
        }

        /* Close Button */
        .close-profile {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            color: white;
            cursor: pointer;
            z-index: 1010;
        }

        /* Profile Header */
        .profile-header {
            background-color: #0f4d2e;
            height: 100px;
            position: relative;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background-color: #e9f3d9;
            border-radius: 50%;
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            border: 3px solid white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Profile Content */
        .profile-content {
            padding: 50px 20px 20px;
            background-color: white;
        }

        .profile-field {
            margin-bottom: 15px;
        }

        .profile-field label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .profile-field input, .profile-field select {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            color: #333;
            outline: none;
            background-color: #f9f9f9;
        }

        .profile-field input:read-only {
            background-color: #f5f5f5;
            cursor: default;
        }

        /* Profile Actions */
        .profile-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: center;
        }

        .profile-actions a {
            text-decoration: none;
        }

        .profile-actions button {
            padding: 12px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            font-size: 14px;
        }

        .edit-btn, .update-btn, .view-btn {
            background-color: #0f4d2e;
            color: white;
            flex: 1;
            max-width: 135px;
        }

        .edit-btn:hover, .update-btn:hover, .view-btn:hover {
            background-color: #0a3b23;
        }

        .cancel-btn {
            background-color: #777;
            color: white;
            flex: 1;
            max-width: 135px;
        }

        .cancel-btn:hover {
            background-color: #555;
        }

        /* Edit Profile Container */
        .edit-profile-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .avatar-edit-icon {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border-radius: 50%;
            padding: 5px;
            cursor: pointer;
            font-size: 10px;
        }

        .profile-field-container {
            position: relative;
            width: 100%;
        }

        .error-message {
            color: #d9534f;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* Date picker and select styles */
        .profile-field select, .profile-field input[type="date"] {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            color: #333;
            outline: none;
            background-color: #f9f9f9;
        }

        /* Notification styling */
        .notification {
            padding: 12px;
            margin: 10px 20px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .notification.success {
            color: green;
        }

        .notification.error {
            color: green;
        }

        .field-hint {
            font-size: 12px;
            color: #666;
            margin: 3px 0 0;
        }

        /* Loader for button */
        @keyframes spinner {
            to {transform: rotate(360deg);}
        }

        .loading-spinner::before {
            content: '';
            box-sizing: border-box;
            position: absolute;
            top: 50%;
            left: 10px;
            width: 16px;
            height: 16px;
            margin-top: -8px;
            border-radius: 50%;
            border: 2px solid #ccc;
            border-top-color: #fff;
            animation: spinner .6s linear infinite;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .profile-container, .edit-profile-container {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
<!-- Header và Sidebar Fragment -->
<header th:fragment="header_admin">
    <div class="header" style="z-index: 1000;">
        <div class="container">
            <div class="header-top">
                <div class="to-menu">
                    <img th:src="@{/images/cinema_logo.png}" alt="Cinema Logo" class="logo">
                    <!-- Sidebar Toggle Button for Mobile -->
                </div>

                <!-- User Section: Hiển thị Avatar và Username -->
                <div class="user-section" id="userSection" style="cursor: pointer;">
                    <img th:src="${user.userImg}" alt="User  Avatar" class="user-avatar" onerror="this.src='images/anonymous.png';">
                    <span class="username" th:text="${user.username}">User  Name</span>
                    <a th:href="@{/logout}" class="logout-btn">Log out</a>
                </div>
            </div>
        </div>

        <!-- Profile Overlay -->
        <div class="profile-overlay" id="profileOverlay">
            <div class="profile-container" id="viewProfileContainer">
                <div class="profile-header">
                    <div class="close-profile" id="closeProfile">
                        <i class="fas fa-times"></i>
                    </div>
                    <div class="profile-avatar">
                        <img th:src="${user.userImg}" alt="User Avatar" id="viewProfileAvatar"
                             onerror="this.src='images/anonymous.png';">
                    </div>
                </div>

                <div class="profile-content">
                    <div class="profile-field">
                        <label for="viewUsername">Username</label>
                        <input type="text" id="viewUsername" name="username" th:value="${user.username}" readonly>
                    </div>

                    <div class="profile-field">
                        <label for="viewEmail">Email</label>
                        <input type="email" id="viewEmail" name="email" th:value="${user.email}" readonly>
                    </div>

                    <div class="profile-field">
                        <label for="viewPhone">Phone Number</label>
                        <input type="tel" id="viewPhone" name="phone" th:value="${user.phoneNumber}" readonly>
                    </div>

                    <div class="profile-field">
                        <label for="viewSex">Sex</label>
                        <input type="text" id="viewSex" name="sex" th:value="${user.sex}" readonly>
                    </div>

                    <div class="profile-field">
                        <label for="viewDateOfBirth">Date of Birth</label>
                        <input type="text" id="viewDateOfBirth" name="dateOfBirth" th:value="${#dates.format(user.dateOfBirth, 'dd/MM/yyyy')}" readonly>
                    </div>

                    <div class="profile-actions">
                        <button class="edit-btn" id="showEditProfile">Edit Profile</button>
                    </div>
                </div>
            </div>

            <!-- Edit Profile Container -->
            <div class="edit-profile-container" id="editProfileContainer" style="display: none;">
                <div class="profile-header">
                    <div class="close-profile" id="closeEditProfile">
                        <i class="fas fa-times"></i>
                    </div>
                    <div class="profile-avatar" id="avatar">
                        <img th:src="${user.userImg}" id="avatar-img" alt="Avatar"
                             onerror="this.src='images/anonymous.png';">
                        <span class="avatar-edit-icon" onclick="document.getElementById('avatar-input').click()">
                        <i class="fas fa-pencil-alt"></i>
                    </span>
                        <input type="file" id="avatar-input" style="display: none;" accept="image/*" onchange="previewAvatar(event)">
                    </div>
                </div>

                <div class="profile-content">
                    <form id="profileForm">
                        <input type="hidden" name="_csrf" th:value="${_csrf?.token}">
                        <!-- Notification area -->
                        <div id="updateNotification" class="notification" style="display: none;"></div>
                        <div class="profile-field">
                            <label for="editUsername">Username</label>
                            <div class="profile-field-container">
                                <input type="text" id="editUsername" name="username" th:value="${user.username}">
                                <div class="error-message" id="usernameError"></div>
                            </div>
                        </div>

                        <div class="profile-field">
                            <label for="editEmail">Email</label>
                            <div class="profile-field-container">
                                <input type="email" id="editEmail" name="email" th:value="${user.email}">
                                <div class="error-message" id="emailError"></div>
                            </div>
                        </div>

                        <div class="profile-field">
                            <label for="editPhone">Phone Number</label>
                            <div class="profile-field-container">
                                <input type="tel" id="editPhone" name="phoneNumber" th:value="${user.phoneNumber}">
                                <div class="error-message" id="phoneError"></div>
                            </div>
                        </div>

                        <div class="profile-field">
                            <label for="editSex">Sex</label>
                            <div class="profile-field-container">
                                <select id="editSex" name="sex">
                                    <option value="Male" th:selected="${user.sex == 'Male'}">Male</option>
                                    <option value="Female" th:selected="${user.sex == 'Female'}">Female</option>
                                    <option value="Other" th:selected="${user.sex == 'Other'}">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="profile-field">
                            <label for="editDateOfBirth">Date of Birth</label>
                            <div class="profile-field-container">
                                <input type="date" id="editDateOfBirth" name="dateOfBirth" th:value="${#dates.format(user.dateOfBirth, 'yyyy-MM-dd')}">
                            </div>
                        </div>

                        <div class="profile-actions">
                            <button type="button" class="cancel-btn" id="cancelEdit">Cancel</button>
                            <button type="button" class="update-btn" id="updateProfile">Update Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <!-- Add this to both files -->
    <script th:src="@{/js/profile-admin-welcome.js}"></script>
</header>
</body>
</html>
