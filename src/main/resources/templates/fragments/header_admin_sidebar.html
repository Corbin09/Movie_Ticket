<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Header and Sidebar</title>
  <link rel="stylesheet" href="/static/css/header_sidebar.css">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
<!-- Header và Sidebar Fragment -->
<header th:fragment="header_sidebar">
  <div class="header">
    <div class="container">
      <div class="header-top">
        <div class="to-menu">
          <img th:src="@{/images/cinema_logo.png}" alt="Cinema Logo" class="logo">
          <div class="sidebar-toggle" id="sidebar-toggle">
            <i class="fas fa-bars"></i>
          </div>
        </div>
        <div class="user-section">
          <img th:src="${user.userImg}" alt="User Avatar" class="user-avatar" onerror="this.src='/static/images/anonymous.png';">
          <span class="username" th:text="${user.username}">User Name</span>
          <a th:href="@{/logout}" class="logout-btn">Log out</a>
        </div>
      </div>
    </div>

    <!-- Profile Overlay -->
    <div class="profile-overlay" id="profile-overlay">
      <!-- View Profile Container -->
      <div class="profile-container" id="view-profile-container">
        <div class="profile-header">
          <div class="close-profile" id="close-view-profile">
            <i class="fas fa-times"></i>
          </div>
          <div class="profile-avatar">
            <img th:src="${user.userImg}" alt="User Avatar" id="view-profile-avatar"
                 onerror="this.src='/static/images/anonymous.png';">
          </div>
        </div>

        <div class="profile-content">
          <div class="profile-field">
            <label for="view-username">Username</label>
            <input type="text" id="view-username" name="username" th:value="${user.username}" readonly>
          </div>

          <div class="profile-field">
            <label for="view-email">Email</label>
            <input type="email" id="view-email" name="email" th:value="${user.email}" readonly>
          </div>

          <div class="profile-field">
            <label for="view-phone">Phone Number</label>
            <input type="tel" id="view-phone" name="phone" th:value="${user.phoneNumber}" readonly>
          </div>

          <div class="profile-field">
            <label for="view-sex">Sex</label>
            <input type="text" id="view-sex" name="sex" th:value="${user.sex}" readonly>
          </div>

          <div class="profile-field">
            <label for="view-date-of-birth">Date of Birth</label>
            <input type="text" id="view-date-of-birth" name="dateOfBirth" th:value="${#dates.format(user.dateOfBirth, 'dd/MM/yyyy')}" readonly>
          </div>

          <div class="profile-actions">
            <button class="edit-btn" id="show-edit-profile">Edit Profile</button>
          </div>
        </div>
      </div>

      <!-- Edit Profile Container -->
      <div class="edit-profile-container" id="edit-profile-container" style="display: none;">
        <div class="profile-header">
          <div class="close-profile" id="close-edit-profile">
            <i class="fas fa-times"></i>
          </div>
          <div class="profile-avatar" id="profile-avatar">
            <img th:src="${user.userImg}" id="avatar-img" alt="Avatar"
                 onerror="this.src='/static/images/anonymous.png';">
            <span class="avatar-edit-icon" onclick="document.getElementById('avatar-input').click()">
              <i class="fas fa-pencil-alt"></i>
            </span>
            <input type="file" id="avatar-input" style="display: none;" accept="image/*" onchange="previewAvatar(event)">
          </div>
        </div>

        <div class="profile-content">
          <form id="profile-form">
            <input type="hidden" name="_csrf" th:value="${_csrf?.token}">
            <!-- Notification area -->
            <div id="update-notification" class="notification" style="display: none;"></div>
            <div class="profile-field">
              <label for="edit-username">Username</label>
              <div class="profile-field-container">
                <input type="text" id="edit-username" name="username" th:value="${user.username}">
                <div class="error-message" id="username-error"></div>
              </div>
            </div>

            <div class="profile-field">
              <label for="edit-email">Email</label>
              <div class="profile-field-container">
                <input type="email" id="edit-email" name="email" th:value="${user.email}">
                <div class="error-message" id="email-error"></div>
              </div>
            </div>

            <div class="profile-field">
              <label for="edit-phone">Phone Number</label>
              <div class="profile-field-container">
                <input type="tel" id="edit-phone" name="phoneNumber" th:value="${user.phoneNumber}">
                <div class="error-message" id="phone-error"></div>
              </div>
            </div>

            <div class="profile-field">
              <label for="edit-sex">Sex</label>
              <div class="profile-field-container">
                <select id="edit-sex" name="sex">
                  <option value="Male" th:selected="${user.sex == 'Male'}">Male</option>
                  <option value="Female" th:selected="${user.sex == 'Female'}">Female</option>
                  <option value="Other" th:selected="${user.sex == 'Other'}">Other</option>
                </select>
              </div>
            </div>

            <div class="profile-field">
              <label for="edit-date-of-birth">Date of Birth</label>
              <div class="profile-field-container">
                <input type="date" id="edit-date-of-birth" name="dateOfBirth" th:value="${#dates.format(user.dateOfBirth, 'yyyy-MM-dd')}">
              </div>
            </div>

            <div class="profile-actions">
              <button type="button" class="cancel-btn" id="cancel-edit">Cancel</button>
              <button type="button" class="update-btn" id="update-profile">Update Profile</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
      <ul>
        <li><a th:href="@{/admin-dashboard}" th:classappend="${currPage == 'admin-dashboard'} ? 'active' : ''"><i class="fas fa-th-large"></i><span class="nav-text">Dashboard</span></a></li>
        <li><a th:href="@{/manage-movies}" th:classappend="${currPage == 'manage-movies'} ? 'active' : ''"><i class="fas fa-film"></i><span class="nav-text">Movies</span></a></li>
        <li><a th:href="@{/manage-cinemas}" th:classappend="${currPage == 'manage-cinemas'} ? 'active' : ''"><i class="fas fa-video"></i><span class="nav-text">Cinemas</span></a></li>
        <li><a th:href="@{/manage-showtimes}" th:classappend="${currPage == 'manage-showtimes'} ? 'active' : ''"><i class="fas fa-calendar-alt"></i><span class="nav-text">Showtimes</span></a></li>
        <li><a th:href="@{/manage-rooms}" th:classappend="${currPage == 'manage-rooms'} ? 'active' : ''"><i class="fas fa-users"></i><span class="nav-text">Rooms</span></a></li>
        <li><a th:href="@{/manage-orders}" th:classappend="${currPage == 'manage-orders'} ? 'active' : ''"><i class="fas fa-file-invoice-dollar"></i><span class="nav-text">Orders</span></a></li>
        <li><a th:href="@{/manage-users}" th:classappend="${currPage == 'manage-users'} ? 'active' : ''"><i class="fas fa-user"></i><span class="nav-text">Users</span></a></li>
        <li><a th:href="@{/welcome-admin}" th:classappend="${currPage == 'homepage'} ? 'active' : ''"><i class="fas fa-home"></i><span class="nav-text">Homepage</span></a></li>
      </ul>
    </nav>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <script>
    // Fast Loading Profile & Sidebar Management
    document.addEventListener('DOMContentLoaded', function() {
      // Critical path - immediately initialize sidebar
      initSidebar();

      // Initialize profile components only if needed
      if (document.querySelector('.user-section')) {
        // Optimize initial style injection
        injectStyles();

        // Use delayed loading techniques based on browser capabilities
        if ('requestIdleCallback' in window) {
          requestIdleCallback(initProfileManagement, { timeout: 500 });
        } else {
          // Fallback for browsers without requestIdleCallback
          setTimeout(initProfileManagement, 100);
        }
      }
    });

    // Apply critical CSS immediately to avoid layout shifts
    function injectStyles() {
      const criticalCSS = `
        #profile-overlay {
          display: none;
          opacity: 0;
          transition: opacity 0.15s ease-out;
        }
        #view-profile-container, #edit-profile-container {
          display: none !important;
          opacity: 0;
          transition: opacity 0.15s ease-out;
        }
        #profile-overlay.visible {
          opacity: 1;
          display: flex !important;
        }
        #view-profile-container.visible {
          opacity: 1;
          display: block !important;
        }
        #edit-profile-container.visible {
          opacity: 1;
          display: block !important;
        }
        .loading-spinner {
          display: inline-block;
          width: 1em;
          height: 1em;
          border: 2px solid rgba(255,255,255,0.3);
          border-radius: 50%;
          border-top-color: white;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      `;

      const style = document.createElement('style');
      style.textContent = criticalCSS;
      document.head.appendChild(style);
    }

    // Lightweight sidebar initialization
    function initSidebar() {
      const sidebar = document.getElementById('sidebar');
      const toggle = document.getElementById('sidebar-toggle');
      const overlay = document.getElementById('sidebar-overlay');

      if (!sidebar || !toggle) return;

      // Use event delegation to minimize handlers
      toggle.addEventListener('click', toggleSidebar);

      if (overlay) {
        overlay.addEventListener('click', closeSidebar);
      }

      function toggleSidebar() {
        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');
        document.body.classList.toggle('sidebar-open');
      }

      function closeSidebar() {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
        document.body.classList.remove('sidebar-open');
      }
    }

    // Efficient debounce with minimal overhead
    function debounce(fn, delay) {
      let timer = null;
      return function(...args) {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => {
          fn.apply(this, args);
          timer = null;
        }, delay);
      };
    }

    // Main profile management - lazily loaded
    function initProfileManagement() {
      // Guard against multiple initializations
      if (window.profileInitialized) return;
      window.profileInitialized = true;

      // Make sure edit container is hidden at initialization time
      const editContainer = document.getElementById('edit-profile-container');
      if (editContainer) {
        editContainer.style.display = 'none';
      }

      // Cache DOM elements - single-pass optimization
      const el = cacheElements();
      if (!el.profileOverlay || !el.viewContainer) return;

      // Set up event handlers using delegation where possible
      setupEventListeners(el);

      // Configure global avatar preview function
      window.previewAvatar = debounce(function(event) {
        const file = event.target.files[0];
        if (!file) return;

        // File validation
        if (file.size > 5 * 1024 * 1024) {
          showNotification('Image file size should not exceed 5MB', false);
          event.target.value = '';
          return;
        }

        // Efficient preview using URL.createObjectURL instead of FileReader when possible
        if (window.URL && window.URL.createObjectURL) {
          const avatarImg = document.getElementById('avatar-img');
          if (avatarImg) {
            const objectUrl = URL.createObjectURL(file);
            avatarImg.src = objectUrl;
            // Clean up the URL object after image loads
            avatarImg.onload = () => URL.revokeObjectURL(objectUrl);
          }
        } else {
          // Fallback to FileReader for older browsers
          const reader = new FileReader();
          reader.onload = function(e) {
            const avatarImg = document.getElementById('avatar-img');
            if (avatarImg) avatarImg.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
      }, 200);

      // Cache DOM elements in a single efficient pass
      function cacheElements() {
        return {
          userSection: document.querySelector('.user-section'),
          profileOverlay: document.getElementById('profile-overlay'),
          viewContainer: document.getElementById('view-profile-container'),
          editContainer: document.getElementById('edit-profile-container'),
          showEditBtn: document.getElementById('show-edit-profile'),
          cancelEditBtn: document.getElementById('cancel-edit'),
          updateBtn: document.getElementById('update-profile'),
          profileForm: document.getElementById('profile-form'),
          closeViewBtn: document.getElementById('close-view-profile'),
          closeEditBtn: document.getElementById('close-edit-profile'),
          avatarInput: document.getElementById('avatar-input'),
          notification: document.getElementById('update-notification'),
          csrfToken: document.querySelector('input[name="_csrf"]'),
          headerUsername: document.querySelector('.username'),
          avatars: document.querySelectorAll('.user-avatar, #view-profile-avatar, #avatar-img'),
          view: {
            username: document.getElementById('view-username'),
            email: document.getElementById('view-email'),
            phone: document.getElementById('view-phone'),
            sex: document.getElementById('view-sex'),
            dob: document.getElementById('view-date-of-birth')
          },
          edit: {
            username: document.getElementById('edit-username'),
            email: document.getElementById('edit-email'),
            phone: document.getElementById('edit-phone'),
            sex: document.getElementById('edit-sex'),
            dob: document.getElementById('edit-date-of-birth')
          },
          errors: {
            username: document.getElementById('username-error'),
            email: document.getElementById('email-error'),
            phone: document.getElementById('phone-error')
          }
        };
      }

      // Set up event listeners with efficient delegation
      function setupEventListeners(el) {
        // User section click - show profile overlay
        if (el.userSection) {
          el.userSection.addEventListener('click', function(e) {
            if (e.target.classList.contains('logout-btn') || e.target.closest('.logout-btn')) {
              return; // Skip logout button clicks
            }
            showProfileOverlay();
          });
        }

        // Close buttons
        if (el.closeViewBtn) el.closeViewBtn.addEventListener('click', hideProfileOverlay);
        if (el.closeEditBtn) el.closeEditBtn.addEventListener('click', hideProfileOverlay);

        // Click on overlay to close
        if (el.profileOverlay) {
          el.profileOverlay.addEventListener('click', function(e) {
            if (e.target === el.profileOverlay) hideProfileOverlay();
          });
        }

        // Edit profile button
        if (el.showEditBtn) {
          el.showEditBtn.addEventListener('click', function() {
            clearAllErrors();
            if (el.notification) el.notification.style.display = 'none';
            showEditProfile();
          });
        }

        // Cancel edit button
        if (el.cancelEditBtn) {
          el.cancelEditBtn.addEventListener('click', function() {
            resetEditForm();
            showViewProfile();
          });
        }

        // Update profile button
        if (el.updateBtn) {
          el.updateBtn.addEventListener('click', function(e) {
            e.preventDefault();
            updateUserProfile();
          });
        }

        // Form keypress handling for enter key
        if (el.profileForm) {
          el.profileForm.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
              e.preventDefault();
              el.updateBtn && el.updateBtn.click();
            }
          });
        }
      }

      // Display UI functions
      function showProfileOverlay() {
        el.profileOverlay.classList.add('visible');
        document.body.classList.add('overlay-active');

        // Ensure edit container is hidden first
        el.editContainer.classList.remove('visible');
        el.editContainer.style.display = 'none';

        // Then show view container
        el.viewContainer.style.display = 'block';
        setTimeout(() => {
          el.viewContainer.classList.add('visible');
        }, 10);
      }

      function hideProfileOverlay() {
        el.profileOverlay.classList.remove('visible');
        document.body.classList.remove('overlay-active');

        // Reset UI after transition completes
        setTimeout(() => {
          if (!el.profileOverlay.classList.contains('visible')) {
            resetState();
          }
        }, 150);
      }

      function resetState() {
        // First remove visible classes
        el.viewContainer.classList.remove('visible');
        el.editContainer.classList.remove('visible');

        // Then explicitly set display to none
        el.viewContainer.style.display = 'none';
        el.editContainer.style.display = 'none';

        resetUpdateButton();
        clearAllErrors();
        if (el.notification) el.notification.style.display = 'none';
      }

      function showEditProfile() {
        // First hide view container completely
        el.viewContainer.classList.remove('visible');

        // Wait for animation to complete before hiding completely
        setTimeout(() => {
          el.viewContainer.style.display = 'none';

          // Then show edit container
          el.editContainer.style.display = 'block';

          // Force reflow
          el.editContainer.offsetHeight;

          // Add visible class to trigger animation
          requestAnimationFrame(() => {
            el.editContainer.classList.add('visible');
          });
        }, 150);
      }

      function showViewProfile() {
        // First hide edit container completely
        el.editContainer.classList.remove('visible');

        // Wait for animation to complete before hiding completely
        setTimeout(() => {
          el.editContainer.style.display = 'none';

          // Then show view container
          el.viewContainer.style.display = 'block';

          // Force reflow
          el.viewContainer.offsetHeight;

          // Add visible class to trigger animation
          requestAnimationFrame(() => {
            el.viewContainer.classList.add('visible');
          });
        }, 150);
      }

      function resetUpdateButton() {
        if (el.updateBtn) {
          el.updateBtn.innerHTML = 'Update Profile';
          el.updateBtn.disabled = false;
        }
      }

      // Error handling functions
      function clearAllErrors() {
        Object.values(el.errors).forEach(error => {
          if (error) {
            error.textContent = '';
            error.style.display = 'none';
          }
        });
      }

      function showError(field, message) {
        const error = el.errors[field];
        if (error) {
          error.textContent = message;
          error.style.display = 'block';
        }
      }

      function showNotification(message, isSuccess) {
        if (!el.notification) return;

        el.notification.textContent = message;
        el.notification.className = 'notification ' + (isSuccess ? 'success' : 'error');
        el.notification.style.display = 'block';

        if (isSuccess) {
          setTimeout(() => {
            el.notification.style.display = 'none';
          }, 3000);
        }
      }

      // Form validation
      function validateForm() {
        let isValid = true;
        clearAllErrors();

        // Username validation
        if (el.edit.username) {
          const value = el.edit.username.value.trim();
          if (!value) {
            showError('username', 'Username is required');
            isValid = false;
          } else if (value.length < 3) {
            showError('username', 'Username must be at least 3 characters');
            isValid = false;
          }
        }

        // Email validation - simple but effective regex
        if (el.edit.email) {
          const value = el.edit.email.value.trim();
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!value) {
            showError('email', 'Email is required');
            isValid = false;
          } else if (!emailRegex.test(value)) {
            showError('email', 'Please enter a valid email address');
            isValid = false;
          }
        }

        // Phone validation - simple digits check
        if (el.edit.phone) {
          const value = el.edit.phone.value.trim();
          const phoneRegex = /^\d{10,}$/;
          if (value && !phoneRegex.test(value)) {
            showError('phone', 'Please enter a valid phone number (at least 10 digits)');
            isValid = false;
          }
        }

        // Avatar file size validation
        if (el.avatarInput && el.avatarInput.files.length > 0) {
          const file = el.avatarInput.files[0];
          if (file.size > 5 * 1024 * 1024) { // 5MB
            showNotification('Image file size should not exceed 5MB', false);
            isValid = false;
          }
        }

        return isValid;
      }

      // Update user profile - AJAX submission
      function updateUserProfile() {
        if (el.notification) el.notification.style.display = 'none';

        if (!validateForm()) return;

        // Update button state
        if (el.updateBtn) {
          el.updateBtn.innerHTML = '<span class="loading-spinner"></span> Updating...';
          el.updateBtn.disabled = true;
        }

        // Build form data efficiently
        const formData = new FormData();

        // Add form fields - only include if they exist
        const fields = {
          'username': el.edit.username,
          'email': el.edit.email,
          'phoneNumber': el.edit.phone,
          'sex': el.edit.sex,
          'dateOfBirth': el.edit.dob
        };

        // Add fields efficiently
        Object.entries(fields).forEach(([key, element]) => {
          if (element && (key !== 'phoneNumber' || element.value.trim())) {
            formData.append(key, element.value.trim());
          }
        });

        // Add avatar if selected
        if (el.avatarInput && el.avatarInput.files.length > 0) {
          formData.append('userImg', el.avatarInput.files[0]);
        }

        // Add CSRF token
        if (el.csrfToken) {
          formData.append('_csrf', el.csrfToken.value);
        }

        // Set timeout for long requests
        const timeoutId = setTimeout(() => {
          resetUpdateButton();
          showNotification('Request timed out. The server might be processing your image or unavailable.', false);
        }, 20000);

        // Use modern fetch with AbortController for better performance
        const controller = window.AbortController ? new AbortController() : null;
        const signal = controller ? controller.signal : null;

        // Send AJAX request
        fetch('/user/update-profile', {
          method: 'POST',
          body: formData,
          credentials: 'same-origin',
          signal
        })
        .then(response => {
          clearTimeout(timeoutId);

          if (!response.ok) {
            return response.text().then(text => {
              try {
                return JSON.parse(text);
              } catch (e) {
                if (response.status === 403) {
                  throw new Error('Access denied. You may need to log in again.');
                } else {
                  throw new Error('Server returned an error: ' + response.status);
                }
              }
            });
          }

          return response.text().then(text => {
            try {
              return JSON.parse(text);
            } catch (e) {
              throw new Error('Invalid response format');
            }
          });
        })
        .then(data => {
          // Handle server validation errors
          if (data.success === false) {
            if (data.errors) {
              // Show field-specific errors
              Object.entries(data.errors).forEach(([field, message]) => {
                showError(field, message);
              });
              throw new Error('Please fix the errors above');
            } else {
              throw new Error(data.message || 'Update failed');
            }
          }

          // Success case
          resetUpdateButton();
          showNotification('Profile updated successfully!', true);
          updateViewProfile();

          // Update header username
          if (el.headerUsername && el.edit.username) {
            el.headerUsername.textContent = el.edit.username.value;
          }

          // Update avatars efficiently
          if (data.user && data.user.userImg) {
            const avatarUrl = data.user.userImg + '?t=' + Date.now();

            // Preload image once
            const img = new Image();
            img.onload = function() {
              el.avatars.forEach(avatar => {
                avatar.src = avatarUrl;
              });
            };
            img.src = avatarUrl;
          }

          // Switch back to view profile after delay
          setTimeout(showViewProfile, 1500);
        })
        .catch(error => {
          clearTimeout(timeoutId);
          resetUpdateButton();
          showNotification(error.message || 'Failed to update profile. Please try again.', false);
        });

        // Clean up AbortController after 20s if needed
        setTimeout(() => {
          if (controller) {
            try {
              controller.abort();
            } catch (e) {
              // Ignore errors
            }
          }
        }, 20000);
      }

      // Update view profile from edit form
      function updateViewProfile() {
        // Map edit fields to view fields
        const fieldPairs = [
          { edit: el.edit.username, view: el.view.username },
          { edit: el.edit.email, view: el.view.email },
          { edit: el.edit.phone, view: el.view.phone },
          { edit: el.edit.sex, view: el.view.sex }
        ];

        // Update each field efficiently
        fieldPairs.forEach(pair => {
          if (pair.edit && pair.view) {
            pair.view.value = pair.edit.value;
          }
        });

        // Format date properly
        if (el.edit.dob && el.view.dob && el.edit.dob.value) {
          const parts = el.edit.dob.value.split('-');
          if (parts.length === 3) {
            el.view.dob.value = `${parts[2]}/${parts[1]}/${parts[0]}`;
          }
        }
      }

      // Reset edit form from view data
      function resetEditForm() {
        // Map view fields to edit fields (reverse of updateViewProfile)
        const fieldPairs = [
          { view: el.view.username, edit: el.edit.username },
          { view: el.view.email, edit: el.edit.email },
          { view: el.view.phone, edit: el.edit.phone }
        ];

        // Update each field efficiently
        fieldPairs.forEach(pair => {
          if (pair.view && pair.edit) {
            pair.edit.value = pair.view.value;
          }
        });

        // Handle select dropdown for sex
        if (el.view.sex && el.edit.sex) {
          const sexValue = el.view.sex.value;
          for (let i = 0; i < el.edit.sex.options.length; i++) {
            if (el.edit.sex.options[i].value === sexValue) {
              el.edit.sex.selectedIndex = i;
              break;
            }
          }
        }

        // Convert date format (dd/mm/yyyy to yyyy-mm-dd)
        if (el.view.dob && el.edit.dob && el.view.dob.value) {
          const parts = el.view.dob.value.split('/');
          if (parts.length === 3) {
            el.edit.dob.value = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
          }
        }

        // Reset file input
        if (el.avatarInput) {
          el.avatarInput.value = '';
        }

        clearAllErrors();
        if (el.notification) {
          el.notification.style.display = 'none';
        }
      }
    }
  </script>
</header>
</body>
</html>
