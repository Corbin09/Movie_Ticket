<!-- footer.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Footer</title>
</head>
<body>
<!-- Footer Fragment -->
<footer th:fragment="footer" class="footer">
    <div class="container">
        <div class="footer-content">
            <!-- Logo and Intro Section - Now in same row -->
            <div class="footer-logo-section">
                <img th:src="@{/images/cinema_logo.png}" alt="Cinema Logo" class="logo">

                <p class="intro-text">
                    Get your tickets now for an amazing cinematic experience. From drama to comedy, there's a movie for everyone!
                </p>
            </div>

            <!-- Contact Section -->
            <div class="contact-section">
                <h3 class="section-title-footer">CONTACT US</h3>
                <div class="contact-info">
                    <a href="mailto:support@ercom.com">support@ercom.com</a><br>
                    <span>+66 2399 1145</span>
                </div>
            </div>

            <!-- Social Media Section -->
            <div class="social-section">
                <h3 class="section-title-footer">FOLLOW US</h3>
                <div class="social-icons">
                    <a href="#" class="social-icon"><i class="fab fa-facebook-square"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-twitter-square"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-github-square"></i></a>
                </div>
            </div>
        </div>

        <!-- Copyright -->
        <div class="copyright">
            Copyright 2025. NCC All Rights Reserved. Dev by SE2.vn
        </div>
    </div>
</footer>
</body>
</html>
