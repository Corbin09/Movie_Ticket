<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinemas Management System</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/ordersmanagement.css}">
</head>
<body>
<div class="container">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="cinema-logo">
        <i class="fas fa-ticket-alt cinema-logo-icon"></i>
      </div>
      <div class="logo-text">Cinemas</div>
    </div>

    <a th:href="@{/dashboard}" class="menu-item">
      <i class="fas fa-th-large"></i>
      <span>Dashboard</span>
    </a>

    <a th:href="@{/movies}" class="menu-item">
      <i class="fas fa-film"></i>
      <span>Movies</span>
    </a>

    <a th:href="@{/cinemas}" class="menu-item">
      <i class="fas fa-building"></i>
      <span>Cinemas</span>
    </a>

    <a th:href="@{/showtimes}" class="menu-item">
      <i class="fas fa-clock"></i>
      <span>Showtimes</span>
    </a>

    <a th:href="@{/rooms}" class="menu-item">
      <i class="fas fa-door-open"></i>
      <span>Rooms</span>
    </a>

    <a th:href="@{/orders}" class="menu-item active">
      <i class="fas fa-shopping-cart"></i>
      <span>Orders</span>
    </a>

    <a th:href="@{/users}" class="menu-item">
      <i class="fas fa-users"></i>
      <span>Users</span>
    </a>

    <a th:href="@{/}" class="menu-item">
      <i class="fas fa-home"></i>
      <span>Homepage</span>
    </a>
  </aside>

  <!-- Mobile menu toggle button -->
  <button class="sidebar-toggle" id="sidebarToggle">
    <i class="fas fa-bars"></i>
  </button>

  <!-- Main content -->
  <div class="main-content">
    <!-- Top navbar -->
    <div class="navbar">
      <div class="user-info">
        <img th:src="@{/images/avatar.jpg}" alt="User Avatar" class="user-avatar" />
        <span class="user-name" th:text="${currentUser != null ? currentUser.fullName : 'Phan Thuy Ngan'}">Phan Thuy Ngan</span>
        <a th:href="@{/logout}" class="logout-btn">Log out</a>
      </div>
    </div>

    <!-- Page title -->
    <h1 class="page-title">Orders Management</h1>

    <!-- Filter and search -->
    <div class="filter-area">
      <span class="filter-label">Filter:</span>
      <div class="filter-dropdown">
        <div class="dropdown-toggle">
          <span>User Name</span>
          <i class="fas fa-chevron-down"></i>
        </div>
      </div>
      <div class="search-bar">
        <div class="search-icon">
          <i class="fas fa-search"></i>
        </div>
        <input type="text" class="search-input" placeholder="Search..." />
      </div>
    </div>

    <!-- Orders table -->
    <table class="data-table">
      <thead>
      <tr>
        <th class="checkbox-cell">
          <input type="checkbox" class="custom-checkbox" />
        </th>
        <th>Order Code</th>
        <th>User</th>
        <th>Movie</th>
        <th>Theater</th>
        <th>Room</th>
        <th>Show Date</th>
        <th>Order Value</th>
        <th>Order Date</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="order : ${orders}">
        <td class="checkbox-cell">
          <input type="checkbox" class="custom-checkbox" />
        </td>
        <td th:text="${order.orderId}">191108889</td>
        <td th:text="${order.user != null ? order.user.fullName : 'N/A'}">Christine Brooks</td>
        <td th:text="${order.showtime != null && order.showtime.movie != null ? order.showtime.movie.title : 'N/A'}">Snow White</td>
        <td th:text="${order.showtime != null && order.showtime.room != null && order.showtime.room.cinema != null ? order.showtime.room.cinema.name : 'N/A'}">Beta Thanh Xuan</td>
        <td th:text="${order.showtime != null && order.showtime.room != null ? order.showtime.room.name : 'N/A'}">Room 1</td>
        <td th:text="${order.showtime != null ? #dates.format(order.showtime.startTime, 'dd/MM/yyyy') : 'N/A'}">15/3/2025</td>
        <td th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT') + ' VND'}">360.000 VND</td>
        <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy')}">15/3/2025</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<script th:inline="javascript">
  // Toggle sidebar on mobile
  document.getElementById('sidebarToggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('active');
  });

  // Handle responsive behavior
  window.addEventListener('resize', function() {
      if (window.innerWidth > 992) {
          document.getElementById('sidebar').classList.remove('active');
      }
  });
</script>
</body>
</html>
