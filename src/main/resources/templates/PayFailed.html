<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <style>
        @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");

        * {
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0px;
            height: 100%;
        }

        /* a blue color as a generic focus style */
        button:focus-visible {
            outline: 2px solid #4a90e2 !important;
            outline: -webkit-focus-ring-color auto 5px !important;
        }

        a {
            text-decoration: none;
        }

        .overlay-scan-qr {
            width: 1280px;
            height: 1376px;
            background-color: #625b5bd1;
        }

        .overlay-scan-qr .background-border {
            position: relative;
            width: 757px;
            height: 520px;
            top: 416px;
            left: 279px;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid;
            border-color: #e5e7eb;
            box-shadow: 0px 4px 6px -4px #0000001a, 0px 10px 15px -3px #0000001a;
        }

        .overlay-scan-qr .SVG {
            position: absolute;
            width: 62px;
            height: 61px;
            top: 36px;
            left: 348px;
        }

        .overlay-scan-qr .text-wrapper {
            width: 357px;
            height: 24px;
            top: 121px;
            left: 200px;
            font-family: "Poppins-Bold", Helvetica;
            font-weight: 700;
            color: #dc2626;
            font-size: 36px;
            text-align: center;
            letter-spacing: -0.45px;
            line-height: 28px;
            position: absolute;
            white-space: nowrap;
        }

        .overlay-scan-qr .div {
            position: absolute;
            width: 491px;
            height: 39px;
            top: 170px;
            left: 133px;
            font-family: "Inter-Regular", Helvetica;
            font-weight: 400;
            color: #dc2626;
            font-size: 20px;
            text-align: center;
            letter-spacing: 0;
            line-height: 20px;
        }

        .overlay-scan-qr .frame {
            display: flex;
            flex-direction: column;
            width: 316px;
            align-items: flex-start;
            gap: 31px;
            position: absolute;
            top: 260px;
            left: 89px;
        }

        .overlay-scan-qr .group {
            position: relative;
            width: 264px;
            height: 21.2px;
        }

        .overlay-scan-qr .text-wrapper-2 {
            position: absolute;
            width: 89px;
            height: 19px;
            top: 2px;
            left: 0;
            font-family: "Inter-SemiBold", Helvetica;
            font-weight: 600;
            color: #374151;
            font-size: 20px;
            letter-spacing: 0;
            line-height: 20px;
            white-space: nowrap;
        }

        .overlay-scan-qr .text-wrapper-3 {
            position: absolute;
            width: 153px;
            height: 19px;
            top: 0;
            left: 107px;
            font-family: "Inter-Regular", Helvetica;
            font-weight: 400;
            color: #374151;
            font-size: 20px;
            letter-spacing: 0;
            line-height: 20px;
            white-space: nowrap;
        }

        .overlay-scan-qr .group-2 {
            position: relative;
            width: 320.25px;
            height: 22px;
            margin-right: -4.00px;
        }

        .overlay-scan-qr .img {
            position: absolute;
            width: 31px;
            height: 22px;
            top: 0;
            left: 0;
        }

        .overlay-scan-qr .overlap-group {
            position: absolute;
            width: 277px;
            height: 19px;
            top: 0;
            left: 39px;
        }

        .overlay-scan-qr .text-wrapper-4 {
            width: 193px;
            height: 19px;
            top: 0;
            left: 0;
            font-family: "Inter-SemiBold", Helvetica;
            font-weight: 600;
            color: #374151;
            font-size: 20px;
            letter-spacing: 0;
            line-height: 20px;
            position: absolute;
            white-space: nowrap;
        }

        .overlay-scan-qr .text-wrapper-5 {
            position: absolute;
            width: 89px;
            height: 19px;
            top: 0;
            left: 188px;
            font-family: "Inter-Medium", Helvetica;
            font-weight: 500;
            color: #ef4444;
            font-size: 20px;
            letter-spacing: 0;
            line-height: 20px;
            white-space: nowrap;
        }

        .overlay-scan-qr .group-3 {
            position: relative;
            width: 236.83px;
            height: 24px;
        }

        .overlay-scan-qr .text-wrapper-6 {
            position: absolute;
            width: 142px;
            height: 19px;
            top: 1px;
            left: 0;
            font-family: "Inter-SemiBold", Helvetica;
            font-weight: 600;
            color: #374151;
            font-size: 20px;
            letter-spacing: 0;
            line-height: 20px;
            white-space: nowrap;
        }

        .overlay-scan-qr .text-wrapper-7 {
            position: absolute;
            width: 84px;
            height: 24px;
            top: 0;
            left: 149px;
            font-family: "Inter-Bold", Helvetica;
            font-weight: 700;
            color: #111827;
            font-size: 17.4px;
            letter-spacing: 0;
            line-height: 28px;
            white-space: nowrap;
        }

        .overlay-scan-qr .button {
            all: unset;
            box-sizing: border-box;
            position: absolute;
            width: 295px;
            height: 54px;
            top: 426px;
            left: 65px;
            background-color: #ef4444;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0px 1px 2px -1px #0000001a, 0px 1px 3px #0000001a;
            cursor: pointer;
        }

        .overlay-scan-qr .text-wrapper-8 {
            position: absolute;
            width: 153px;
            height: 19px;
            top: 17px;
            left: 71px;
            font-family: "Inter-Medium", Helvetica;
            font-weight: 500;
            color: #ffffff;
            font-size: 20px;
            text-align: center;
            letter-spacing: 0;
            line-height: 20px;
            white-space: nowrap;
        }

        .overlay-scan-qr .div-wrapper {
            all: unset;
            box-sizing: border-box;
            position: absolute;
            width: 295px;
            height: 52px;
            top: 426px;
            left: 397px;
            background-color: #ffffff;
            border-radius: 6px;
            border: 1px solid;
            border-color: #3349ef;
            box-shadow: 0px 1px 2px #0000000d;
            cursor: pointer;
        }

        .overlay-scan-qr .text-wrapper-9 {
            position: absolute;
            width: 171px;
            height: 19px;
            top: 15px;
            left: 63px;
            font-family: "Inter-Medium", Helvetica;
            font-weight: 500;
            color: #3449f0;
            font-size: 20px;
            text-align: center;
            letter-spacing: 0;
            line-height: 20px;
            white-space: nowrap;
        }
    </style>
</head>

<body>
<div class="overlay-scan-qr">
    <div class="background-border">
        <img class="SVG" th:src="@{/img/error-icon.svg}" alt="Payment Failed Icon" />
        <div class="text-wrapper">Payment Failed</div>
        <p class="div">Your payment was unsuccessful. Please try again or select another payment method.</p>
        <div class="frame">
            <div class="group">
                <div class="text-wrapper-2">Order ID:</div>
                <div class="text-wrapper-3" th:text="${order.id}">752781397</div>
            </div>
            <div class="group-2">
                <img class="img" th:src="@{/img/payment-icon.svg}" alt="Payment Method Icon" />
                <div class="overlap-group">
                    <div class="text-wrapper-4">Payment method:</div>
                    <div class="text-wrapper-5" th:text="${order.paymentMethod}">Momo</div>
                </div>
            </div>
            <div class="group-3">
                <div class="text-wrapper-6">Total amount:</div>
                <div class="text-wrapper-7" th:text="${'$' + #numbers.formatDecimal(order.totalAmount, 1, 2)}">$90.00</div>
            </div>
        </div>
        <button class="button" th:onclick="'window.location.href=\'' + @{/payment/retry(orderId=${order.id})} + '\''">
            <div class="text-wrapper-8">Retry Payment</div>
        </button>
        <button class="div-wrapper" th:onclick="'window.location.href=\'' + @{/payment/cod(orderId=${order.id})} + '\''">
            <div class="text-wrapper-9">Pay on Delivery</div>
        </button>
    </div>
</div>
</body>

</html>
