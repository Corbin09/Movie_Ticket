<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Movie Management</title>
    <link rel="stylesheet" th:href="@{/css/header_sidebar.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<div th:replace="~{fragments/header_admin_sidebar :: header_sidebar}"></div>

<div class="container-orders-management">
    <div class="main-content">
        <h1 class="page-title">Movies Management</h1>

        <form id="filterForm" method="get" th:action="@{/manage-movies}">
            <div class="filter-area">
                <div class="filter-label">Sort by:</div>
                <div class="filter-dropdown">
                    <input type="hidden" name="searchCriteria" id="searchCriteriaInput" th:value="${searchCriteria}"/>
                    <div class="dropdown-toggle" id="searchCriteria">
                        <span id="filterLabel">Normal</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="dropdown-menu" id="searchCriteriaDropdown">
                        <div class="dropdown-item" data-value="normal">Normal</div>
                        <div class="dropdown-item" data-value="name_asc">A - Z</div>
                        <div class="dropdown-item" data-value="status_now">Now Showing</div>
                        <div class="dropdown-item" data-value="status_soon">Coming Soon</div>
                        <div class="dropdown-item" data-value="age_low">Age limit (Low to High)</div>
                    </div>
                </div>
                <div class="search-bar">
                    <input type="text" class="search-input" name="searchQuery" id="searchQuery"
                           placeholder="Search..." th:value="${searchQuery}" />
                    <button type="submit" class="search-icon"><i class="fas fa-search"></i></button>
                </div>
                <button type="button" class="btn btn-primary" onclick="window.location.href='/manage-movies/add-movie'" style="margin-left: auto;">
                    <i class="fas fa-plus"></i> Add movie
                </button>
            </div>
        </form>

        <div th:if="${errorMessage}" id="errorMessageContainer" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th><input type="checkbox" id="selectAll"></th>
                    <th>Movie Name</th>
                    <th>Description</th>
                    <th>Age limit</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="film : ${films}">
                    <td><input type="checkbox" class="movie-checkbox" th:data-id="${film.filmId}"></td>
                    <td th:text="${film.filmName}"></td>
                    <td th:text="${film.filmDescription != null ? film.filmDescription : 'N/A'}"></td>
                    <td th:text="${film.ageLimit != null ? film.ageLimit : 'N/A'}"></td>
                    <td th:text="${film.duration != null ? film.duration + ' min' : 'N/A'}"></td>
                    <td th:text="${film.releaseDate != null && film.releaseDate <= T(java.time.LocalDate).now() ? 'Now Showing' : 'Coming Soon'}"></td>
                    <td>
                        <a th:href="@{'/manage-movies/edit-movie/' + ${film.filmId}}" class="btn btn-info">Edit</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(films)}">
                    <td colspan="7" class="text-center">No movie found</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <span th:text="'Showing '
            + ${#numbers.formatInteger(((currentPage - 1) * pageSize + 1), 0)} + '-'
            + ${#numbers.formatInteger(((currentPage * pageSize > totalItems) ? totalItems : currentPage * pageSize), 0)} + ' of ' + ${totalItems}">
                    Showing 1-10 of 10
            </span>
            <div class="pagination-controls">
                <button class="btn btn-danger" id="deleteSelected" disabled>Delete</button>
                <div class="page-size-container">
                    <span class="lines-per-page-label">Lines per page:</span>
                    <select id="pageSizeSelect">
                        <option value="10" th:selected="${pageSize == 10}">10</option>
                        <option value="20" th:selected="${pageSize == 20}">20</option>
                        <option value="30" th:selected="${pageSize == 30}">30</option>
                    </select>
                </div>
                <form method="get" th:action="@{/manage-movies}" style="display: flex;">
                    <input type="hidden" name="page" th:value="${currentPage - 1}"/>
                    <input type="hidden" name="size" th:value="${pageSize}"/>
                    <button id="prevPage" th:disabled="${currentPage <= 1}"><i class="fas fa-chevron-left"></i></button>
                </form>
                <form method="get" th:action="@{/manage-movies}" style="display: flex;">
                    <input type="hidden" name="page" th:value="${currentPage + 1}"/>
                    <input type="hidden" name="size" th:value="${pageSize}"/>
                    <button id="nextPage" th:disabled="${currentPage >= totalPages}"><i class="fas fa-chevron-right"></i></button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const selectAll = document.getElementById("selectAll");
        const deleteBtn = document.getElementById("deleteSelected");

        function getCheckboxes() {
            return document.querySelectorAll(".movie-checkbox");
        }

        function toggleDeleteButton() {
            const anyChecked = [...getCheckboxes()].some(cb => cb.checked);
            deleteBtn.disabled = !anyChecked;
        }

        function bindCheckboxEvents() {
            getCheckboxes().forEach(cb => cb.addEventListener("change", toggleDeleteButton));
        }

        bindCheckboxEvents(); // Gắn ngay khi trang vừa load

        if (selectAll) {
            selectAll.addEventListener("change", () => {
                const checkboxes = getCheckboxes();
                checkboxes.forEach(cb => cb.checked = selectAll.checked);
                toggleDeleteButton();
            });
        }

        deleteBtn.addEventListener("click", () => {
            const selectedIds = [...getCheckboxes()]
                .filter(cb => cb.checked)
                .map(cb => cb.getAttribute("data-id"));

            if (selectedIds.length > 0 && confirm("Are you sure you want to delete selected movies?")) {
                console.log("Sending delete IDs: ", selectedIds);

                fetch("/manage-movies/delete-movies", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRF-TOKEN": document.querySelector("meta[name='_csrf']").content
                    },
                    body: JSON.stringify({ ids: selectedIds })
                }).then(res => res.text().then(text => {
                    if (res.ok) {
                        alert(text);
                        window.location.reload();
                    } else {
                        alert("Failed to delete: " + text);
                    }
                }))
                .catch(err => alert("Error: " + err));
            }
        });

        // filter dropdown
        const toggle = document.getElementById("searchCriteria");
        const dropdown = document.getElementById("searchCriteriaDropdown");

        if (toggle && dropdown) {
            toggle.addEventListener("click", () => {
                dropdown.classList.toggle("show");
            });

            document.addEventListener("click", (event) => {
                if (!toggle.contains(event.target)) {
                    dropdown.classList.remove("show");
                }
            });

            document.querySelectorAll(".dropdown-item").forEach(item => {
                item.addEventListener("click", () => {
                    const value = item.getAttribute("data-value");
                    document.getElementById("filterLabel").textContent = item.textContent;
                    fetchFilteredMovies(value);
                });
            });
        }

        function fetchFilteredMovies(criteria) {
            fetch(`/api/filtered-movies?criteria=${criteria}&page=1&size=10`)
                .then(response => response.json())
                .then(data => {
                    renderMovieTable(data.films);
                    toggleDeleteButton();
                })
                .catch(err => console.error("Fetch error:", err));
        }

        function renderMovieTable(films) {
            const tbody = document.querySelector("table tbody");
            tbody.innerHTML = "";

            if (!films || films.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center">No movie found</td></tr>`;
                return;
            }

            films.forEach(film => {
                const releaseDate = new Date(film.releaseDate);
                const today = new Date();
                const status = releaseDate <= today ? "Now Showing" : "Coming Soon";

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td><input type="checkbox" class="movie-checkbox" data-id="${film.filmId}"></td>
                    <td>${film.filmName}</td>
                    <td>${film.filmDescription || 'N/A'}</td>
                    <td>${film.ageLimit ?? 'N/A'}</td>
                    <td>${film.duration ? film.duration + ' min' : 'N/A'}</td>
                    <td>${status}</td>
                    <td><a href="/manage-movies/edit-movie/${film.filmId}" class="btn btn-info">Edit</a></td>
                `;
                tbody.appendChild(row);
            });

            bindCheckboxEvents(); // Gắn lại checkbox sau khi cập nhật
        }

        toggleDeleteButton(); // trạng thái ban đầu
    });
</script>


</body>
</html>
