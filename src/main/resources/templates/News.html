<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title> News </title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/news.css}" />
  <link rel="stylesheet" th:href="@{/css/header_user.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />
</head>

<body>
<!-- Header -->
<div th:replace="fragments/header_user :: header"></div>
<div style="height: 132px;" class="adding-margin"></div>
<section class="latest-news">
  <h2>LATEST NEWS</h2>
  <div class="news-container">
    <div class="main-news" th:each="news : ${latestNews}">
      <img th:src="${news.newsImg}" alt="News Image">
<!--      <h3 th:text="${news.newsHeader}"></h3>-->
      <div th:utext="${news.newsContent}"></div>
      <h3 th:text="${news.newsFooter}"></h3>-->
      <!-- Manual date formatting -->
      <div class="news-ps">
      <span th:text="'Date: ' + ${#dates.format(news.newsTime, 'dd/MM/yyyy')}"></span>
      <span th:text="'Write by: ' + ${news.user.username}"></span>
      </div>
    </div>
    <div class="news-list">
      <div class="news-item" th:each="review : ${newsReviews}">
        <img th:src="${review.newsImg}" alt="Review Image">
        <div class="review-metadata">
        <p th:text="'Review: ' + ${review.newsHeader}"></p>
        <span th:text="'Date: ' + ${#dates.format(review.newsTime, 'dd/MM/yyyy')}"></span>
        <span th:text="'Write by: ' + ${review.user.username}"></span>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="movie-section">
  <h2>VIETNAMESE MOVIES</h2>
  <div class="movie-grid">
    <div th:each="movie : ${vnMovies}" class="movie-card">
      <a th:href="@{'/films/' + ${movie.filmId}}">
        <img th:src="${movie.filmImg}" th:alt="${movie.filmName}" class="movie-poster"/>
        <div class="movie-info">
          <p th:text="${#lists.isEmpty(movie.categoryNames) ? 'N/A' : #strings.arrayJoin(movie.categoryNames, ', ')}"></p>
          <p th:text="${movie.formattedReleaseDate}"></p>
          <p th:text="${movie.filmName}"></p>
        </div>
      </a>
    </div>
  </div>
</section>

<div class="pagination-container" th:if="${vnPages > 0}">
  <div class="pagination">

    <!-- Nút Previous -->
    <a th:if="${currentVnPage > 1}"
       th:href="@{'/news?vnPage=' + (${currentVnPage - 1})}"
       class="page-item prev-page">&laquo;</a>
    <span th:if="${currentVnPage == 1}" class="page-item prev-page disabled">&laquo;</span>

    <!-- Các trang (loop) -->
    <a th:each="page : ${#numbers.sequence(1, vnPages)}"
       th:href="@{'/news?vnPage=' + ${page}}"
       class="page-item"
       th:classappend="${currentVnPage == page} ? 'active' : ''"
       th:text="${page}"></a>

    <!-- Nút Next -->
    <a th:if="${currentVnPage < vnPages}"
       th:href="@{'/news?vnPage=' + (${currentVnPage + 1})}"
       class="page-item next-page">&raquo;</a>
    <span th:if="${currentVnPage == vnPages}" class="page-item next-page disabled">&raquo;</span>

  </div>
</div>


<section class="movie-section">
  <h2>INTERNATIONAL MOVIES</h2>
  <div class="movie-grid">
    <div th:each="movie : ${intMovies}" class="movie-card">
      <a th:href="@{'/films/' + ${movie.filmId}}">
        <img th:src="${movie.filmImg}" th:alt="${movie.filmName}" class="movie-poster"/>
        <div class="movie-info">
          <p th:text="${#lists.isEmpty(movie.categoryNames) ? 'N/A' : #strings.arrayJoin(movie.categoryNames, ', ')}"></p>
          <p th:text="${movie.formattedReleaseDate}"></p>
          <p th:text="${movie.filmName}"></p>
        </div>
      </a>
    </div>
  </div>
</section>

<!-- Pagination cho danh sách phim Quốc tế -->
<div class="pagination-container" th:if="${intPages > 0}">
  <div class="pagination">

    <!-- Nút Previous -->
    <a th:if="${currentIntPage > 1}"
       th:href="@{'/news?intPage=' + (${currentIntPage - 1})}"
       class="page-item prev-page">&laquo;</a>
    <span th:if="${currentIntPage == 1}" class="page-item prev-page disabled">&laquo;</span>

    <!-- Các trang (loop) -->
    <a th:each="page : ${#numbers.sequence(1, intPages)}"
       th:href="@{'/news?intPage=' + ${page}}"
       class="page-item"
       th:classappend="${currentIntPage == page} ? 'active' : ''"
       th:text="${page}"></a>

    <!-- Nút Next -->
    <a th:if="${currentIntPage < intPages}"
       th:href="@{'/news?intPage=' + (${currentIntPage + 1})}"
       class="page-item next-page">&raquo;</a>
    <span th:if="${currentIntPage == intPages}" class="page-item next-page disabled">&raquo;</span>

  </div>
</div>



<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
