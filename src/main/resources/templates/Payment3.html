<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <style>
        :root {
          --white: rgba(255, 255, 255, 1);
          --back: rgba(2, 7, 0, 1);
          --single-line-body-small-strong-font-family: "Inter", Helvetica;
          --single-line-body-small-strong-font-weight: 600;
          --single-line-body-small-strong-font-size: 14px;
          --single-line-body-small-strong-letter-spacing: 0px;
          --single-line-body-small-strong-line-height: 100%;
          --single-line-body-small-strong-font-style: normal;
        }

        @import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap');

        * {
          -webkit-font-smoothing: antialiased;
          box-sizing: border-box;
        }

        html, body {
          margin: 0px;
          height: 100%;
          background-color: var(--back);
        }

        button:focus-visible {
          outline: 2px solid #4a90e2 !important;
          outline: -webkit-focus-ring-color auto 5px !important;
        }

        a {
          text-decoration: none;
        }

        .payment-rearrange {
          width: 100%;
          max-width: 1280px;
          margin: 0 auto;
          background-color: var(--back);
          position: relative;
        }

        .overlap {
          position: relative;
        }

        .frame {
          position: relative;
          width: 100%;
          background-color: var(--back);
          overflow: hidden;
        }

        .overlap-group {
          position: relative;
          width: 100%;
        }

        .overlap-2 {
          position: relative;
          width: 100%;
        }

        .ellipse {
          position: absolute;
          width: 448px;
          height: 448px;
          top: 0;
          right: 0;
          background-color: #1de782;
          border-radius: 224px;
          filter: blur(275px);
        }

        .movie-banner {
          position: relative;
          width: 100%;
          height: 258px;
          background-size: cover;
          background-position: center;
        }

        .rectangle {
          position: absolute;
          width: 100%;
          height: 100%;
          top: 0;
          left: 0;
          background-color: rgba(53, 63, 57, 0.5);
        }

        .movie-poster {
          position: absolute;
          width: 200px;
          height: 300px;
          top: 30px;
          left: 30px;
          border-radius: 8px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
          object-fit: cover;
        }

        .movie-title {
          position: absolute;
          top: 150px;
          left: 250px;
          font-family: "Poppins", sans-serif;
          font-weight: 700;
          color: #ffffff;
          font-size: 42px;
          letter-spacing: 0;
          line-height: 66px;
          white-space: nowrap;
        }

        .progress-bar {
          display: flex;
          align-items: center;
          gap: 95px;
          position: relative;
          margin: 30px auto;
          max-width: 800px;
          justify-content: center;
        }

        .step {
          position: relative;
          display: flex;
          align-items: center;
        }

        .step-number {
          width: 34px;
          height: 33px;
          background-color: #7a7474;
          border-radius: 5px;
          display: flex;
          justify-content: center;
          align-items: center;
          font-family: "Inter", sans-serif;
          font-weight: 600;
          color: #ffffff;
          font-size: 17px;
        }

        .step-text {
          margin-left: 10px;
          font-family: "Inter", sans-serif;
          font-weight: 600;
          color: #ffffff;
          font-size: 17px;
          letter-spacing: 0;
          line-height: 17px;
          white-space: nowrap;
        }

        .active-step .step-number {
          background-color: #ee1616;
        }

        .payment-container {
          position: relative;
          max-width: 782px;
          height: 410px;
          margin: 20px auto;
          background-color: #1e282f;
          border-radius: 18px;
          border: 1px solid #ffffff;
        }

        .payment-title {
          padding: 30px 0 0 33px;
          font-family: "Inter", sans-serif;
          font-weight: 700;
          color: #09b54e;
          font-size: 16px;
          letter-spacing: 0;
          line-height: 24px;
        }

        .horizontal-line {
          width: 100%;
          height: 1px;
          background-color: #ffffff;
          margin: 20px 0;
        }

        .payment-options {
          padding: 0 33px;
        }

        .payment-option {
          display: flex;
          align-items: center;
          padding: 15px 0;
          border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .payment-option:last-child {
          border-bottom: none;
        }

        .payment-radio {
          width: 21px;
          height: 21px;
          cursor: pointer;
          margin-right: 15px;
        }

        .payment-icon {
          width: 32px;
          height: 32px;
          margin-right: 15px;
          border-radius: 4px;
          object-fit: cover;
        }

        .payment-label {
          font-family: "Inter", sans-serif;
          font-weight: 400;
          color: #ffffff;
          font-size: 16px;
          letter-spacing: 0;
          line-height: 24px;
        }

        .action-buttons {
          display: flex;
          justify-content: space-between;
          max-width: 782px;
          margin: 20px auto;
        }

        .cancel-btn {
          width: 380px;
          height: 47px;
          background-color: #262223;
          border-radius: 5px;
          border: 1px solid #f12222;
          font-family: "Poppins", sans-serif;
          font-weight: 700;
          color: #f12222;
          font-size: 14px;
          text-align: center;
          letter-spacing: 0.29px;
          line-height: 16.8px;
          cursor: pointer;
        }

        .next-btn {
          width: 380px;
          height: 47px;
          background-color: #f12222;
          border-radius: 5px;
          border: none;
          font-family: "Poppins", sans-serif;
          font-weight: 700;
          color: #ffffff;
          font-size: 14px;
          text-align: center;
          letter-spacing: 2.1px;
          line-height: 16.8px;
          cursor: pointer;
        }

        .reminder-box {
          position: absolute;
          width: 299px;
          height: 130px;
          top: 350px;
          left: 30px;
          background-color: #b51a09;
          border-radius: 5px;
          padding: 19px 15px;
        }

        .reminder-title {
          font-family: var(--single-line-body-small-strong-font-family);
          font-weight: var(--single-line-body-small-strong-font-weight);
          color: #ffffff;
          font-size: var(--single-line-body-small-strong-font-size);
          letter-spacing: var(--single-line-body-small-strong-letter-spacing);
          line-height: var(--single-line-body-small-strong-line-height);
          white-space: nowrap;
          font-style: var(--single-line-body-small-strong-font-style);
          margin-bottom: 10px;
        }

        .reminder-text {
          font-family: "Inter", sans-serif;
          color: #ffffff;
          font-size: 13px;
          text-align: justify;
          line-height: 1.4;
        }

        .ellipse-2 {
          position: absolute;
          width: 448px;
          height: 448px;
          bottom: 0;
          left: 0;
          background-color: #1de782;
          border-radius: 224px;
          filter: blur(275px);
          z-index: -1;
        }

        /* Responsive adjustments */
        @media screen and (max-width: 768px) {
          .movie-title {
            font-size: 32px;
            left: 200px;
          }

          .progress-bar {
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
          }

          .action-buttons {
            flex-direction: column;
            gap: 15px;
            align-items: center;
          }

          .cancel-btn, .next-btn {
            width: 100%;
            max-width: 380px;
          }

          .reminder-box {
            position: relative;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 20px;
          }
        }
    </style>
</head>
<body>
<header th:replace="fragments/header :: header"></header>

<div class="payment-rearrange">
    <div class="overlap">
        <div class="frame">
            <div class="overlap-group">
                <div class="ellipse"></div>

                <!-- Movie Banner Section -->
                <div class="overlap-2">
                    <div class="movie-banner" style="background-image: url('/img/image.png');">
                        <div class="rectangle"></div>
                    </div>
                    <img class="movie-poster" src="/img/image-4.png" alt="Inuyasha Poster" />
                    <div class="movie-title">INUYASHA</div>
                </div>

                <!-- Progress Bar -->
                <div class="progress-bar">
                    <div class="step">
                        <div class="step-number">01</div>
                        <div class="step-text">PICK SEAT</div>
                    </div>
                    <div class="step">
                        <div class="step-number">02</div>
                        <div class="step-text">POPCORNS</div>
                    </div>
                    <div class="step active-step">
                        <div class="step-number">03</div>
                        <div class="step-text">PAY</div>
                    </div>
                    <div class="step">
                        <div class="step-number">04</div>
                        <div class="step-text">TICKET</div>
                    </div>
                </div>

                <!-- Reminder Box -->
                <div class="reminder-box">
                    <div class="reminder-title">REMINDER:</div>
                    <p class="reminder-text">
                        Purchased tickets cannot be exchanged or refunded. The ticket code will be sent once to the email
                        you've entered. Please check your information carefully before proceeding.
                    </p>
                </div>

                <!-- Payment Container -->
                <div class="payment-container">
                    <div class="payment-title">CHOOSE PAYMENT METHOD</div>
                    <div class="horizontal-line"></div>

                    <div class="payment-options">
                        <div class="payment-option">
                            <input type="radio" name="paymentMethod" id="cashPayment" class="payment-radio" value="cash">
                            <img class="payment-icon" src="/img/image-42.png" alt="Cash Icon">
                            <label for="cashPayment" class="payment-label">Cash payment (Physical currency transaction)</label>
                        </div>

                        <div class="payment-option">
                            <input type="radio" name="paymentMethod" id="momoPayment" class="payment-radio" value="momo">
                            <img class="payment-icon" src="/img/ea880ef285856f7.png" alt="Momo Icon">
                            <label for="momoPayment" class="payment-label">Momo Wallet (Mobile money app (Vietnam))</label>
                        </div>

                        <div class="payment-option">
                            <input type="radio" name="paymentMethod" id="viettelPayment" class="payment-radio" value="viettel">
                            <img class="payment-icon" src="/img/d7ac8660aa.jpg" alt="Viettel Icon">
                            <label for="viettelPayment" class="payment-label">Viettel Money (Viettel's mobile payment service)</label>
                        </div>

                        <div class="payment-option">
                            <input type="radio" name="paymentMethod" id="visaPayment" class="payment-radio" value="visa">
                            <img class="payment-icon" src="/img/image-2.png" alt="Card Icon">
                            <label for="visaPayment" class="payment-label">Visa/Master/JCB (Global credit/debit card brands)</label>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="cancel-btn" id="cancelBtn">CANCEL</button>
                    <button class="next-btn" id="nextBtn">NEXT</button>
                </div>

                <!-- Bottom Glow -->
                <div class="ellipse-2"></div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>

<script>
    document.addEventListener('DOMContentLoaded', function() {
      // Get all radio buttons
      const paymentOptions = document.querySelectorAll('input[name="paymentMethod"]');

      // Add click event to each payment option
      paymentOptions.forEach(option => {
        option.addEventListener('change', function() {
          // Reset all options
          paymentOptions.forEach(opt => {
            opt.parentElement.style.backgroundColor = 'transparent';
          });

          // Highlight selected option
          if (this.checked) {
            this.parentElement.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
          }
        });
      });

      // Button event handlers
      document.getElementById('cancelBtn').addEventListener('click', function() {
        // Handle cancel action - go back to previous page
        window.history.back();
      });

      document.getElementById('nextBtn').addEventListener('click', function() {
        // Get selected payment method
        const selectedPayment = document.querySelector('input[name="paymentMethod"]:checked');

        if (selectedPayment) {
          // Form submission or redirect to next page
          window.location.href = '/ticket?paymentMethod=' + selectedPayment.value;
        } else {
          // Show error or alert if no payment method selected
          alert('Please select a payment method to continue.');
        }
      });
    });
</script>
</body>
</html>
